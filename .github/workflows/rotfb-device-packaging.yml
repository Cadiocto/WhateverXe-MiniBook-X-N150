name: ROTFB offline device packaging

on:
  workflow_dispatch:

concurrency:
  group: rotfb-device-packaging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      ROTFB_SOURCE_SHA: 8e2a6e8f246c43c151793046934bcb848371768d
      UPSTREAM_SHA: 098e95820891f8a83fae679daece7fcf58b7b3a4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8e2a6e8f246c43c151793046934bcb848371768d

      - name: Initialize diagnostics
        if: always()
        run: |
          mkdir -p rotfb-package-logs rotfb-package-staging
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "workflow_commit=$GITHUB_SHA"
            echo "source_sha=$ROTFB_SOURCE_SHA"
            echo "upstream_sha=$UPSTREAM_SHA"
          } > rotfb-package-logs/run-metadata.txt

      - name: Build IPS repository and kernel payload on OpenIndiana 2026.10
        id: package_build
        uses: vmactions/openindiana-vm@v1
        with:
          release: "202610-build"
          arch: x86_64
          mem: 8192
          cpu: 4
          sync: nfs
          prepare: |
            set -eux
            mkdir -p "$GITHUB_WORKSPACE/rotfb-package-logs"
            pkg refresh > "$GITHUB_WORKSPACE/rotfb-package-logs/ips-refresh.log" 2>&1
            pkg install --accept developer/build/gnu-make developer/build/onbld developer/versioning/git shell/ksh93 runtime/perl-542 runtime/perl-542/module/sun-solaris > "$GITHUB_WORKSPACE/rotfb-package-logs/ips-install.log" 2>&1
            test "$(/usr/bin/perl -V:version)" = "version='5.42.3';"
            test "$(/usr/bin/perl -V:archname)" = "archname='i86pc-solaris-thread-multi-64';"
          run: |
            set -eu
            LOG="$GITHUB_WORKSPACE/rotfb-package-logs"
            STAGE="$GITHUB_WORKSPACE/rotfb-package-staging/ROTFB-DEVICE-KIT"
            mkdir -p "$LOG" "$STAGE/packages" "$STAGE/kernel" "$STAGE/boot" "$STAGE/manifests"
            # vmactions guest environment is not assumed to inherit GitHub job env.
            UPSTREAM_SHA=098e95820891f8a83fae679daece7fcf58b7b3a4
            ROTFB_SOURCE_SHA=8e2a6e8f246c43c151793046934bcb848371768d
            export UPSTREAM_SHA ROTFB_SOURCE_SHA
            test "$UPSTREAM_SHA" = "098e95820891f8a83fae679daece7fcf58b7b3a4"
            test "$ROTFB_SOURCE_SHA" = "8e2a6e8f246c43c151793046934bcb848371768d"
            WS="$HOME/illumos-rotfb-packaging"
            mkdir -p "$WS"
            cd "$WS"
            git clone https://github.com/illumos/illumos-gate.git
            cd illumos-gate
            git checkout --detach "$UPSTREAM_SHA"
            test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
            BUILDVERSION_RESULT=$(git describe --all --long --dirty --always)
            test -n "$BUILDVERSION_RESULT"
            {
              echo "UPSTREAM_CHECKOUT_SHA=$(git rev-parse HEAD)"
              echo "BUILDVERSION_EXEC=git describe --all --long --dirty --always"
              echo "BUILDVERSION_RESULT=$BUILDVERSION_RESULT"
            } > "$LOG/buildversion-preflight.txt"

            ROTFB="$GITHUB_WORKSPACE/illumo_rotfb"
            sh "$ROTFB/tests/rotfb_patch_series_test.sh" "$WS/illumos-gate" "$ROTFB/patches" "$WS" > "$LOG/patch-series.log" 2>&1
            : > "$LOG/patch-apply.log"
            n=0
            for p in "$ROTFB"/patches/*.patch; do
              [ -f "$p" ] || continue
              git apply --check "$p" >> "$LOG/patch-apply.log" 2>&1
              git apply "$p" >> "$LOG/patch-apply.log" 2>&1
              echo "APPLIED $(basename "$p")" >> "$LOG/patch-apply.log"
              n=$((n + 1))
            done
            test "$n" -eq 13
            git diff --check > "$LOG/git-diff-check.log"
            git status --short > "$LOG/upstream-patched-status.txt"
            git diff --stat > "$LOG/upstream-patched-diffstat.txt"

            mkdir -p usr/src/uts/i86pc/sys usr/src/uts/i86pc/boot usr/src/uts/i86pc/io/gfx_private
            cp "$ROTFB/rotfb.h" usr/src/uts/i86pc/sys/rotfb.h
            cp "$ROTFB/rotfb_vis_cursor.h" usr/src/uts/i86pc/sys/rotfb_vis_cursor.h
            cp "$ROTFB/rotfb_copy.h" usr/src/uts/i86pc/sys/rotfb_copy.h
            cp "$ROTFB/rotfb_boot.c" usr/src/uts/i86pc/boot/rotfb_boot.c
            cp "$ROTFB/rotfb_runtime.c" usr/src/uts/i86pc/io/gfx_private/rotfb_runtime.c
            chmod 0644 usr/src/uts/i86pc/sys/rotfb.h usr/src/uts/i86pc/sys/rotfb_vis_cursor.h usr/src/uts/i86pc/sys/rotfb_copy.h usr/src/uts/i86pc/boot/rotfb_boot.c usr/src/uts/i86pc/io/gfx_private/rotfb_runtime.c

            cd usr/src
            export CODEMGR_WS="$WS/illumos-gate"
            export GATE="$CODEMGR_WS"
            export PATH="/opt/onbld/bin:/usr/bin:/usr/sbin:/usr/gnu/bin"
            sed -e "s/^export NIGHTLY_OPTIONS=.*/export NIGHTLY_OPTIONS='-np'/" \
              -e "s|^export BUILDVERSION_EXEC=.*|export BUILDVERSION_EXEC='git describe --all --long --dirty --always'|" \
              -e "s/^export SHADOW_CCS=.*/export SHADOW_CCS=/" \
              -e "s/^export SHADOW_CCCS=.*/export SHADOW_CCCS=/" \
              -e "s/^export ENABLE_SMATCH=.*/export ENABLE_SMATCH=/" \
              tools/env/illumos.sh > /tmp/rotfb-packaging.env
            echo "export PERL_VERSION=5.42" >> /tmp/rotfb-packaging.env
            echo "export PERL_VARIANT=-thread-multi" >> /tmp/rotfb-packaging.env
            echo "export PERL_PKGVERS=-542" >> /tmp/rotfb-packaging.env
            echo "export BUILDPERL32='#'" >> /tmp/rotfb-packaging.env
            echo "export VERSION=illumos-098e958-rotfb" >> /tmp/rotfb-packaging.env
            {
              echo "NIGHTLY_OPTIONS=-np"
              echo "PERL_VERSION=5.42"
              echo "PERL_VARIANT=-thread-multi"
              echo "PERL_PKGVERS=-542"
              echo "BUILDPERL32=#"
              echo "PKGVERS_BRANCH=$(grep '^[[:space:]]*export PKGVERS_BRANCH=' /tmp/rotfb-packaging.env || echo UNSET)"
              echo "PKGARCHIVE_EXPECTED=$CODEMGR_WS/packages/i386/nightly-nd"
              echo "lowercase_n=$(grep -n -A1 '^[[:space:]]*n[[:space:]]*)' tools/scripts/nightly | head -n 2)"
              echo "lowercase_p=$(grep -n -A1 '^[[:space:]]*p[[:space:]]*)' tools/scripts/nightly | head -n 2)"
            } > "$LOG/effective-build-config.txt"
            grep -q "NIGHTLY_OPTIONS='-np'" /tmp/rotfb-packaging.env
            grep -q "BUILDVERSION_EXEC='git describe --all --long --dirty --always'" /tmp/rotfb-packaging.env
            grep -q "export PERL_VERSION=5.42" /tmp/rotfb-packaging.env
            grep -q "export PERL_VARIANT=-thread-multi" /tmp/rotfb-packaging.env
            grep -q "export PERL_PKGVERS=-542" /tmp/rotfb-packaging.env
            grep -q "export BUILDPERL32='#'" /tmp/rotfb-packaging.env
            cp /tmp/rotfb-packaging.env "$LOG/rotfb-packaging.env"

            # Preserve the real in-guest nightly.log, transient build_noise,
            # and per-stage install logs on the NFS-shared runner workspace.
            # Run #92 used an asynchronous heartbeat; Run #2 did not preserve
            # the guest's internal log before nightly returned nonzero.
            NIGHTLY_DRIVER_LOG="$LOG/nightly-driver.log"
            BUILD_NOISE_DIR="$LOG/build-noise"
            GATE_LOG_DIR="$LOG/gate-logs"
            BUILD_OUTPUT_DIR="$LOG/build-output"
            LOG_STATE_DIR="$LOG/.log-copy-state"
            mkdir -p "$BUILD_NOISE_DIR" "$GATE_LOG_DIR" "$BUILD_OUTPUT_DIR" "$LOG_STATE_DIR"

            sync_append_file() {
              src="$1"
              dst="$2"
              state="$3"
              [ -f "$src" ] || return 0
              mkdir -p "$(dirname "$dst")" "$(dirname "$state")"
              size=$(wc -c < "$src" | tr -d ' ')
              old=0
              [ ! -f "$state" ] || old=$(cat "$state")
              case "$old" in ''|*[!0-9]*) old=0 ;; esac
              if [ "$size" -lt "$old" ]; then
                : > "$dst"
                old=0
              fi
              if [ "$size" -gt "$old" ]; then
                tail -c "+$((old + 1))" "$src" >> "$dst"
                printf '%s\n' "$size" > "$state"
              fi
            }

            snapshot_nightly_logs() {
              find /tmp -maxdepth 3 -type f \
                \( -path '/tmp/nightly.tmpdir.*/build_noise' -o \
                   -path '/tmp/nightly.tmpdir.*/mail_msg' -o \
                   -path '/tmp/nightly.tmpdir.*/build_time' -o \
                   -path '/tmp/nightly.tmpdir.*/build_environ' -o \
                   -path '/tmp/nightly.tmpdir.*/pkglint_noise' -o \
                   -path '/tmp/nightly.tmpdir.*/protocmp_noise' -o \
                   -path '/tmp/nightly.tmpdir.*/package' -o \
                   -path '/tmp/nightly.tmpdir.*/clobber_errs' -o \
                   -path '/tmp/nightly.tmpdir.*/check_errors' -o \
                   -path '/tmp/nightly.tmpdir.*/build_errs*' -o \
                   -path '/tmp/nightly.tmpdir.*/build_warnings*' -o \
                   -path '/tmp/nightly.tmpdir.*/signing' \) -print 2>/dev/null |
              while IFS= read -r f; do
                d=$(basename "$(dirname "$f")")
                b=$(basename "$f")
                sync_append_file "$f" "$BUILD_NOISE_DIR/$d-$b.txt" "$LOG_STATE_DIR/tmp-$d-$b.offset" || true
              done

              if [ -d "$CODEMGR_WS/log" ]; then
                find "$CODEMGR_WS/log" -type f -print 2>/dev/null |
                while IFS= read -r f; do
                  rel=${f#"$CODEMGR_WS/log"/}
                  rel=$(printf '%s' "$rel" | sed 's/[^A-Za-z0-9._/-]/_/g')
                  sync_append_file "$f" "$GATE_LOG_DIR/$rel" "$LOG_STATE_DIR/gate-$rel.offset" || true
                done
              fi

              find "$CODEMGR_WS/usr/src" -type f -name 'install*-i386.out' -print 2>/dev/null |
              while IFS= read -r f; do
                rel=${f#"$CODEMGR_WS/usr/src"/}
                rel=$(printf '%s' "$rel" | sed 's/[^A-Za-z0-9._/-]/_/g')
                sync_append_file "$f" "$BUILD_OUTPUT_DIR/$rel" "$LOG_STATE_DIR/output-$rel.offset" || true
              done

              if [ -f "$CODEMGR_WS/usr/src/check-paths.out" ]; then
                sync_append_file "$CODEMGR_WS/usr/src/check-paths.out" \
                  "$LOG/check-paths.out" "$LOG_STATE_DIR/check-paths.offset" || true
              fi
            }

            preserve_failed_guest_outputs() {
              MACH=$(uname -p)
              PKGARCHIVE_BASE=$(ksh93 -c '. /tmp/rotfb-packaging.env; print -r -- "$PKGARCHIVE"')
              PKGDIR="${PKGARCHIVE_BASE}-nd"
              PKG_REPO="$PKGDIR/repo.redist"
              ROOT="$CODEMGR_WS/proto/root_$MACH"
              {
                echo "NIGHTLY_EXIT_CODE=$NIGHTLY_RC"
                echo "PKGDIR=$PKGDIR"
                echo "PKG_REPO=$PKG_REPO"
                echo "ROOT=$ROOT"
                echo "PRESERVATION_MODE=FAILED_NIGHTLY_DIAGNOSTICS_ONLY"
              } > "$LOG/failed-guest-output-status.txt"

              if [ -d "$PKGDIR" ]; then
                find "$PKGDIR" -type f -print | sort \
                  > "$LOG/failed-package-file-index.txt"
                find "$PKGDIR" -type f -exec ls -ln {} \; | sort \
                  > "$LOG/failed-package-file-sizes.txt"
                if [ -d "$PKG_REPO/catalog" ] && [ -d "$PKG_REPO/pkg" ] && [ -d "$PKG_REPO/file" ]; then
                  if pkgrepo verify -s "$PKG_REPO" > "$LOG/failed-pkgrepo-verify.log" 2>&1; then
                    echo "PKGREPO_VERIFY=PASS" >> "$LOG/failed-guest-output-status.txt"
                  else
                    echo "PKGREPO_VERIFY=FAIL" >> "$LOG/failed-guest-output-status.txt"
                  fi
                  if pkgrepo list -s "$PKG_REPO" -F tsv > "$LOG/failed-package-inventory.tsv" 2> "$LOG/failed-pkgrepo-list.err"; then
                    echo "PKGREPO_LIST=PASS" >> "$LOG/failed-guest-output-status.txt"
                  else
                    echo "PKGREPO_LIST=FAIL" >> "$LOG/failed-guest-output-status.txt"
                  fi
                else
                  echo "IPS_REPOSITORY_LAYOUT=MISSING" >> "$LOG/failed-guest-output-status.txt"
                fi
                if tar -czf "$LOG/failed-package-repository.tar.gz" -C "$(dirname "$PKGDIR")" "$(basename "$PKGDIR")"; then
                  echo "PACKAGE_REPOSITORY_ARCHIVE=CAPTURED" >> "$LOG/failed-guest-output-status.txt"
                else
                  echo "PACKAGE_REPOSITORY_ARCHIVE=FAILED" >> "$LOG/failed-guest-output-status.txt"
                fi
              else
                echo "PKGDIR=MISSING" >> "$LOG/failed-guest-output-status.txt"
              fi

              if [ -d "$ROOT/platform/i86pc/kernel" ]; then
                if [ -f "$ROOT/platform/i86pc/kernel/amd64/unix" ]; then
                  file "$ROOT/platform/i86pc/kernel/amd64/unix" > "$LOG/failed-kernel-unix-file.txt"
                  wc -c < "$ROOT/platform/i86pc/kernel/amd64/unix" > "$LOG/failed-kernel-unix-size.txt"
                  digest=$(digest -a sha256 "$ROOT/platform/i86pc/kernel/amd64/unix")
                  echo "$digest  unix" > "$LOG/failed-kernel-unix-sha256.txt"
                fi
                if tar -czf "$LOG/failed-kernel-payload.tar.gz" -C "$ROOT" platform/i86pc/kernel; then
                  echo "KERNEL_PAYLOAD_ARCHIVE=CAPTURED" >> "$LOG/failed-guest-output-status.txt"
                else
                  echo "KERNEL_PAYLOAD_ARCHIVE=FAILED" >> "$LOG/failed-guest-output-status.txt"
                fi
              else
                echo "KERNEL_PAYLOAD=MISSING" >> "$LOG/failed-guest-output-status.txt"
              fi
            }

            ksh93 tools/scripts/nightly /tmp/rotfb-packaging.env > "$NIGHTLY_DRIVER_LOG" 2>&1 &
            BUILD_PID=$!
            NIGHTLY_RC=0
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              snapshot_nightly_logs
              printf 'OpenIndiana packaging heartbeat: %s nightly_pid=%s\n' "$(date -u +%FT%TZ)" "$BUILD_PID"
              sleep 10
            done
            if wait "$BUILD_PID"; then
              NIGHTLY_RC=0
            else
              NIGHTLY_RC=$?
            fi
            snapshot_nightly_logs
            cp /tmp/rotfb-packaging.env "$LOG/rotfb-packaging.env.final" 2>/dev/null || true
            printf '%s\n' "$NIGHTLY_RC" > "$LOG/nightly-exit-code.txt"
            if [ "$NIGHTLY_RC" -ne 0 ]; then
              preserve_failed_guest_outputs
            fi
            printf 'nightly_exit_code=%s\nnightly_driver_log=%s\n' "$NIGHTLY_RC" "$NIGHTLY_DRIVER_LOG" > "$LOG/nightly-result.txt"
            test -f "$NIGHTLY_DRIVER_LOG"
            test -s "$LOG/nightly-exit-code.txt"
            test "$NIGHTLY_RC" -eq 0

            MACH=$(uname -p)
            PKGARCHIVE_BASE=$(ksh93 -c '. /tmp/rotfb-packaging.env; print -r -- "$PKGARCHIVE"')
            test -n "$PKGARCHIVE_BASE"
            PKGARCHIVE_SUFFIX=-nd
            PKGDIR="${PKGARCHIVE_BASE}${PKGARCHIVE_SUFFIX}"
            PKG_REPO="$PKGDIR/repo.redist"
            ROOT="$CODEMGR_WS/proto/root_$MACH"
            TOOLS_PROTO_REL="proto/root_$MACH-nd"
            TOOLS_PROTO="$CODEMGR_WS/usr/src/tools/$TOOLS_PROTO_REL"
            {
              echo "MACH=$MACH"
              echo "PKGARCHIVE_BASE=$PKGARCHIVE_BASE"
              echo "PKGARCHIVE_SUFFIX=$PKGARCHIVE_SUFFIX"
              echo "PKGARCHIVE_FINAL=$PKGDIR"
              echo "PKG_REPO=$PKG_REPO"
              echo "TOOLS_PROTO_REL=$TOOLS_PROTO_REL"
              echo "TOOLS_PROTO=$TOOLS_PROTO"
            } >> "$LOG/effective-build-config.txt"
            test -d "$PKGDIR"
            test -d "$TOOLS_PROTO"
            test -d "$ROOT"
            test -d "$PKG_REPO/catalog"
            test -d "$PKG_REPO/pkg"
            test -d "$PKG_REPO/file"
            pkgrepo verify -s "$PKG_REPO" > "$LOG/pkgrepo-verify.log" 2>&1
            pkgrepo list -s "$PKG_REPO" -F tsv > "$LOG/package-inventory.tsv"
            test -s "$LOG/package-inventory.tsv"

            : > "$LOG/package-manifests.txt"
            : > "$LOG/rotfb-package-fmris.txt"
            : > "$LOG/package-dependencies.txt"
            count=0
            while IFS="$(printf '\t')" read -r publisher pkgname version rest; do
              [ "$pkgname" = "name" ] && continue
              [ -n "$pkgname" ] || continue
              fmri="pkg://$publisher/$pkgname@$version"
              count=$((count + 1))
              pkg contents -m -g "$PKG_REPO" "$fmri" >> "$LOG/package-manifests.txt"
              if pkg contents -m -g "$PKG_REPO" "$fmri" 2>/dev/null | grep -Eiq 'path=platform/i86pc/kernel/amd64/unix([[:space:]]|$)|path=platform/i86pc/kernel/misc/amd64/gfx_private([[:space:]]|$)'; then
                echo "$fmri" >> "$LOG/rotfb-package-fmris.txt"
              fi
            done < "$LOG/package-inventory.tsv"
            test "$count" -gt 0
            test -s "$LOG/rotfb-package-fmris.txt"
            sed -n 's/.*depend[[:space:]].*fmri=\([^[:space:]]*\).*type=require.*/\1/p' "$LOG/package-manifests.txt" | sort -u > "$LOG/package-dependencies.txt"
            depfail=0
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              pkg contents -m -g "$PKG_REPO" "$dep" >/dev/null 2>&1 || { echo "$dep" >> "$LOG/unresolved-dependencies.txt"; depfail=1; }
            done < "$LOG/package-dependencies.txt"
            test "$depfail" -eq 0
            echo "DIRECT_BUILD_REPO_DEPENDENCIES=RESOLVED" > "$LOG/offline-dependency-closure.txt"
            echo "OFFLINE_DEPENDENCY_CLOSURE=NOT_VERIFIED_TARGET_BASE_REQUIRED" >> "$LOG/offline-dependency-closure.txt"
            echo "DEVICE_KIT_STATUS=BLOCKED_UNTIL_OFFLINE_DEPENDENCY_CLOSURE_IS_PROVEN" > "$LOG/device-kit-status.txt"

            cp -p "$ROOT/platform/i86pc/kernel/amd64/unix" "$STAGE/kernel/unix"
            mkdir -p "$STAGE/kernel/platform/i86pc"
            cp -Rp "$ROOT/platform/i86pc/kernel" "$STAGE/kernel/platform/i86pc/"
            if [ -d "$ROOT/platform/i86pc/boot" ]; then cp -Rp "$ROOT/platform/i86pc/boot" "$STAGE/boot/platform-i86pc-boot"; fi
            cp -Rp "$PKGDIR" "$STAGE/packages/nightly-nd"
            cp "$LOG/package-inventory.tsv" "$STAGE/manifests/package-inventory.txt"
            cp "$LOG/package-dependencies.txt" "$STAGE/manifests/package-dependencies.txt"
            cp "$LOG/rotfb-package-fmris.txt" "$STAGE/manifests/rotfb-package-fmris.txt"
            {
              echo "ROTFB_SOURCE_SHA=$ROTFB_SOURCE_SHA"
              echo "UPSTREAM_SHA=$UPSTREAM_SHA"
              echo "OPENINDIANA_RELEASE=202610-build"
              echo "ARCH=x86_64"
              echo "NIGHTLY_OPTIONS=-np"
              echo "PKGARCHIVE=packages/i386/nightly-nd"
              echo "NIGHTLY_EXIT_CODE=$NIGHTLY_RC"
              echo "PATCH_COUNT=$n"
            } > "$STAGE/manifests/source-revision.txt"
            {
              echo "package_count=$count"
              echo "rotfb_package_count=$(wc -l < "$LOG/rotfb-package-fmris.txt")"
              echo "upstream_head=$(git -C "$CODEMGR_WS" rev-parse HEAD)"
              echo "kernel_unix=$(file "$ROOT/platform/i86pc/kernel/amd64/unix")"
              echo "kernel_unix_bytes=$(wc -c < "$ROOT/platform/i86pc/kernel/amd64/unix")"
              echo "pkgrepo_verify=PASS"
              echo "direct_build_repo_dependencies=RESOLVED"
              echo "offline_dependency_closure=NOT_VERIFIED_TARGET_BASE_REQUIRED"
              echo "boot_archive=NOT_INCLUDED; target system updates its own archive"
            } > "$STAGE/manifests/build-evidence.txt"

      - name: Assemble, hash and recheck USB kit
        id: assemble_kit
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGE=rotfb-package-staging/ROTFB-DEVICE-KIT
          LOG=rotfb-package-logs
          if ! grep -qx 'OFFLINE_DEPENDENCY_CLOSURE=PASS' "$LOG/offline-dependency-closure.txt"; then
            echo "DEVICE_KIT_STATUS=BLOCKED; offline dependency closure has not been proven" | tee "$LOG/device-kit-status.txt"
            exit 1
          fi
          test -d "$STAGE/packages/nightly-nd"
          cat > "$STAGE/INSTALL-README.txt" <<'EOF'
          ROTFB DEVICE TEST KIT
          Target: OpenIndiana 2026.10 x86_64 / Chuwi MiniBook X N150

          Read ROLLBACK-README.txt before use. Keep the directory structure intact.
          INSTALL.sh installs only the ROTFB package set into a separate boot
          environment. It does not write EFI variables, NVRAM, BIOS settings,
          EFI boot entries, or the active boot environment.

          No boot archive is included. After booting the test BE, update its own
          archive with the target system's native bootadm update-archive command.
          Never copy a boot archive from CI or another operating system.
          EOF
          cat > "$STAGE/ROLLBACK-README.txt" <<'EOF'
          ROLLBACK
          Keep the original boot environment. If the test BE fails, reboot and
          select the original BE from the existing boot environment menu.
          Inspect with beadm list. If necessary, activate the original BE:
            beadm activate <original-BE-name>
          Reboot. Only after confirming the original BE works, remove the failed
          test BE with:
            beadm destroy <rotfb-test-BE-name>
          Do not delete the original BE. Do not alter EFI/NVRAM or BIOS.
          EOF
          cat > "$STAGE/INSTALL.sh" <<'EOF'
          #!/bin/sh
          set -eu
          SCRIPT_DIR=$(dirname "$0")
          BASE=$(CDPATH= cd -P "$SCRIPT_DIR" && pwd)
          REPO="$BASE/packages/nightly-nd/repo.redist"
          [ "$(id -u)" -eq 0 ] || { echo "Run as root" >&2; exit 1; }
          [ "$(uname -p)" = i386 ] || { echo "Unsupported architecture" >&2; exit 1; }
          grep -qi OpenIndiana /etc/release || { echo "OpenIndiana required" >&2; exit 1; }
          grep -q 2026.10 /etc/release || { echo "OpenIndiana 2026.10 required" >&2; exit 1; }
          command -v digest >/dev/null 2>&1 || { echo "OpenIndiana digest command required" >&2; exit 1; }
          command -v pkg >/dev/null 2>&1 || { echo "IPS pkg command required" >&2; exit 1; }
          command -v pkgrepo >/dev/null 2>&1 || { echo "IPS pkgrepo command required" >&2; exit 1; }
          command -v beadm >/dev/null 2>&1 || { echo "beadm command required" >&2; exit 1; }
          [ -s "$BASE/manifests/SHA256SUMS" ] || { echo "SHA256SUMS missing or empty" >&2; exit 1; }
          (
            cd "$BASE"
            while read -r expected rel; do
              [ -n "$expected" ] || continue
              [ "${#expected}" -eq 64 ] || { echo "Invalid SHA-256 entry: $rel" >&2; exit 1; }
              case "$expected" in *[!0-9a-f]*) echo "Invalid SHA-256 value: $rel" >&2; exit 1 ;; esac
              case "$rel" in ./*) ;; *) echo "Unsafe checksum path: $rel" >&2; exit 1 ;; esac
              [ -f "$rel" ] || { echo "Kit file missing: $rel" >&2; exit 1; }
              actual=$(digest -a sha256 "$rel")
              [ "$actual" = "$expected" ] || { echo "Checksum mismatch: $rel" >&2; exit 1; }
            done < manifests/SHA256SUMS
          )
          [ -d "$REPO/catalog" ] && [ -d "$REPO/pkg" ] && [ -d "$REPO/file" ] || { echo "IPS repository layout missing" >&2; exit 1; }
          pkgrepo verify -s "$REPO"
          pkgrepo list -s "$REPO" -F tsv >/dev/null
          [ -s "$BASE/manifests/rotfb-package-fmris.txt" ] || { echo "ROTFB package FMRI inventory missing" >&2; exit 1; }
          set --
          while IFS= read -r fmri; do
            [ -n "$fmri" ] || continue
            pkg contents -m -g "$REPO" "$fmri" >/dev/null
            set -- "$@" "$fmri"
          done < "$BASE/manifests/rotfb-package-fmris.txt"
          [ "$#" -gt 0 ] || { echo "No ROTFB package FMRI" >&2; exit 1; }
          BE="rotfb-test-$(date +%Y%m%d-%H%M%S)"
          if beadm list "$BE" >/dev/null 2>&1; then
            echo "Test BE already exists: $BE" >&2
            exit 1
          fi
          echo "Preflight IPS solver dry-run for separate BE: $BE"
          pkg install -n --no-refresh --accept --be-name "$BE" -g "file://$REPO" "$@"
          echo "Preflight passed. Creating the separate test BE: $BE"
          pkg install --no-refresh --accept --be-name "$BE" -g "file://$REPO" "$@"
          beadm list "$BE" >/dev/null
          echo "Test BE created: $BE"
          echo "The script did not call beadm activate. Review beadm list and boot selection before rebooting."
          EOF
          chmod 0755 "$STAGE/INSTALL.sh"
          (cd "$STAGE" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > manifests/SHA256SUMS)
          (cd rotfb-package-staging && zip -qr ROTFB-DEVICE-KIT.zip ROTFB-DEVICE-KIT)
          unzip -t rotfb-package-staging/ROTFB-DEVICE-KIT.zip > rotfb-package-logs/zip-integrity.log
          mkdir -p rotfb-package-staging/recheck
          unzip -q rotfb-package-staging/ROTFB-DEVICE-KIT.zip -d rotfb-package-staging/recheck
          (cd rotfb-package-staging/recheck/ROTFB-DEVICE-KIT && sha256sum -c manifests/SHA256SUMS)
          stat -c '%s' rotfb-package-staging/ROTFB-DEVICE-KIT.zip > rotfb-package-logs/kit-size-bytes.txt
          sha256sum rotfb-package-staging/ROTFB-DEVICE-KIT.zip > rotfb-package-logs/kit-sha256.txt
          echo "PACKAGING_ACCEPTANCE=PASS" > rotfb-package-logs/packaging-acceptance.txt
          echo "DEVICE_KIT_STATUS=READY" > rotfb-package-logs/device-kit-status.txt

      - name: Preserve diagnostics on all outcomes
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p rotfb-package-logs
          find rotfb-package-logs rotfb-package-staging -type f -printf '%p %s bytes\n' 2>/dev/null | sort > rotfb-package-logs/final-file-index.txt
          [ -f rotfb-package-logs/packaging-acceptance.txt ] || echo "PACKAGING_ACCEPTANCE=FAIL_OR_INCOMPLETE" > rotfb-package-logs/packaging-acceptance.txt

      - name: Upload USB kit
        if: always() && steps.assemble_kit.outcome == 'success' && hashFiles('rotfb-package-staging/ROTFB-DEVICE-KIT.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ROTFB-OpenIndiana-2026.10-x86_64-Install-Kit
          path: rotfb-package-staging/ROTFB-DEVICE-KIT.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload packaging diagnostics and raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotfb-device-packaging-diagnostics-${{ github.run_id }}-${{ env.ROTFB_SOURCE_SHA }}
          path: |
            rotfb-package-logs/
            rotfb-package-staging/
            !rotfb-package-staging/ROTFB-DEVICE-KIT.zip
          if-no-files-found: warn
          retention-days: 30
