name: ROTFB DDX native OpenIndiana build

on:
  push:
    branches: [gop-rotation-hook]
    paths:
      - "rotfb-ddx/**"
      - ".github/workflows/rotfb-ddx-build.yml"

permissions:
  contents: read

jobs:
  build-illumosfb-ddx:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated ROTFB DDX inputs
        uses: actions/checkout@v4

      - name: Prepare artifact staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rotfb-ddx-artifacts
          echo "Build has not started" > rotfb-ddx-artifacts/STATUS.txt

      - name: Build and validate illumosfb_drv.so in OpenIndiana 202610
        uses: vmactions/openindiana-vm@v1
        with:
          release: "202610-build"
          arch: x86_64
          mem: 8192
          cpu: 4
          sync: nfs
          run: |
            /usr/bin/bash -s <<'ROTFB_DDX_BUILD'
            set -Eeuo pipefail
            ART="$GITHUB_WORKSPACE/rotfb-ddx-artifacts"
            mkdir -p "$ART"
            exec > "$ART/build.log" 2>&1
            TEMP_PROBE_TARGET=
            TEMP_PROBE_STAGE=
            TEMP_PROBE_OWNED=0
            : > "$ART/xorg-probe-cleanup.txt"
            cleanup_temporary_probe() {
              if [ "$TEMP_PROBE_OWNED" -eq 1 ] && [ -n "$TEMP_PROBE_STAGE" ] && [ -e "$TEMP_PROBE_STAGE" ]; then
                if [ -n "$TEMP_PROBE_TARGET" ] && [ -e "$TEMP_PROBE_TARGET" ] &&
                  [ "$TEMP_PROBE_TARGET" -ef "$TEMP_PROBE_STAGE" ]; then
                  rm -f "$TEMP_PROBE_TARGET" &&
                    echo "removed temporary target: $TEMP_PROBE_TARGET" >> "$ART/xorg-probe-cleanup.txt" ||
                    echo "ERROR removing temporary target: $TEMP_PROBE_TARGET" >> "$ART/xorg-probe-cleanup.txt"
                else
                  echo "target was not this run's staged inode; left untouched: $TEMP_PROBE_TARGET" >> "$ART/xorg-probe-cleanup.txt"
                fi
                rm -f "$TEMP_PROBE_STAGE" &&
                  echo "removed temporary stage: $TEMP_PROBE_STAGE" >> "$ART/xorg-probe-cleanup.txt" ||
                  echo "ERROR removing temporary stage: $TEMP_PROBE_STAGE" >> "$ART/xorg-probe-cleanup.txt"
              else
                echo "no temporary probe stage remained" >> "$ART/xorg-probe-cleanup.txt"
              fi
              TEMP_PROBE_TARGET=
              TEMP_PROBE_STAGE=
              TEMP_PROBE_OWNED=0
            }
            finish_build() {
              rc=$?
              trap - EXIT
              cleanup_temporary_probe
              printf 'exit_code=%s\n' "$rc" > "$ART/build-status.txt"
              printf 'completed_utc=%s\n' "$(date -u +%FT%TZ)" >> "$ART/build-status.txt"
              printf 'Build finished with exit code %s.\n' "$rc" > "$ART/STATUS.txt"
              [ ! -f "$ART/illumosfb_drv.so" ] || echo binary=present >> "$ART/build-status.txt"
              [ -f "$ART/illumosfb_drv.so" ] || echo binary=absent >> "$ART/build-status.txt"
              : > "$ART/SHA256SUMS"
              find "$ART" -type f ! -name SHA256SUMS -print | sort | while IFS= read -r f; do
                digest -a sha256 "$f" | awk -v n="$(basename "$f")" '{print $1 "  " n}'
              done >> "$ART/SHA256SUMS"
              exit "$rc"
            }
            trap finish_build EXIT

            uname -a
            test "$(uname -s)" = SunOS
            isainfo -kv | tee "$ART/target-abi.txt"
            grep -qi amd64 "$ART/target-abi.txt"
            cat /etc/release | tee "$ART/openindiana-release.txt"
            grep -q 'OpenIndiana' "$ART/openindiana-release.txt"

            pkg refresh
            pkg install --accept \
              pkg://openindiana.org/x11/server/xorg@1.19.7-2026.0.0.18 \
              library/graphics/pixman \
              developer/build/autoconf/xorg-macros developer/build/autoconf \
              developer/build/automake developer/build/libtool \
              developer/build/pkg-config developer/build/gnu-make \
              developer/versioning/git developer/gcc-14 \
              x11/header/x11-protocols x11/font-util system/library

            pkg info x11/server/xorg | tee "$ART/xorg-package-info.txt"
            # Capture installed IPS inventory and package file ownership evidence.
            pkg list -Hv x11/server/xorg > "$ART/xorg-installed-inventory.txt" 2>&1 || true
            pkg contents -t file -o path x11/server/xorg > "$ART/xorg-installed-file-manifest.txt" 2>&1 || true
            {
              echo "### installed IPS search: libshadow.so"
              pkg search -l -o pkg.name,path libshadow.so
              echo "### installed IPS search: libfb.so"
              pkg search -l -o pkg.name,path libfb.so
            } > "$ART/ips-helper-search.txt" 2>&1 || true
            awk -F: '
              /^[[:space:]]*Version:/ {
                v=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", v)
              }
              /^[[:space:]]*Branch:/ {
                b=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", b)
              }
              END { if (v != "1.19.7" || b !~ /\.18$/) exit 1 }
            ' "$ART/xorg-package-info.txt"

            export PATH="/usr/gcc/14/bin:/usr/bin:/usr/sbin"
            export PKG_CONFIG_PATH="/usr/lib/amd64/pkgconfig:/usr/lib/pkgconfig"
            export CC=/usr/gcc/14/bin/gcc CFLAGS=-m64 LDFLAGS=-m64
            XORG_PC_VERSION=$(pkg-config --modversion xorg-server)
            test "$XORG_PC_VERSION" = 1.19.7
            PC_DIR=$(pkg-config --variable=pcfiledir xorg-server)
            PC_FILE="$PC_DIR/xorg-server.pc"
            test -r "$PC_FILE"
            grep -Eq '^Version:[[:space:]]*1\.19\.7[[:space:]]*$' "$PC_FILE"
            {
              echo "pkg-config version=$XORG_PC_VERSION"
              echo "pkg-config file=$PC_FILE"
              echo "pkg-config cflags=$(pkg-config --cflags xorg-server)"
              echo "pkg-config libs=$(pkg-config --libs xorg-server)"
              echo "pkg-config moduledir=$(pkg-config --variable=moduledir xorg-server)"
              cat "$PC_FILE"
            } > "$ART/xorg-pkg-config.txt"
            pkg-config --exists xorg-server xproto fontsproto pixman-1

            # Compile a header/ABI probe against the installed target SDK.
            cat > "$ART/xorg-sdk-probe.c" <<'EOF'
            #include <sys/fbio.h>
            #include <sys/kd.h>
            #include <sys/visual_io.h>
            #include "xorg-server.h"
            #include "xf86.h"
            #include "xf86_OSproc.h"
            #include "xf86Module.h"
            #include "mipointer.h"
            #include "micmap.h"
            #include "colormapst.h"
            #include "fb.h"
            #include "shadow.h"
            #include "damage.h"
            #include "regionstr.h"
            #include <stdio.h>
            #ifndef ABI_VIDEODRV_VERSION
            #error ABI_VIDEODRV_VERSION missing from target headers
            #endif
            #ifndef ABI_CLASS_VIDEODRV
            #error ABI_CLASS_VIDEODRV missing from target headers
            #endif
            int main(void) {
                printf("XORG_VERSION_CURRENT=%u\n", (unsigned)XORG_VERSION_CURRENT);
                printf("ABI_CLASS_VIDEODRV=%s\n", ABI_CLASS_VIDEODRV);
                printf("ABI_VIDEODRV_VERSION=%u\n", (unsigned)ABI_VIDEODRV_VERSION);
                return (GET_ABI_MAJOR(ABI_VIDEODRV_VERSION) != 23 ||
                    GET_ABI_MINOR(ABI_VIDEODRV_VERSION) != 0);
            }
            EOF
            $CC -m64 $(pkg-config --cflags xorg-server) -o "$ART/xorg-sdk-probe" "$ART/xorg-sdk-probe.c"
            "$ART/xorg-sdk-probe" | tee "$ART/xorg-module-abi.txt"
            $CC -m64 $(pkg-config --cflags xorg-server) -dM -E "$ART/xorg-sdk-probe.c" \
              | grep -E '^#define (ABI_VIDEODRV_VERSION|ABI_CLASS_VIDEODRV|XORG_VERSION_CURRENT)' \
              > "$ART/xorg-module-abi-macros.txt"
            grep -q 'ABI_VIDEODRV_VERSION' "$ART/xorg-module-abi-macros.txt"

            SRC=/tmp/xf86-video-illumosfb
            PIN=8ad57812ca2e99be6281f5142101811482026c55
            git init "$SRC"
            git -C "$SRC" remote add origin https://github.com/LuminousMonkey/xf86-video-illumosfb.git
            git -C "$SRC" fetch --depth 1 origin "$PIN"
            git -C "$SRC" checkout --detach FETCH_HEAD
            test "$(git -C "$SRC" rev-parse HEAD)" = "$PIN"
            test "$(digest -a sha256 "$SRC/src/illumosfb_driver.c")" = 649d6d6dc7230a647c8d516316fc5a6112ea40c6c2d3d37335c85090671fde2a
            git -C "$SRC" apply --check "$GITHUB_WORKSPACE/rotfb-ddx/patches/rotfb-ddx-clean-reimplementation.patch"
            git -C "$SRC" apply "$GITHUB_WORKSPACE/rotfb-ddx/patches/rotfb-ddx-clean-reimplementation.patch"
            git -C "$SRC" apply "$GITHUB_WORKSPACE/rotfb-ddx/patches/rotfb-ddx-metadata-flag.patch"
            cmp "$SRC/src/illumosfb_driver.c" "$GITHUB_WORKSPACE/rotfb-ddx/src/illumosfb_driver.c"
            echo "ddx_source_sha256=$(digest -a sha256 "$SRC/src/illumosfb_driver.c")"

            cd "$SRC"
            NOCONFIGURE=1 /usr/bin/bash ./autogen.sh
            ac_cv_prog_cc_c23=no ./configure --disable-static
            gmake -C src illumosfb_drv.la V=1
            SO="$SRC/src/.libs/illumosfb_drv.so"
            test -s "$SO"
            cp "$SO" "$ART/illumosfb_drv.so"

            REPORT="$ART/elf-abi-report.txt"
            DIAG_RC=0
            {
              echo "Target: $(uname -a)"
              echo "OpenIndiana release: $(head -1 /etc/release)"
              echo "Xorg package: $(grep -E 'Version:|Branch:|FMRI:' "$ART/xorg-package-info.txt" | tr '\n' ' ')"
              echo "Xorg pkg-config: $(pkg-config --modversion xorg-server)"
              echo "Compiler: $($CC --version | head -1)"
              file "$ART/illumosfb_drv.so"
              elfdump -e "$ART/illumosfb_drv.so"
              elfdump -d "$ART/illumosfb_drv.so"
              elfdump -s -N .dynsym "$ART/illumosfb_drv.so"
              elfdump -r "$ART/illumosfb_drv.so"
              ldd "$ART/illumosfb_drv.so"
            } > "$REPORT" 2>&1 || DIAG_RC=$?
            test "$DIAG_RC" -eq 0

            # Acceptance gate: run every independent ELF and loader check, retain evidence,
            # then fail the build once at the end if any acceptance check failed.
            ACCEPTANCE_FAILURES=0
            : > "$ART/acceptance-results.tsv"

            record_acceptance() {
              status=$1
              name=$2
              detail=$3
              printf '%s\t%s\t%s\n' "$status" "$name" "$detail" >> "$ART/acceptance-results.tsv"
              printf '%s: %s — %s\n' "$status" "$name" "$detail"
              if [ "$status" = FAIL ]; then
                ACCEPTANCE_FAILURES=$((ACCEPTANCE_FAILURES + 1))
              fi
              return 0
            }

            capture_acceptance_output() {
              label=$1
              output=$2
              shift 2
              if "$@" > "$ART/$output" 2>&1; then
                record_acceptance PASS "$label" "command completed"
              else
                rc=$?
                record_acceptance FAIL "$label" "command exit=$rc; see $output"
              fi
            }

            check_acceptance_pattern() {
              label=$1
              file=$2
              pattern=$3
              if [ -s "$ART/$file" ] && grep -Eq "$pattern" "$ART/$file"; then
                record_acceptance PASS "$label" "matched $file"
              else
                record_acceptance FAIL "$label" "expected pattern absent from $file"
              fi
            }

            capture_acceptance_output "ELF header dump" elf-header.txt elfdump -e "$ART/illumosfb_drv.so"
            capture_acceptance_output "ELF dynamic section dump" dynamic-section.txt elfdump -d "$ART/illumosfb_drv.so"
            capture_acceptance_output "ELF relocation dump" relocations.txt elfdump -r "$ART/illumosfb_drv.so"
            capture_acceptance_output "ELF dependency resolution" ldd.txt ldd "$ART/illumosfb_drv.so"

            # illumos elfdump labels these fields ei_class, ei_osabi and
            # e_machine; do not parse GNU readelf's Class:/Machine: labels.
            check_acceptance_pattern "ELF class is 64-bit" elf-header.txt '^[[:space:]]*ei_class:[[:space:]]*ELFCLASS64([[:space:]]|$)'
            check_acceptance_pattern "ELF OS ABI is Solaris/illumos" elf-header.txt '^[[:space:]]*ei_osabi:[[:space:]]*ELFOSABI_SOLARIS([[:space:]]|$)'
            check_acceptance_pattern "ELF machine is AMD64" elf-header.txt '^[[:space:]]*e_machine:[[:space:]]*EM_AMD64([[:space:]]|$)'

            if [ -s "$ART/dynamic-section.txt" ] &&
              nawk '$2 == "NEEDED" { found=1 } END { exit(found ? 0 : 1) }' "$ART/dynamic-section.txt"; then
              record_acceptance PASS "DT_NEEDED entries present" "at least one exact NEEDED dynamic tag"
            else
              record_acceptance FAIL "DT_NEEDED entries present" "no exact NEEDED dynamic tag; see dynamic-section.txt"
            fi

            if [ -s "$ART/relocations.txt" ] &&
              nawk '$1 ~ /^R_AMD64_[A-Z0-9_]+$/ { count++ } END { exit(count > 0 ? 0 : 1) }' "$ART/relocations.txt"; then
              record_acceptance PASS "AMD64 relocations present" "at least one R_AMD64_* relocation"
            else
              record_acceptance FAIL "AMD64 relocations present" "no R_AMD64_* relocation records"
            fi

            if [ -s "$ART/ldd.txt" ] && ! grep -Eiq 'not found|file not found' "$ART/ldd.txt"; then
              record_acceptance PASS "DT_NEEDED dependencies resolve" "ldd reported no missing dependencies"
            else
              record_acceptance FAIL "DT_NEEDED dependencies resolve" "ldd failed or reported a missing dependency"
            fi

            # Discover helpers from pkg-config's module directory, then scan
            # the parent module tree and known illumos architecture layouts.
            MODULEDIR=$(pkg-config --variable=moduledir xorg-server)
            MODULE_PARENT=$(dirname "$MODULEDIR")
            {
              echo "pkg-config moduledir=$MODULEDIR"
              echo "module parent=$MODULE_PARENT"
              echo "installed xorg package inventory:"
              cat "$ART/xorg-installed-inventory.txt"
              echo "installed xorg package manifest helper entries:"
              grep -E '(^|/)lib(shadow|fb)\.so$' "$ART/xorg-installed-file-manifest.txt" || true
              echo "installed IPS helper search:"
              cat "$ART/ips-helper-search.txt"
            } > "$ART/module-directory-and-ips-evidence.txt"
            : > "$ART/module-search-roots.txt"
            : > "$ART/libshadow-paths.txt"
            : > "$ART/libfb-paths.txt"
            : > "$ART/module-discovery-errors.txt"
            for root in "$MODULEDIR" "$MODULE_PARENT" /usr/lib/xorg/modules /usr/lib/amd64/xorg/modules; do
              [ -d "$root" ] || continue
              printf '%s\n' "$root" >> "$ART/module-search-roots.txt"
              find -L "$root" -type f -name libshadow.so -print 2>> "$ART/module-discovery-errors.txt" >> "$ART/libshadow-paths.txt" || true
              find -L "$root" -type f -name libfb.so -print 2>> "$ART/module-discovery-errors.txt" >> "$ART/libfb-paths.txt" || true
            done
            sort -u "$ART/libshadow-paths.txt" -o "$ART/libshadow-paths.txt"
            sort -u "$ART/libfb-paths.txt" -o "$ART/libfb-paths.txt"
            {
              echo "MODULEDIR=$MODULEDIR"
              echo "search roots:"
              cat "$ART/module-search-roots.txt"
              echo "libshadow.so paths:"
              cat "$ART/libshadow-paths.txt"
              echo "libfb.so paths:"
              cat "$ART/libfb-paths.txt"
              echo "find diagnostics:"
              cat "$ART/module-discovery-errors.txt"
            } > "$ART/helper-module-paths.txt"
            if grep -Eq '(^|/)libshadow\.so$' "$ART/xorg-installed-file-manifest.txt" &&
              grep -Eq '(^|/)libfb\.so$' "$ART/xorg-installed-file-manifest.txt"; then
              record_acceptance PASS "Installed xorg IPS manifest declares helper modules" "x11/server/xorg owns libshadow.so and libfb.so"
            else
              record_acceptance FAIL "Installed xorg IPS manifest declares helper modules" "helper paths missing from pkg contents; see xorg-installed-file-manifest.txt"
            fi

            SHADOW_LIB=
            FB_LIB=
            XORG_BIN=/usr/bin/Xorg
            if [ -s "$ART/libshadow-paths.txt" ]; then
              SHADOW_LIB=$(head -1 "$ART/libshadow-paths.txt")
              record_acceptance PASS "Locate libshadow.so" "$SHADOW_LIB"
            else
              record_acceptance FAIL "Locate libshadow.so" "not found under pkg-config moduledir=$MODULEDIR or fallback module roots; see helper-module-paths.txt and IPS evidence"
            fi
            if [ -s "$ART/libfb-paths.txt" ]; then
              FB_LIB=$(head -1 "$ART/libfb-paths.txt")
              record_acceptance PASS "Locate libfb.so" "$FB_LIB"
            else
              record_acceptance FAIL "Locate libfb.so" "not found under pkg-config moduledir=$MODULEDIR or fallback module roots; see helper-module-paths.txt and IPS evidence"
            fi
            if [ -x "$XORG_BIN" ]; then
              record_acceptance PASS "Locate Xorg executable" "$XORG_BIN"
            else
              record_acceptance FAIL "Locate Xorg executable" "$XORG_BIN is missing or not executable"
            fi

            # Preserve the actual target dynsym tables for diagnosis. Symbol
            # checks below are independent: one missing export never skips the rest.
            capture_symbol_table() {
              label=$1
              object=$2
              output=$3
              if [ -n "$object" ] && [ -r "$object" ] &&
                elfdump -s -N .dynsym "$object" > "$ART/$output" 2>&1; then
                record_acceptance PASS "$label dynamic symbol table" "$output"
              else
                rc=$?
                : > "$ART/$output"
                record_acceptance FAIL "$label dynamic symbol table" "unavailable or elfdump failed; see $output (exit=$rc)"
              fi
              return 0
            }

            capture_symbol_table "libshadow" "$SHADOW_LIB" dynsym-libshadow.txt
            capture_symbol_table "libfb" "$FB_LIB" dynsym-libfb.txt
            capture_symbol_table "Xorg" "$XORG_BIN" dynsym-Xorg.txt

            check_defined_symbol() {
              sym=$1
              table=$2
              if [ -s "$ART/$table" ] &&
                nawk -v s="$sym" \
                  'NF >= 9 && $NF == s && $(NF-1) != "UNDEF" && \
                   $(NF-5) == "FUNC" && \
                   ($(NF-4) == "GLOB" || $(NF-4) == "WEAK") { found=1 }
                   END { exit(found ? 0 : 1) }' "$ART/$table"; then
                record_acceptance PASS "Export $sym" "$table contains a defined global/weak FUNC"
              else
                record_acceptance FAIL "Export $sym" "defined global/weak FUNC not found in $table"
              fi
              return 0
            }

            check_defined_symbol shadowSetup dynsym-libshadow.txt
            check_defined_symbol shadowAdd dynsym-libshadow.txt
            check_defined_symbol shadowUpdateRotate32_270 dynsym-libshadow.txt
            check_defined_symbol fbScreenInit dynsym-libfb.txt
            check_defined_symbol fbPictureInit dynsym-libfb.txt
            check_defined_symbol DamageRegionAppend dynsym-Xorg.txt
            check_defined_symbol DamageRegionProcessPending dynsym-Xorg.txt
            check_defined_symbol miDCInitialize dynsym-Xorg.txt
            check_defined_symbol LoaderSymbol dynsym-Xorg.txt
            check_defined_symbol xf86GetPointerScreenFuncs dynsym-Xorg.txt
            check_defined_symbol xf86LoadSubModule dynsym-Xorg.txt

            # Runtime acceptance must execute in the real Xorg process. A standalone
            # dlopen() process cannot resolve symbols exported only by /usr/bin/Xorg.
            # Build a temporary, genuine Xorg module whose SetupProc asks Xorg's own
            # LoaderSymbol() for the server and helper exports after fb/shadow load.
            mkdir -p "$ART/xorg-loader-probe"
            PROBE_DIR=$(cd "$ART/xorg-loader-probe" && pwd -P)
            cat > "$ART/xorg-loader-probe.c" <<'EOF'
            #include <stdio.h>
            #include "xorg-server.h"
            #include "xf86Module.h"

            static const char *required_symbols[] = {
                "PixmapWidthPaddingInfo",
                "fbScreenInit",
                "fbPictureInit",
                "shadowSetup",
                "shadowAdd",
                "shadowUpdateRotate32_270",
                NULL
            };

            static void *
            rotfbprobe_setup(void *module, void *options, int *errmaj, int *errmin)
            {
                int i;
                int failed = 0;
                (void)options;
                (void)errmin;

                for (i = 0; required_symbols[i] != NULL; i++) {
                    void *address = LoaderSymbol(required_symbols[i]);
                    if (address == NULL) {
                        fprintf(stderr,
                            "ROTFB_XORG_LOADER_PROBE_FAIL symbol=%s\\n",
                            required_symbols[i]);
                        failed = 1;
                    } else {
                        fprintf(stderr,
                            "ROTFB_XORG_LOADER_PROBE_PASS symbol=%s address=%p\\n",
                            required_symbols[i], address);
                    }
                }
                fflush(stderr);
                if (failed) {
                    if (errmaj != NULL)
                        *errmaj = LDR_MODSPECIFIC;
                    return NULL;
                }
                return module;
            }

            static XF86ModuleVersionInfo rotfbprobe_version = {
                "rotfbprobe",
                MODULEVENDORSTRING,
                MODINFOSTRING1,
                MODINFOSTRING2,
                XORG_VERSION_CURRENT,
                0, 0, 0,
                ABI_CLASS_ANSIC,
                ABI_ANSIC_VERSION,
                MOD_CLASS_NONE,
                {0, 0, 0, 0}
            };

            _X_EXPORT XF86ModuleData rotfbprobeModuleData = {
                &rotfbprobe_version,
                rotfbprobe_setup,
                NULL
            };
            EOF

            : > "$ART/xorg-loader-probe-build.log"
            : > "$ART/xorg-module-loader-resolution.txt"
            : > "$ART/xorg-module-loader-stdout.txt"
            : > "$ART/xorg-module-loader-stderr.txt"
            : > "$ART/xorg-module-loader-exit-status.txt"
            : > "$ART/xorg-module-loader.log"
            XORG_PROBE_COMPILED=0
            if $CC -m64 -fPIC -fvisibility=default -shared \
              $(pkg-config --cflags xorg-server) \
              -o "$PROBE_DIR/librotfbprobe.so" "$ART/xorg-loader-probe.c" \
              > "$ART/xorg-loader-probe-build.log" 2>&1; then
              XORG_PROBE_COMPILED=1
              record_acceptance PASS "Compile Xorg-native LoaderSymbol probe module" "librotfbprobe.so"
            else
              rc=$?
              record_acceptance FAIL "Compile Xorg-native LoaderSymbol probe module" "compiler exit=$rc; see xorg-loader-probe-build.log"
            fi

            # Capture the probe path, permissions and ELF diagnostics omitted from Run #7.
            PROBE_SO="$PROBE_DIR/librotfbprobe.so"
            XORG_PROBE_INSTALLED=0
            : > "$ART/xorg-probe-source-diagnostics.txt"
            : > "$ART/xorg-probe-install-diagnostics.txt"
            : > "$ART/xorg-probe-root-cause-report.txt"
            if [ "$XORG_PROBE_COMPILED" -eq 1 ] && [ -s "$PROBE_SO" ]; then
              {
                echo "PROBE_DIR=$PROBE_DIR"
                echo "PROBE_SO=$PROBE_SO"
                echo "MODULEDIR=$MODULEDIR"
                echo "Load name=rotfbprobe; expected basename=librotfbprobe.so"
                echo "Xorg launcher identity:"
                id -a
                python3 -c 'import os,pwd; print("launcher_euid=%s user=%s" % (os.geteuid(), pwd.getpwuid(os.geteuid()).pw_name))'
                echo "probe and every parent directory:"
                p="$PROBE_SO"
                while :; do
                  ls -ld "$p" 2>&1 || true
                  if [ -d "$p" ]; then
                    if [ -x "$p" ]; then echo "PASS directory searchable: $p"; else echo "FAIL directory not searchable: $p"; fi
                  fi
                  [ "$p" != "/" ] || break
                  p=$(dirname "$p")
                done
                if [ -r "$PROBE_SO" ]; then echo "PASS probe readable by Xorg launcher identity"; else echo "FAIL probe unreadable by Xorg launcher identity"; fi
                if [ "$(basename "$PROBE_SO")" = "librotfbprobe.so" ]; then echo "PASS filename matches Load name"; else echo "FAIL filename mismatch"; fi
              } > "$ART/xorg-probe-source-diagnostics.txt" 2>&1
              probe_diag() {
                label=$1; shift
                {
                  echo "### $label"; printf 'command='; printf '%s ' "$@"; echo
                  if "$@"; then echo "exit_code=0"; else rc=$?; echo "exit_code=$rc"; fi
                } >> "$ART/xorg-probe-source-diagnostics.txt" 2>&1
              }
              probe_diag "file" file "$PROBE_SO"
              probe_diag "elfdump -e" elfdump -e "$PROBE_SO"
              probe_diag "elfdump -d" elfdump -d "$PROBE_SO"
              probe_diag "ldd" ldd "$PROBE_SO"
              probe_diag "SHA-256" digest -a sha256 "$PROBE_SO"

              TEMP_PROBE_TARGET="$MODULEDIR/librotfbprobe.so"
              TEMP_PROBE_STAGE="$MODULEDIR/.rotfbprobe-$GITHUB_RUN_ID-$$.stage"
              {
                echo "target=$TEMP_PROBE_TARGET"; echo "stage=$TEMP_PROBE_STAGE"
                echo "MODULEDIR metadata:"; ls -ld "$MODULEDIR" 2>&1 || true
                if [ -e "$TEMP_PROBE_TARGET" ] || [ -L "$TEMP_PROBE_TARGET" ]; then
                  echo "FAIL target already exists; it will not be overwritten"
                else echo "PASS target absent before test"; fi
                if [ -e "$TEMP_PROBE_STAGE" ] || [ -L "$TEMP_PROBE_STAGE" ]; then
                  echo "FAIL stage already exists"
                else echo "PASS stage absent"; fi
                if [ -r "$MODULEDIR" ] && [ -x "$MODULEDIR" ] && [ -w "$MODULEDIR" ]; then
                  echo "PASS MODULEDIR readable/searchable/writable by launcher identity"
                else echo "FAIL MODULEDIR access check"; fi
              } > "$ART/xorg-probe-install-diagnostics.txt" 2>&1

              if [ ! -e "$TEMP_PROBE_TARGET" ] && [ ! -L "$TEMP_PROBE_TARGET" ] &&
                [ -r "$MODULEDIR" ] && [ -x "$MODULEDIR" ] && [ -w "$MODULEDIR" ]; then
                if (set -C; : > "$TEMP_PROBE_STAGE") >> "$ART/xorg-probe-install-diagnostics.txt" 2>&1; then
                  TEMP_PROBE_OWNED=1
                  if cp -p "$PROBE_SO" "$TEMP_PROBE_STAGE" >> "$ART/xorg-probe-install-diagnostics.txt" 2>&1 &&
                    ln "$TEMP_PROBE_STAGE" "$TEMP_PROBE_TARGET" >> "$ART/xorg-probe-install-diagnostics.txt" 2>&1; then
                  {
                    echo "test -r:"; test -r "$TEMP_PROBE_TARGET" && echo PASS || echo FAIL
                    echo "test -s:"; test -s "$TEMP_PROBE_TARGET" && echo PASS || echo FAIL
                    echo "ls -l:"; ls -l "$TEMP_PROBE_TARGET"
                    echo "file:"; file "$TEMP_PROBE_TARGET"
                    echo "target SHA-256:"; digest -a sha256 "$TEMP_PROBE_TARGET"
                    echo "source SHA-256:"; digest -a sha256 "$PROBE_SO"
                    echo "byte comparison:"; cmp "$PROBE_SO" "$TEMP_PROBE_TARGET" && echo PASS
                    echo "elfdump -e:"; elfdump -e "$TEMP_PROBE_TARGET"
                    echo "elfdump -d:"; elfdump -d "$TEMP_PROBE_TARGET"
                    echo "ldd:"; ldd "$TEMP_PROBE_TARGET"
                    } >> "$ART/xorg-probe-install-diagnostics.txt" 2>&1 || true
                    if test -r "$TEMP_PROBE_TARGET" && test -s "$TEMP_PROBE_TARGET" &&
                      cmp -s "$PROBE_SO" "$TEMP_PROBE_TARGET" &&
                      [ "$(digest -a sha256 "$PROBE_SO" | awk '{print $1}')" = "$(digest -a sha256 "$TEMP_PROBE_TARGET" | awk '{print $1}')" ]; then
                      XORG_PROBE_INSTALLED=1
                    else echo "FAIL target verification or SHA mismatch" >> "$ART/xorg-probe-install-diagnostics.txt"; fi
                  else
                    echo "FAIL copy/link into MODULEDIR; owned stage will be cleaned by EXIT trap" >> "$ART/xorg-probe-install-diagnostics.txt"
                  fi
                else
                  echo "FAIL could not exclusively create stage path; pre-existing stage left untouched" >> "$ART/xorg-probe-install-diagnostics.txt"
                fi
              else
                echo "FAIL target pre-exists or MODULEDIR access denied; no overwrite attempted" >> "$ART/xorg-probe-install-diagnostics.txt"
              fi

              if [ "$XORG_PROBE_INSTALLED" -eq 1 ]; then
                {
                  echo "Run #7: Xorg loaded libfb.so and libshadow.so from MODULEDIR but did not discover rotfbprobe from additional PROBE_DIR."
                  echo "Run #7 omitted probe file/parent permissions, probe ELF diagnostics, and Xorg launcher identity."
                  echo "The exact lower-level reason for the additional-PROBE_DIR lookup failure is not established."
                  echo "This run tests canonical MODULEDIR placement and captures the missing evidence."
                } > "$ART/xorg-probe-root-cause-report.txt"
              else
                {
                  echo "Probe could not be safely installed and verified in MODULEDIR."
                  echo "No pre-existing target was overwritten. See source and install diagnostics."
                  echo "The exact lower-level Run #7 failure remains unproven."
                } > "$ART/xorg-probe-root-cause-report.txt"
              fi
            fi

            if [ "$XORG_PROBE_COMPILED" -eq 1 ] &&
              [ "$XORG_PROBE_INSTALLED" -eq 1 ] &&
              [ -s "$PROBE_SO" ]; then
              cat > "$ART/xorg-module-loader-test.conf" <<EOF
            Section "Files"
                ModulePath "$MODULEDIR"
            EndSection

            Section "Module"
                Load "fb"
                Load "shadow"
                Load "rotfbprobe"
            EndSection

            # Deliberately name a nonexistent video driver. Xorg loads the explicit
            # Module section first; it then reaches the deterministic "No drivers
            # available" terminal condition without touching a physical framebuffer.
            Section "Device"
                Identifier "ROTFBLoaderProbeDevice"
                Driver "rotfb-loader-no-device"
            EndSection

            Section "Screen"
                Identifier "ROTFBLoaderProbeScreen"
                Device "ROTFBLoaderProbeDevice"
            EndSection

            Section "ServerLayout"
                Identifier "ROTFBLoaderProbeLayout"
                Screen 0 "ROTFBLoaderProbeScreen"
            EndSection
            EOF
              python3 - "$XORG_BIN" "$ART/xorg-module-loader-test.conf" \
                "$ART/xorg-module-loader.log" "$ART/xorg-module-loader-stdout.txt" \
                "$ART/xorg-module-loader-stderr.txt" \
                > "$ART/xorg-module-loader-exit-status.txt" 2>&1 <<'PY'
            import os, pwd, subprocess, sys
            xorg, config, logfile, stdout_path, stderr_path = sys.argv[1:]
            command = [
                xorg, ":97", "-config", config, "-logfile", logfile,
                "-noreset", "-novtswitch", "-nolisten", "tcp",
                "-verbose", "7", "-logverbose", "7"
            ]
            print("command=" + " ".join(command))
            print(f"launcher_euid={os.geteuid()} launcher_user={pwd.getpwuid(os.geteuid()).pw_name}")
            try:
                with open(stdout_path, "w") as stdout, open(stderr_path, "w") as stderr:
                    result = subprocess.run(command, stdout=stdout, stderr=stderr,
                                            timeout=45, check=False)
                print(f"exit_code={result.returncode}")
                print("timed_out=no")
            except subprocess.TimeoutExpired:
                print("exit_code=timeout")
                print("timed_out=yes")
            except Exception as exc:
                print("exit_code=launch-error")
                print("timed_out=no")
                print(f"launch_error={exc!r}")
            PY
              cat "$ART/xorg-module-loader.log" \
                "$ART/xorg-module-loader-stdout.txt" \
                "$ART/xorg-module-loader-stderr.txt" \
                > "$ART/xorg-module-loader-combined.log"

              if grep -Fq "ModulePath set to \"$MODULEDIR\"" "$ART/xorg-module-loader.log"; then
                record_acceptance PASS "Xorg uses canonical MODULEDIR for probe discovery" "$MODULEDIR; see xorg-module-loader.log"
              else
                record_acceptance FAIL "Xorg uses canonical MODULEDIR for probe discovery" "effective ModulePath not confirmed"
              fi
              if grep -Fq "Loading $TEMP_PROBE_TARGET" "$ART/xorg-module-loader.log"; then
                record_acceptance PASS "Xorg native loader discovered librotfbprobe.so" "$TEMP_PROBE_TARGET; see xorg-module-loader.log"
              else
                record_acceptance FAIL "Xorg native loader discovered librotfbprobe.so" "exact Loading path not confirmed"
              fi
              if grep -Fq 'Module rotfbprobe:' "$ART/xorg-module-loader.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=PixmapWidthPaddingInfo ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=fbScreenInit ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=fbPictureInit ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=shadowSetup ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=shadowAdd ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=shadowUpdateRotate32_270 ' "$ART/xorg-module-loader-combined.log"; then
                record_acceptance PASS "Xorg accepted rotfbprobe module SetupProc" "Module record and all six SetupProc markers confirmed"
              else
                record_acceptance FAIL "Xorg accepted rotfbprobe module SetupProc" "SetupProc execution not proven by all six markers"
              fi
              if grep -Fq 'Module fb:' "$ART/xorg-module-loader.log" &&
                grep -Fq "$FB_LIB" "$ART/xorg-module-loader.log"; then
                record_acceptance PASS "Xorg native loader loaded libfb.so" "$FB_LIB; see xorg-module-loader.log"
              else
                record_acceptance FAIL "Xorg native loader loaded libfb.so" "module load not confirmed in Xorg log"
              fi
              if grep -Fq 'Module shadow:' "$ART/xorg-module-loader.log" &&
                grep -Fq "$SHADOW_LIB" "$ART/xorg-module-loader.log"; then
                record_acceptance PASS "Xorg native loader loaded libshadow.so" "$SHADOW_LIB; see xorg-module-loader.log"
              else
                record_acceptance FAIL "Xorg native loader loaded libshadow.so" "module load not confirmed in Xorg log"
              fi

              for sym in PixmapWidthPaddingInfo fbScreenInit fbPictureInit shadowSetup shadowAdd shadowUpdateRotate32_270; do
                if grep -Fq "ROTFB_XORG_LOADER_PROBE_PASS symbol=$sym " "$ART/xorg-module-loader-combined.log"; then
                  record_acceptance PASS "Xorg LoaderSymbol resolves $sym" "resolved inside /usr/bin/Xorg process"
                else
                  record_acceptance FAIL "Xorg LoaderSymbol resolves $sym" "runtime lookup not confirmed; see xorg-module-loader-combined.log"
                fi
              done

              if grep -Eq '^timed_out=no$' "$ART/xorg-module-loader-exit-status.txt" &&
                grep -Fq 'No drivers available.' "$ART/xorg-module-loader.log" &&
                ! grep -Eiq 'relocation error|referenced symbol not found|ROTFB_XORG_LOADER_PROBE_FAIL' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'Module fb:' "$ART/xorg-module-loader.log" &&
                grep -Fq 'Module shadow:' "$ART/xorg-module-loader.log" &&
                grep -Fq "ModulePath set to \"$MODULEDIR\"" "$ART/xorg-module-loader.log" &&
                grep -Fq "Loading $TEMP_PROBE_TARGET" "$ART/xorg-module-loader.log" &&
                grep -Fq 'Module rotfbprobe:' "$ART/xorg-module-loader.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=PixmapWidthPaddingInfo ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=fbScreenInit ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=fbPictureInit ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=shadowSetup ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=shadowAdd ' "$ART/xorg-module-loader-combined.log" &&
                grep -Fq 'ROTFB_XORG_LOADER_PROBE_PASS symbol=shadowUpdateRotate32_270 ' "$ART/xorg-module-loader-combined.log"; then
                {
                  echo "PASS: /usr/bin/Xorg 1.19.7 loaded libfb.so and libshadow.so through its native Module loader."
                  echo "PASS: the temporary Xorg module called LoaderSymbol() for all six real server/helper symbols."
                  echo "PASS: no unresolved relocation was reported."
                  echo "EXPECTED TERMINATION: the test-only nonexistent video driver leaves Xorg with no drivers; no framebuffer device is opened."
                  cat "$ART/xorg-module-loader-exit-status.txt"
                } > "$ART/xorg-module-loader-resolution.txt"
                record_acceptance PASS "Xorg-native module loader runtime resolution" "both helpers loaded and all six LoaderSymbol lookups succeeded; expected no-driver termination"
              else
                {
                  echo "FAIL: Xorg-native module loader test did not satisfy every runtime condition."
                  cat "$ART/xorg-module-loader-exit-status.txt"
                  echo "See xorg-module-loader.log, stdout, stderr and combined log."
                } > "$ART/xorg-module-loader-resolution.txt"
                record_acceptance FAIL "Xorg-native module loader runtime resolution" "missing module/symbol proof, unexpected loader error, or test did not reach expected terminal condition"
              fi
            else
              printf 'NOT RUN: Xorg LoaderSymbol probe module did not compile or could not be safely installed.\\n' > "$ART/xorg-module-loader-resolution.txt"
              record_acceptance FAIL "Xorg uses canonical MODULEDIR for probe discovery" "probe unavailable; see probe diagnostics"
              record_acceptance FAIL "Xorg native loader discovered librotfbprobe.so" "probe unavailable; runtime not launched"
              record_acceptance FAIL "Xorg accepted rotfbprobe module SetupProc" "probe unavailable; runtime not launched"
              record_acceptance FAIL "Xorg native loader loaded libfb.so" "runtime not launched"
              record_acceptance FAIL "Xorg native loader loaded libshadow.so" "runtime not launched"
              for sym in PixmapWidthPaddingInfo fbScreenInit fbPictureInit shadowSetup shadowAdd shadowUpdateRotate32_270; do
                record_acceptance FAIL "Xorg LoaderSymbol resolves $sym" "probe unavailable; lookup not performed"
              done
              record_acceptance FAIL "Xorg-native module loader runtime resolution" "probe unavailable; see probe diagnostics"
            fi
            cleanup_temporary_probe

            # Resolve every strong undefined DDX symbol against the target
            # Xorg executable, installed Xorg modules and DT_NEEDED libraries.
            # Pre-create reports so they are present even if the parser fails.
            : > "$ART/undefined-dynamic-symbols.txt"
            : > "$ART/undefined-symbol-resolution.txt"
            : > "$ART/undefined-symbol-check.log"
            if python3 - "$ART/illumosfb_drv.so" "$XORG_BIN" "$SHADOW_LIB" "$FB_LIB" "$ART/ldd.txt" "$ART" <<'PY' > "$ART/undefined-symbol-check.log" 2>&1
            import os, subprocess, sys
            so, xorg, shadow, fb, ldd_file, art = sys.argv[1:]

            def symbols(path, required=False):
                try:
                    out = subprocess.check_output(
                        ["elfdump", "-s", "-N", ".dynsym", path],
                        text=True, stderr=subprocess.STDOUT)
                except Exception as exc:
                    if required:
                        raise RuntimeError(f"elfdump failed for required provider {path}: {exc}")
                    print(f"WARNING: cannot inspect optional provider {path}: {exc}")
                    return [], []
                defined, undefined = [], []
                parsed = 0
                for line in out.splitlines():
                    fields = line.split()
                    if len(fields) < 9 or not fields[0].startswith("["):
                        continue
                    parsed += 1
                    typ, bind, shndx, name = fields[-6], fields[-5], fields[-2], fields[-1]
                    if bind not in ("GLOB", "WEAK"):
                        continue
                    if shndx == "UNDEF":
                        if bind == "GLOB":
                            undefined.append((name, typ))
                    elif typ != "NOTY":
                        defined.append((name, typ))
                if required and parsed == 0:
                    raise RuntimeError(f"no parseable .dynsym entries in required provider {path}")
                return defined, undefined

            required_providers = [xorg, shadow, fb]
            if not all(required_providers):
                raise RuntimeError("Xorg, libshadow.so or libfb.so path is unavailable")

            providers = set(required_providers)
            with open(ldd_file, encoding="utf-8", errors="replace") as stream:
                for line in stream:
                    for token in line.split():
                        if token.startswith("/") and os.path.isfile(token):
                            providers.add(os.path.realpath(token))

            module_roots = set()
            for provider in (shadow, fb):
                current = os.path.dirname(os.path.realpath(provider))
                while current != "/" and not current.endswith("/xorg/modules"):
                    current = os.path.dirname(current)
                if current.endswith("/xorg/modules"):
                    module_roots.add(current)
            for root in sorted(module_roots):
                for base, dirs, files in os.walk(root, followlinks=True):
                    for filename in files:
                        if filename.endswith(".so"):
                            candidate = os.path.join(base, filename)
                            if os.path.isfile(candidate):
                                providers.add(os.path.realpath(candidate))

            defined_by = {}
            for provider in sorted(providers):
                definitions, _ = symbols(provider, required=(provider in required_providers))
                for name, typ in definitions:
                    defined_by.setdefault(name.split("@", 1)[0], (typ, provider))

            _, undefined = symbols(so, required=True)
            with open(os.path.join(art, "undefined-dynamic-symbols.txt"), "w") as stream:
                stream.write("\n".join(sorted({name for name, _ in undefined})) + "\n")
            with open(os.path.join(art, "undefined-symbol-resolution.txt"), "w") as stream:
                for name, typ in sorted(set(undefined)):
                    provider = defined_by.get(name.split("@", 1)[0], ("", "UNRESOLVED"))[1]
                    stream.write(f"{name} [{typ}] -> {provider}\n")

            unresolved = sorted({
                (name, typ) for name, typ in undefined
                if name.split("@", 1)[0] not in defined_by or
                (typ != "NOTY" and defined_by[name.split("@", 1)[0]][0] not in (typ, "NOTY"))
            })
            if unresolved:
                print("Unresolved strong undefined dynamic symbols:", *unresolved, sep="\n", file=sys.stderr)
                sys.exit(1)
            print(f"PASS: resolved {len(set(undefined))} strong undefined dynamic symbols")
            PY
            then
              record_acceptance PASS "Resolve strong undefined dynamic symbols" "see undefined-symbol-resolution.txt"
            else
              rc=$?
              record_acceptance FAIL "Resolve strong undefined dynamic symbols" "parser/resolution exit=$rc; see undefined-symbol-check.log and resolution reports"
            fi

            # Source/API contract checks are independent and remain visible even
            # when an earlier ELF, export or runtime-loader acceptance check fails.
            check_source_text() {
              label=$1
              text=$2
              if grep -Fq "$text" "$GITHUB_WORKSPACE/rotfb-ddx/src/illumosfb_driver.c"; then
                record_acceptance PASS "$label" "source contract present"
              else
                record_acceptance FAIL "$label" "source contract missing"
              fi
              return 0
            }
            check_source_text "Load fb helper through Xorg loader" 'xf86LoadSubModule(pScrn, "fb")'
            check_source_text "Load shadow helper through Xorg loader" 'xf86LoadSubModule(pScrn, "shadow")'
            check_source_text "Resolve shadow rotation through LoaderSymbol" 'LoaderSymbol("shadowUpdateRotate32_270")'
            check_source_text "Declare video driver ABI class" 'ABI_CLASS_VIDEODRV'
            check_source_text "Declare video driver ABI version" 'ABI_VIDEODRV_VERSION'

            echo "binary_sha256=$(digest -a sha256 "$ART/illumosfb_drv.so")"
            echo "acceptance_failures=$ACCEPTANCE_FAILURES"
            if [ "$ACCEPTANCE_FAILURES" -ne 0 ]; then
              echo "ROTFB DDX acceptance failed: $ACCEPTANCE_FAILURES check(s) failed." >&2
              exit 1
            fi
            echo "binary_sha256=$(digest -a sha256 "$ART/illumosfb_drv.so")"
            ROTFB_DDX_BUILD

      - name: Upload native DDX build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotfb-ddx-openindiana-${{ github.run_id }}-${{ github.sha }}
          path: rotfb-ddx-artifacts/
          if-no-files-found: error
          retention-days: 30
