name: AX101 RUN107 — scanfix archive integrity

on:
  push:
    branches: [ax101-r5-integration-validation]
    paths:
      - "wifi-ax101/scanfix-archive-parts/**"
      - "wifi-ax101/scanfix-implementation-recovered.tar.gz"
      - ".github/workflows/ax101-scanfix-archive-verify.yml"

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reconstruct and independently inspect the archive
        shell: bash
        run: |
          set -Eeuo pipefail
          parts=wifi-ax101/scanfix-archive-parts
          reconstructed="$RUNNER_TEMP/scanfix-implementation.tar.gz"
          committed=wifi-ax101/scanfix-implementation-recovered.tar.gz
          test "$(find "$parts" -maxdepth 1 -type f -name '*.b64' | wc -l | tr -d ' ')" = 8
          cat "$parts"/*.b64 | tr -d '\r\n ' | base64 --decode > "$reconstructed"
          cmp -s "$reconstructed" "$committed"
          sha256sum "$reconstructed" | tee scanfix-archive-sha256.txt
          tar -tzf "$reconstructed" | LC_ALL=C sort | tee scanfix-archive-members.txt
          mkdir -p extracted
          tar -xzf "$reconstructed" -C extracted
          root=extracted/scanfix-implementation
          test -d "$root"
          test -f "$root/patches/0028-ax101-scan-notification-rx-fix.patch"
          patch_sha=$(sha256sum "$root/patches/0028-ax101-scan-notification-rx-fix.patch" | awk '{print $1}')
          test "$patch_sha" = "9d469589bc5397efa89199a5c2fa86654a62956ab6ff4e0c33807e52b8e91f80"
          test -f "$root/tests/scan-regression.py"
          test -f "$root/tests/run-ax101-scan-validation.sh"
          test -f "$root/diagnostics/ax101-scan.d"
          test -f "$root/engineering/SCAN-DISCOVERY-ROOT-CAUSE.md"
          test -f "$root/evidence/source-candidate-verification.txt"
          python3 -m py_compile "$root/tests/scan-regression.py"
          bash -n "$root/tests/run-ax101-scan-validation.sh"
          {
            echo "ARCHIVE_PART_COUNT=8"
            echo "ARCHIVE_PARTS_MATCH_COMMITTED_BINARY=PASS"
            echo "ARCHIVE_SHA256=$(sha256sum "$reconstructed" | awk '{print $1}')"
            echo "PATCH_0028_SHA256=$patch_sha"
            echo "REQUIRED_MATERIALS=6/6"
            echo "PYTHON_SYNTAX=PASS"
            echo "PHYSICAL_RUNNER_SYNTAX=PASS"
            echo "ARCHIVE_RECONSTRUCTION=PASS"
          } | tee scanfix-archive-verification.txt
          cp "$reconstructed" scanfix-implementation.tar.gz
          cp -a extracted/scanfix-implementation scanfix-implementation
      - name: Upload verified source archive and inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: AX101-RUN107-SCANFIX-ARCHIVE-VERIFIED-${{ github.run_id }}
          path: |
            scanfix-implementation.tar.gz
            scanfix-implementation/
            scanfix-archive-sha256.txt
            scanfix-archive-members.txt
            scanfix-archive-verification.txt
          if-no-files-found: error
          retention-days: 30
