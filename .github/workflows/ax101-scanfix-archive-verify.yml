name: AX101 RUN107 — scanfix archive integrity and repair

on:
  push:
    branches: [ax101-r5-integration-validation]
    paths:
      - "wifi-ax101/scanfix-archive-parts/**"
      - "wifi-ax101/scanfix-implementation-recovered.tar.gz"
      - ".github/workflows/ax101-scanfix-archive-verify.yml"

permissions:
  contents: write
  actions: read

jobs:
  verify-and-repair-archive:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download immutable recovery source and validate exact member bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/scanfix-recovery"
          cd "$RUNNER_TEMP/scanfix-recovery"
          curl -fLsS --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15256697062/zip" \
            -o recovery-source-artifact.zip
          echo "f6383f5080548c2dc05639cbeede570950b413b20d734d4856bee59f67b0d71d  recovery-source-artifact.zip" | sha256sum -c -
          unzip -q recovery-source-artifact.zip
          ROOT=restoration/scanfix-implementation
          test -d "$ROOT"
          rm -rf "$ROOT/tests/__pycache__"
          PATCH="$ROOT/patches/0028-ax101-scan-notification-rx-fix.patch"
          python3 - "$PATCH" <<'PY'
          from pathlib import Path
          import hashlib, sys
          patch = Path(sys.argv[1])
          data = patch.read_bytes()
          corrupt = b"@@ -119=/,7 +12130,7"
          repaired = b"@@ -11969,7 +12130,7"
          expected = "9d469589bc5397efa89199a5c2fa86654a62956ab6ff4e0c33807e52b8e91f80"
          if hashlib.sha256(data).hexdigest() != expected:
              if data.count(corrupt) != 1:
                  raise SystemExit("scan patch corruption pattern is not the exact reviewed 2-byte defect")
              data = data.replace(corrupt, repaired, 1)
              patch.write_bytes(data)
          actual = hashlib.sha256(patch.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"patch SHA-256 mismatch after exact repair: {actual}")
          print(f"PATCH_0028_SHA256={actual}")
          PY
          (cd "$ROOT" && sha256sum -c SHA256SUMS) | tee scanfix-member-check.txt
          PATCH="$ROOT/patches/0028-ax101-scan-notification-rx-fix.patch"
          test -s "$PATCH"
          PATCH_SHA=$(sha256sum "$PATCH" | awk '{print $1}')
          test "$PATCH_SHA" = "9d469589bc5397efa89199a5c2fa86654a62956ab6ff4e0c33807e52b8e91f80"
          test -s "$ROOT/tests/scan-regression.py"
          test -s "$ROOT/tests/run-ax101-scan-validation.sh"
          test -s "$ROOT/diagnostics/ax101-scan.d"
          test -s "$ROOT/engineering/SCAN-DISCOVERY-ROOT-CAUSE.md"
          test -s "$ROOT/evidence/source-candidate-verification.txt"
          grep -Fx "SCANFIX_SOURCE_PATCH_SHA256=$PATCH_SHA" "$ROOT/evidence/source-candidate-verification.txt"
          grep -Fx "TARGET_KERNEL=illumos-c893fd03ad" "$ROOT/evidence/source-candidate-verification.txt"
          grep -Fx "SOLNIX_PIN=1cee7021091f3df92b7816ece2902ff59b37f1be" "$ROOT/evidence/source-candidate-verification.txt"
          grep -Fx "ILLUMOS_GATE_PIN=098e95820891f8a83fae679daece7fcf58b7b3a4" "$ROOT/evidence/source-candidate-verification.txt"
          grep -Fx "SCAN_REGRESSION=35/35 PASS" "$ROOT/evidence/source-candidate-verification.txt"
          grep -Fx "SCAN_NEGATIVE_CONTROLS=10/10 PASS" "$ROOT/evidence/source-candidate-verification.txt"
          python3 -m py_compile "$ROOT/tests/scan-regression.py"
          bash -n "$ROOT/tests/run-ax101-scan-validation.sh"
          rm -rf "$ROOT/tests/__pycache__"
          find "$ROOT" -type d -exec chmod 0755 {} +
          find "$ROOT" -type f -exec chmod 0644 {} +
          chmod 0755 "$ROOT/tests/run-ax101-scan-validation.sh" "$ROOT/tests/scan-regression.py"
          echo "RECOVERY_ARTIFACT_SHA256=$(sha256sum recovery-source-artifact.zip | awk '{print $1}')" | tee recovery-evidence.txt
          echo "PATCH_0028_SHA256=$PATCH_SHA" | tee -a recovery-evidence.txt
          echo "INTERNAL_MEMBER_CHECKSUMS=PASS" | tee -a recovery-evidence.txt
          echo "PYTHON_SYNTAX=PASS" | tee -a recovery-evidence.txt
          echo "PHYSICAL_RUNNER_SYNTAX=PASS" | tee -a recovery-evidence.txt
      - name: Rebuild deterministic archive, regenerate all eight transport parts and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/scanfix-recovery"
          ROOT=restoration/scanfix-implementation
          OUT="$GITHUB_WORKSPACE/wifi-ax101/scanfix-implementation-recovered.tar.gz"
          mkdir -p "$(dirname "$OUT")"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C restoration scanfix-implementation | gzip -n -9 > "$OUT"
          gzip -t "$OUT"
          ARCHIVE_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          test "$ARCHIVE_SHA" = "f108bbabc11e37457a4fc4b2a49308ef69f1aba384d933c916582b6267f342c2"
          PARTS="$GITHUB_WORKSPACE/wifi-ax101/scanfix-archive-parts"
          mkdir -p "$PARTS"
          rm -f "$PARTS"/*.b64
          python3 - "$OUT" "$PARTS" <<'PY'
          import base64, pathlib, sys
          archive = pathlib.Path(sys.argv[1]).read_bytes()
          encoded = base64.b64encode(archive).decode("ascii")
          expected = 25392
          if len(encoded) != expected:
              raise SystemExit(f"unexpected base64 length {len(encoded)} != {expected}")
          parts = [encoded[i:i+3500] for i in range(0, len(encoded), 3500)]
          if len(parts) != 8 or len(parts[-1]) != 892:
              raise SystemExit(f"unexpected part lengths {[len(p) for p in parts]}")
          root = pathlib.Path(sys.argv[2])
          for i, chunk in enumerate(parts):
              (root / f"{i:02d}.b64").write_text(chunk + "\n")
          print("ARCHIVE_PART_LENGTHS=" + ",".join(str(len(x)) for x in parts))
          PY
          cat "$PARTS"/*.b64 | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/scanfix-reconstructed.tar.gz"
          cmp -s "$OUT" "$RUNNER_TEMP/scanfix-reconstructed.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/scanfix-reconstructed.tar.gz" | awk '{print $1}')" = "$ARCHIVE_SHA"
          gzip -t "$RUNNER_TEMP/scanfix-reconstructed.tar.gz"
          tar -tzf "$OUT" | LC_ALL=C sort | tee "$GITHUB_WORKSPACE/scanfix-archive-members.txt"
          {
            echo "SOURCE_ARTIFACT_ID=15256697062"
            echo "SOURCE_ARTIFACT_WRAPPER_SHA256=f6383f5080548c2dc05639cbeede570950b413b20d734d4856bee59f67b0d71d"
            echo "ARCHIVE_SHA256=$ARCHIVE_SHA"
            echo "PATCH_0028_SHA256=9d469589bc5397efa89199a5c2fa86654a62956ab6ff4e0c33807e52b8e91f80"
            echo "PART_COUNT=8"
            echo "PART_LENGTHS=3500,3500,3500,3500,3500,3500,3500,892"
            echo "RECONSTRUCTION_BYTE_IDENTICAL=PASS"
            echo "GZIP_CRC=PASS"
            echo "INTERNAL_SHA256SUMS=PASS"
            echo "SCAN_REGRESSION=35/35 PASS"
            echo "SCAN_NEGATIVE_CONTROLS=10/10 PASS"
            echo "PHYSICAL_NETWORK_DISCOVERY=NOT_YET_VERIFIED"
          } | tee "$GITHUB_WORKSPACE/scanfix-archive-repair-report.txt"
      - name: Commit repaired archive and transport parts to validation branch
        shell: bash
        env:
          BRANCH: ax101-r5-integration-validation
        run: |
          set -Eeuo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wifi-ax101/scanfix-implementation-recovered.tar.gz wifi-ax101/scanfix-archive-parts/*.b64
          git add scanfix-archive-repair-report.txt scanfix-archive-members.txt
          git commit -m "fix(ax101): [skip ci] restore scanfix archive transport integrity"
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Upload repaired archive and verification report
        uses: actions/upload-artifact@v4
        with:
          name: AX101-RUN107-SCANFIX-ARCHIVE-REPAIRED-${{ github.run_id }}
          path: |
            wifi-ax101/scanfix-implementation-recovered.tar.gz
            wifi-ax101/scanfix-archive-parts/*.b64
            scanfix-archive-repair-report.txt
            scanfix-archive-members.txt
          if-no-files-found: error
          retention-days: 90
