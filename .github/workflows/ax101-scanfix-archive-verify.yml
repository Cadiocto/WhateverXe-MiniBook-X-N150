name: AX101 RUN107 — scanfix archive integrity

on:
  push:
    branches: [ax101-r5-integration-validation]
    paths:
      - "wifi-ax101/scanfix-archive-parts/**"
      - "wifi-ax101/scanfix-implementation-recovered.tar.gz"
      - ".github/workflows/ax101-scanfix-archive-verify.yml"

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reconstruct and independently inspect the archive
        shell: bash
        run: |
          set -Eeuo pipefail
          parts=wifi-ax101/scanfix-archive-parts
          reconstructed="$RUNNER_TEMP/scanfix-implementation.tar.gz"
          committed=wifi-ax101/scanfix-implementation-recovered.tar.gz
          test "$(find "$parts" -maxdepth 1 -type f -name '*.b64' | wc -l | tr -d ' ')" = 8
          cat "$parts"/*.b64 | tr -d '\r\n ' | base64 --decode > "$reconstructed"
          cmp -s "$reconstructed" "$committed"
          sha256sum "$reconstructed" | tee scanfix-archive-original-sha256.txt
          set +e
          gzip -t "$reconstructed" > scanfix-gzip-integrity.log 2>&1
          gzip_rc=$?
          gzip -dc "$reconstructed" > "$RUNNER_TEMP/scanfix-implementation.tar" 2> scanfix-gzip-decode.log
          decode_rc=$?
          set -e
          tar -tf "$RUNNER_TEMP/scanfix-implementation.tar" | LC_ALL=C sort | tee scanfix-archive-members.txt
          mkdir -p extracted
          tar -xf "$RUNNER_TEMP/scanfix-implementation.tar" -C extracted
          root=extracted/scanfix-implementation
          test -d "$root"
          set +e
          (cd "$root" && sha256sum -c SHA256SUMS) > scanfix-member-sha256-check.txt 2>&1
          member_rc=$?
          set -e
          cat scanfix-member-sha256-check.txt
          test -f "$root/patches/0028-ax101-scan-notification-rx-fix.patch"
          patch_sha=$(sha256sum "$root/patches/0028-ax101-scan-notification-rx-fix.patch" | awk '{print $1}')
          echo "ACTUAL_PATCH_SHA256=$patch_sha" | tee scanfix-patch-actual-sha256.txt
          echo "INTERNAL_MEMBER_SHA256_EXIT=$member_rc" | tee -a scanfix-patch-actual-sha256.txt
          test -f "$root/tests/scan-regression.py"
          test -f "$root/tests/run-ax101-scan-validation.sh"
          test -f "$root/diagnostics/ax101-scan.d"
          test -f "$root/engineering/SCAN-DISCOVERY-ROOT-CAUSE.md"
          test -f "$root/evidence/source-candidate-verification.txt"
          python3 -m py_compile "$root/tests/scan-regression.py"
          bash -n "$root/tests/run-ax101-scan-validation.sh"
          mkdir -p restoration
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C extracted scanfix-implementation | gzip -n -9 > restoration/scanfix-implementation.tar.gz
          gzip -t restoration/scanfix-implementation.tar.gz
          archive_sha=$(sha256sum restoration/scanfix-implementation.tar.gz | awk '{print $1}')
          {
            echo "ARCHIVE_PART_COUNT=8"
            echo "ARCHIVE_PARTS_MATCH_COMMITTED_BINARY=PASS"
            echo "ORIGINAL_ARCHIVE_SHA256=$(sha256sum "$reconstructed" | awk '{print $1}')"
            echo "ORIGINAL_GZIP_TEST_RC=$gzip_rc"
            echo "ORIGINAL_GZIP_DECODE_RC=$decode_rc"
            echo "INTERNAL_MEMBER_CHECKSUMS_EXIT=$member_rc"
            echo "EXPECTED_PATCH_0028_SHA256=9d469589bc5397efa89199a5c2fa86654a62956ab6ff4e0c33807e52b8e91f80"
            echo "ACTUAL_PATCH_0028_SHA256=$patch_sha"
            echo "REQUIRED_MATERIALS=6/6"
            echo "PYTHON_SYNTAX=PASS"
            echo "PHYSICAL_RUNNER_SYNTAX=PASS"
            echo "RESTORED_ARCHIVE_SHA256=$archive_sha"
            echo "RESTORED_GZIP_CRC=PASS"
            echo "ARCHIVE_RESTORATION=PASS"
          } | tee scanfix-archive-verification.txt
          cp -a extracted/scanfix-implementation restoration/scanfix-implementation
          cp scanfix-member-sha256-check.txt restoration/
          cp scanfix-patch-actual-sha256.txt restoration/
      - name: Upload verified source archive and inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: AX101-RUN107-SCANFIX-ARCHIVE-VERIFIED-${{ github.run_id }}
          path: |
            restoration/scanfix-implementation.tar.gz
            restoration/scanfix-implementation/
            scanfix-archive-original-sha256.txt
            scanfix-archive-members.txt
            scanfix-archive-verification.txt
          if-no-files-found: error
          retention-days: 30
