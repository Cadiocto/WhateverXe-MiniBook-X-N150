name: Intel AX101 Wi-Fi driver build (OpenIndiana)

on:
  push:
    branches: [wifi-ax101-openindiana]
    paths:
      - "wifi-ax101/**"
      - ".github/workflows/wifi-ax101-openindiana.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize VM builds without cancelling an active build when a newer commit arrives.
concurrency:
  group: wifi-ax101-openindiana-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iwx:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        shell: bash
        run: mkdir -p wifi-ax101-artifacts

      - name: Build pinned illumos iwx port in OpenIndiana 2026.10
        uses: vmactions/openindiana-vm@v1
        with:
          release: "202610-build"
          arch: x86_64
          mem: 8192
          cpu: 4
          sync: nfs
          run: |
            /usr/bin/bash -s <<'AX101_BUILD'
            set -Eeuo pipefail
            ART="$GITHUB_WORKSPACE/wifi-ax101-artifacts"
            mkdir -p "$ART"
            exec > >(tee "$ART/build.log") 2>&1
            rc=0
            finish() {
              rc=$?
              trap - EXIT
              printf 'exit_code=%s\n' "$rc" > "$ART/build-status.txt"
              printf 'completed_utc=%s\n' "$(date -u +%FT%TZ)" >> "$ART/build-status.txt"
              if [ -s "$ART/iwx" ]; then
                digest -a sha256 "$ART/iwx" > "$ART/iwx.sha256"
                file "$ART/iwx" > "$ART/iwx.file.txt"
                elfdump -e "$ART/iwx" > "$ART/iwx.elf-header.txt" 2>&1 || true
                elfdump -d "$ART/iwx" > "$ART/iwx.dynamic.txt" 2>&1 || true
                nm -p "$ART/iwx" > "$ART/iwx.symbols.txt" 2>&1 || true
              fi
              exit "$rc"
            }
            trap finish EXIT

            uname -a
            cat /etc/release
            test "$(uname -s)" = SunOS
            grep -q OpenIndiana /etc/release

            pkg refresh
            for fmri in developer/gcc-14 developer/build/gnu-make developer/versioning/git; do
              if ! pkg list -H "$fmri" >/dev/null 2>&1; then
                pkg install --accept "$fmri"
              fi
              pkg list -H "$fmri"
            done

            export PATH="/usr/gcc/14/bin:/usr/bin:/usr/sbin"
            export CC=/usr/gcc/14/bin/gcc
            export LD=/usr/bin/ld
            "$CC" --version | head -1
            gmake --version | head -1
            test -d /usr/include/sys

            SRC=/tmp/solnix-wifi
            PIN=1cee7021091f3df92b7816ece2902ff59b37f1be
            git clone --no-checkout https://github.com/atiq-cs/solnix.git "$SRC"
            git -C "$SRC" checkout --detach "$PIN"
            test "$(git -C "$SRC" rev-parse HEAD)" = "$PIN"
            echo "solnix_revision=$PIN" > "$ART/source-revision.txt"

            # Apply a local compatibility overlay without changing the pinned
            # solnix revision. Keep malloc and mbuf wait flags in one namespace.
            ALLOCATOR_PATCH="$GITHUB_WORKSPACE/wifi-ax101/patches/0001-openbsd-allocator-flags.patch"
            test -s "$ALLOCATOR_PATCH"
            git -C "$SRC" apply --check "$ALLOCATOR_PATCH"
            git -C "$SRC" apply "$ALLOCATOR_PATCH"
            git -C "$SRC" diff --check
            echo "allocator_flags_patch=0001-openbsd-allocator-flags.patch" >> "$ART/source-revision.txt"
            digest -a sha256 "$ALLOCATOR_PATCH" > "$ART/allocator-flags-patch.sha256"

            # Apply the bounded net80211 prepend-bounds fix to the pinned source.
            N80211_PATCH="$GITHUB_WORKSPACE/wifi-ax101/patches/0002-net80211-prepend-bounds.patch"
            test -s "$N80211_PATCH"
            git -C "$SRC" apply --check "$N80211_PATCH"
            git -C "$SRC" apply "$N80211_PATCH"
            git -C "$SRC" diff --check
            echo "net80211_patch=0002-net80211-prepend-bounds.patch" >> "$ART/source-revision.txt"
            digest -a sha256 "$N80211_PATCH" > "$ART/net80211-prepend-patch.sha256"

            # Keep the userland test stubs portable on the native illumos build host.
            TEST_PATCH="$GITHUB_WORKSPACE/wifi-ax101/patches/0003-mbuf-test-portability.patch"
            test -s "$TEST_PATCH"
            git -C "$SRC" apply --check "$TEST_PATCH"
            git -C "$SRC" apply "$TEST_PATCH"
            git -C "$SRC" diff --check
            echo "mbuf_test_patch=0003-mbuf-test-portability.patch" >> "$ART/source-revision.txt"
            digest -a sha256 "$TEST_PATCH" > "$ART/mbuf-test-portability-patch.sha256"

            # Run the existing userland mbuf harness against the patched implementation.
            cd "$SRC/src/ports/wifi/net80211"
            "$CC" -std=gnu99 -DN80211_MBUF_TEST -I../iwx n80211_mbuf_test.c n80211_mbuf.c ../iwx/iwx_mbuf.c -o "$ART/n80211_mbuf_test"
            "$ART/n80211_mbuf_test" | tee "$ART/n80211-mbuf-test.txt"
            "$CC" -std=gnu99 -DN80211_MBUF_TEST -DN80211_MBUF_SABOTAGE -I../iwx n80211_mbuf_test.c n80211_mbuf.c ../iwx/iwx_mbuf.c -o "$ART/n80211_mbuf_test_sabotage"
            set +e
            "$ART/n80211_mbuf_test_sabotage" > "$ART/n80211-mbuf-sabotage.log" 2>&1
            sabotage_rc=$?
            set -e
            if [ "$sabotage_rc" -ne 2 ]; then
              cat "$ART/n80211-mbuf-sabotage.log"
              echo "ERROR: n80211 mbuf negative control returned $sabotage_rc, expected 2" >&2
              exit 1
            fi
            echo "N80211_MBUF_NEGATIVE_CONTROL=PASS (expected exit 2)" >> "$ART/n80211-mbuf-test.txt"

            cd "$SRC/src/ports/wifi/iwx"
            bash "$GITHUB_WORKSPACE/wifi-ax101/check-ax101-source.sh" "$SRC/src/ports/wifi/iwx" | tee "$ART/ax101-source-gate.txt"
            ./gen-illumos-src.sh
            cd "$SRC/src/ports/wifi/net80211"
            ./gen-illumos-src.sh

            # The OpenIndiana proto omits the internal DLS header. iwm_gld.c
            # only needs DLS_SAP_LLC; provide the narrow, upstream-value shim.
            DLS_SHIM_SRC="$GITHUB_WORKSPACE/wifi-ax101/compat/sys/dls.h"
            DLS_SHIM_DST="$SRC/src/ports/wifi/iwm/compat-illumos/sys/dls.h"
            test -s "$DLS_SHIM_SRC"
            mkdir -p "$(dirname "$DLS_SHIM_DST")"
            # illumos /usr/bin/install is not GNU install: use cp for an
            # explicit source-file -> destination-file copy (no path search).
            cp "$DLS_SHIM_SRC" "$DLS_SHIM_DST"
            chmod 0644 "$DLS_SHIM_DST"
            cmp -s "$DLS_SHIM_SRC" "$DLS_SHIM_DST"
            test -s "$DLS_SHIM_DST"
            echo "DLS_SHIM_STAGED=$DLS_SHIM_DST"
            digest -a sha256 "$DLS_SHIM_DST" > "$ART/dls-shim.sha256"

            # Close the native GLDv3 net80211 header dependency chain using exact
            # headers from the pinned illumos-gate revision. Prefer target /usr/include
            # whenever a native header exists; stage only headers omitted from the proto.
            : > "$ART/net80211-header-closure.txt"
            for rel in sys/net80211_proto.h sys/net80211.h sys/net80211_crypto.h sys/net80211_ht.h sys/net80211_amrr.h net/wpa.h; do
              case "$rel" in
                sys/net80211_proto.h) expected_blob=4fe7d40604615e3ffd1adb80d6e061fd4859c546 ;;
                sys/net80211.h) expected_blob=be6b65fe905fabd6ebfd31cf74d7048357510e12 ;;
                sys/net80211_crypto.h) expected_blob=72ef3ebec3c9ccc599ba29823d3561198d953252 ;;
                sys/net80211_ht.h) expected_blob=449726aa0feae79d6bcea0f73e0625a7078a150e ;;
                sys/net80211_amrr.h) expected_blob=36bd2fcd0eacd88c7b2c307c32a4db32bff5ffa0 ;;
                net/wpa.h) expected_blob=82c4fd468a5f623411a98a814c40ba3d9ac4c87b ;;
                *) echo "ERROR: unlisted net80211 header $rel" >&2; exit 1 ;;
              esac
              src="$GITHUB_WORKSPACE/wifi-ax101/compat/$rel"
              test -s "$src"
              actual_blob=$(git -C "$GITHUB_WORKSPACE" hash-object "$src")
              if [ "$actual_blob" != "$expected_blob" ]; then
                echo "ERROR: $rel blob $actual_blob != pinned illumos-gate $expected_blob" >&2
                exit 1
              fi
              native="/usr/include/$rel"
              dst="$SRC/src/ports/wifi/iwm/compat-illumos/$rel"
              safe=$(printf '%s' "$rel" | tr '/' '-')
              if [ -s "$native" ]; then
                echo "NATIVE_HEADER_USED=$rel"
                digest -a sha256 "$native" > "$ART/native-header-$safe.sha256"
                printf '%s\t%s\tnative\n' "$rel" "$actual_blob" >> "$ART/net80211-header-closure.txt"
              else
                mkdir -p "$(dirname "$dst")"
                cp "$src" "$dst"
                chmod 0644 "$dst"
                cmp -s "$src" "$dst"
                echo "STAGED_PINNED_GATE_HEADER=$rel"
                digest -a sha256 "$dst" > "$ART/header-$safe.sha256"
                printf '%s\t%s\tstaged\n' "$rel" "$actual_blob" >> "$ART/net80211-header-closure.txt"
              fi
            done

            # Remaining dependencies are public target headers and must come from OI.
            for rel in sys/mac.h sys/mac_provider.h sys/ethernet.h sys/atomic.h inet/wifi_ioctl.h; do
              test -s "/usr/include/$rel" || {
                echo "ERROR: missing native OpenIndiana header /usr/include/$rel" >&2
                exit 1
              }
              printf '%s\tnative-dependency\n' "$rel" >> "$ART/net80211-header-closure.txt"
            done

            cd "$SRC/src/ports/wifi/iwx"
            gmake -f Makefile.illumos clean
            # Keep going across independent translation units so one missing
            # header does not hide the rest of the compile-time error surface.
            gmake -k -f Makefile.illumos -j4 UTSINC=/usr/include LD=/usr/bin/ld
            test -s iwx
            cp iwx "$ART/iwx"
            cp Makefile.illumos "$ART/"
            cp STATUS.md "$ART/upstream-iwx-STATUS.md"
            cp PROVENANCE.md "$ART/upstream-iwx-PROVENANCE.md"

            # AX101 uses the SO/HR1 API-77 image, not the AX211 SO/GF image.
            FWBASE="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain"
            curl -fL "$FWBASE/iwlwifi-so-a0-hr-b0-77.ucode?id=20241017" -o "$ART/iwx-so-a0-hr-b0-77"
            curl -fL "$FWBASE/LICENCE.iwlwifi_firmware?id=20241017" -o "$ART/iwx-license"
            test -s "$ART/iwx-so-a0-hr-b0-77"
            grep -qi "redistribution" "$ART/iwx-license"
            digest -a sha256 "$ART/iwx-so-a0-hr-b0-77" > "$ART/ax101-firmware.sha256"
            echo "BUILD_OK: native OpenIndiana iwx module linked; AX101 HR1 API-77 firmware staged" > "$ART/STATUS.txt"
            AX101_BUILD

      - name: Upload AX101 driver build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-ax101-openindiana-${{ github.run_id }}-${{ github.sha }}
          path: wifi-ax101-artifacts/
          if-no-files-found: error
          retention-days: 30
