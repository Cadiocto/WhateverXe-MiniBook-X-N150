name: AX101 RUN80 R5 Integration — exact candidate OpenIndiana build

on:
  push:
    branches: [ax101-r5-integration-validation]
    paths:
      - "r5-integration-transfer/**"
      - ".github/workflows/wifi-ax101-openindiana.yml"
  workflow_dispatch:

permissions:
  contents: read

# One global build slot for this workflow; never cancel an active native VM build.
concurrency:
  group: ax101-run80-r5-integration-openindiana-global
  cancel-in-progress: false

jobs:
  build-iwx:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout the exact workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare artifact and transfer directories
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p wifi-ax101-artifacts r5-runner-inputs

      - name: Verify exact R5 Integration candidate transfer before native build
        id: verify-candidate
        shell: bash
        env:
          EXPECTED_REF: refs/heads/ax101-r5-integration-validation
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ART="$GITHUB_WORKSPACE/wifi-ax101-artifacts"
          INPUTS="$GITHUB_WORKSPACE/r5-runner-inputs"
          BUNDLE="$ART/r5-integration-runner-inputs.zip"
          EXPECTED_CANDIDATE_SHA="f251541a7c60cc46cdaecc0719e42c576f6f5bd4699dea712a7db5ab9f54a1d0"
          EXPECTED_BUNDLE_SHA="a716503cc1a4fcf42004f459584492144739ea7aa12563e6fa1af5d2bc4dab0a"
          EXPECTED_SOLNIX_SHA="863b183cb8eed61458f3458f4321874d4aed89144e087a7c41f2df4c16913c40"
          EXPECTED_SOLNIX_BLOB="506136aad8f6d807b52d90146e2f76e53fcbcad1"
          PIN="1cee7021091f3df92b7816ece2902ff59b37f1be"
          ILLUMOS_PIN="098e95820891f8a83fae679daece7fcf58b7b3a4"
          {
            echo "github_ref=$GITHUB_REF"
            echo "github_ref_name=$GITHUB_REF_NAME"
            echo "github_sha=$GITHUB_SHA"
            echo "checked_out_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          } | tee "$ART/runner-checkout-identity.txt"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_REF_NAME" = "ax101-r5-integration-validation"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test -s "$GITHUB_WORKSPACE/r5-integration-transfer/SOURCE-IDENTITY.txt"
          grep -Fx "local_candidate_sha256=$EXPECTED_CANDIDATE_SHA" "$GITHUB_WORKSPACE/r5-integration-transfer/SOURCE-IDENTITY.txt"
          grep -Fx "solnix_commit=$PIN" "$GITHUB_WORKSPACE/r5-integration-transfer/SOURCE-IDENTITY.txt"
          grep -Fx "illumos_gate_commit=$ILLUMOS_PIN" "$GITHUB_WORKSPACE/r5-integration-transfer/SOURCE-IDENTITY.txt"
          grep -Fx "firmware_api=77" "$GITHUB_WORKSPACE/r5-integration-transfer/SOURCE-IDENTITY.txt"
          grep -Fx "pci_vendor_device=8086:54F0" "$GITHUB_WORKSPACE/r5-integration-transfer/SOURCE-IDENTITY.txt"
          grep -Fx "pci_subsystem=8086:0244" "$GITHUB_WORKSPACE/r5-integration-transfer/SOURCE-IDENTITY.txt"

          cat "$GITHUB_WORKSPACE"/r5-integration-transfer/parts/part-*.b64 | base64 --decode > "$BUNDLE"
          printf '%s  %s\n' "$EXPECTED_BUNDLE_SHA" "$BUNDLE" | sha256sum -c -
          unzip -tq "$BUNDLE"
          rm -rf "$INPUTS"
          mkdir -p "$INPUTS"
          unzip -q "$BUNDLE" -d "$INPUTS"

          python3 - "$INPUTS" <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, stat, sys
          root = Path(sys.argv[1])
          manifest = root / "R5-TRANSFER-MANIFEST.tsv"
          if not manifest.is_file():
              raise SystemExit("missing R5-TRANSFER-MANIFEST.tsv")
          rows = manifest.read_text().splitlines()
          if not rows or rows[0] != "type\tmode\tsize\tsha256_or_target\tpath":
              raise SystemExit("transfer manifest header mismatch")
          expected = set()
          failures = []
          for line_no, line in enumerate(rows[1:], 2):
              fields = line.split("\t", 4)
              if len(fields) != 5:
                  failures.append(f"manifest line {line_no}: malformed")
                  continue
              kind, mode, size, digest, rel = fields
              pp = PurePosixPath(rel)
              if pp.is_absolute() or ".." in pp.parts or rel in expected:
                  failures.append(f"manifest line {line_no}: unsafe/duplicate path {rel}")
                  continue
              expected.add(rel)
              p = root.joinpath(*pp.parts)
              if not (p.exists() or p.is_symlink()):
                  failures.append(f"missing: {rel}")
                  continue
              st = p.lstat()
              if kind != "link":
                  actual_mode = f"{stat.S_IMODE(st.st_mode):04o}"
                  if actual_mode != mode:
                      # Info-ZIP strips setgid on directory extraction; restore the
                      # manifest's exact mode before verifying it.
                      if kind == "dir" and p.is_dir():
                          os.chmod(p, int(mode, 8))
                          st = p.lstat()
                          actual_mode = f"{stat.S_IMODE(st.st_mode):04o}"
                      if actual_mode != mode:
                          failures.append(f"mode: {rel}: expected {mode}, got {actual_mode}")
              if kind == "dir":
                  if not stat.S_ISDIR(st.st_mode): failures.append(f"not directory: {rel}")
              elif kind == "link":
                  if not p.is_symlink() or os.readlink(p) != digest:
                      failures.append(f"symlink mismatch: {rel}")
              elif kind == "file":
                  if not stat.S_ISREG(st.st_mode):
                      failures.append(f"not regular file: {rel}")
                  else:
                      b = p.read_bytes()
                      if len(b) != int(size) or hashlib.sha256(b).hexdigest() != digest:
                          failures.append(f"content mismatch: {rel}")
              else:
                  failures.append(f"unknown type {kind}: {rel}")
          actual = {p.relative_to(root).as_posix() for p in root.rglob("*") if p != manifest}
          missing = expected - actual
          extra = actual - expected
          failures.extend(f"missing path: {p}" for p in sorted(missing))
          failures.extend(f"extra path: {p}" for p in sorted(extra))
          print(f"TRANSFER_MANIFEST_ENTRIES={len(expected)}")
          print(f"TRANSFER_ACTUAL_ENTRIES={len(actual)}")
          print(f"TRANSFER_MISSING={len(missing)}")
          print(f"TRANSFER_EXTRA={len(extra)}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("TRANSFER_MANIFEST=PASS")
          PY

          # CI-only tool portability overlay: the R5 fixture must use POSIX nm -P
          # on OpenIndiana instead of GNU-only --defined-only. The immutable
          # transfer bundle is fully verified above before this separate overlay.
          OVERLAY="$GITHUB_WORKSPACE/r5-integration-transfer/ci-overlays/0001-nm-posix-portability.patch"
          ORIGINAL_HELPER="$INPUTS/wifi-ax101/tests/compile-n80211-taskq-wait.py"
          EXPECTED_OVERLAY_SHA="6e0d638baa1531e87b5813c084e06d4d08ba27802420d869e8acd38112f2fb9c"
          EXPECTED_HELPER_SHA="51176a485cb9b09efe4ca98c4eb3a14476b4e926fd6dc730e199a77b6bcd05a9"
          EXPECTED_ORIGINAL_HELPER_SHA="5c20e790ef2d4f0a03862bd8f357d90395e8f79751ba4377980ba6788fae5b97"
          test -s "$OVERLAY"
          printf '%s  %s\n' "$EXPECTED_OVERLAY_SHA" "$OVERLAY" | sha256sum -c -
          test "$(sha256sum "$ORIGINAL_HELPER" | awk '{print $1}')" = "$EXPECTED_ORIGINAL_HELPER_SHA"
          patch --batch --dry-run --fuzz=0 -d "$INPUTS" -p1 < "$OVERLAY"
          patch --batch --forward --fuzz=0 -d "$INPUTS" -p1 < "$OVERLAY"
          test "$(sha256sum "$ORIGINAL_HELPER" | awk '{print $1}')" = "$EXPECTED_HELPER_SHA"
          {
            echo "CI_ONLY_TEST_HARNESS_OVERLAY=0001-nm-posix-portability.patch"
            echo "CI_OVERLAY_SHA256=$EXPECTED_OVERLAY_SHA"
            echo "ORIGINAL_HARNESS_SHA256=$EXPECTED_ORIGINAL_HELPER_SHA"
            echo "PATCHED_HARNESS_SHA256=$EXPECTED_HELPER_SHA"
            echo "CI_TEST_HARNESS_OVERLAY=PASS"
          } | tee "$ART/ci-portability-overlay.txt"

          # Keep R5 base replay checks, but defer full-candidate equivalence until
          # additive 0027 is applied by the integration wrapper.
          ORDER_PATCH="$GITHUB_WORKSPACE/r5-integration-transfer/ci-overlays/0002-defer-final-tree-check-until-after-0027.patch"
          EXPECTED_ORDER_PATCH_SHA="c93a9a5e9002005fe0e55e1ab2a3e030dca01ebacf5abb1d802e77b9530fcca8"
          BASE_REPLAY_SCRIPT="$INPUTS/wifi-ax101/apply-run80-stack.sh"
          INTEGRATION_REPLAY_SCRIPT="$INPUTS/wifi-ax101/apply-run80-r5-integration-stack.sh"
          EXPECTED_BASE_BEFORE="0a7f1575802c48e5b302edc0655efba4e059b5e8044660a01217e22d7830872f"
          EXPECTED_INTEGRATION_BEFORE="d1c7d6d205b4c2268c1a987822d97c6ea1562d76d15f0972b10c83e907679dbd"
          EXPECTED_BASE_AFTER="e5c494cba7a6108c676f67f6eb6cba8ee3eb193dc6b15454985771f201288266"
          EXPECTED_INTEGRATION_AFTER="d53e37168f7a44c3ec2e5d63d45f985458be9615fecfdff57ec91384feff97f9"
          test -s "$ORDER_PATCH"
          printf '%s  %s\n' "$EXPECTED_ORDER_PATCH_SHA" "$ORDER_PATCH" | sha256sum -c -
          test "$(sha256sum "$BASE_REPLAY_SCRIPT" | awk '{print $1}')" = "$EXPECTED_BASE_BEFORE"
          test "$(sha256sum "$INTEGRATION_REPLAY_SCRIPT" | awk '{print $1}')" = "$EXPECTED_INTEGRATION_BEFORE"
          patch --batch --dry-run --fuzz=0 -d "$INPUTS" -p1 < "$ORDER_PATCH"
          patch --batch --forward --fuzz=0 -d "$INPUTS" -p1 < "$ORDER_PATCH"
          test "$(sha256sum "$BASE_REPLAY_SCRIPT" | awk '{print $1}')" = "$EXPECTED_BASE_AFTER"
          test "$(sha256sum "$INTEGRATION_REPLAY_SCRIPT" | awk '{print $1}')" = "$EXPECTED_INTEGRATION_AFTER"
          {
            echo "CI_ONLY_REPLAY_ORDER_OVERLAY=0002-defer-final-tree-check-until-after-0027.patch"
            echo "CI_REPLAY_ORDER_PATCH_SHA256=$EXPECTED_ORDER_PATCH_SHA"
            echo "BASE_REPLAY_SCRIPT_SHA256=$EXPECTED_BASE_AFTER"
            echo "INTEGRATION_REPLAY_SCRIPT_SHA256=$EXPECTED_INTEGRATION_AFTER"
            echo "CI_REPLAY_ORDER_OVERLAY=PASS"
          } | tee "$ART/ci-replay-order-overlay.txt"

          # OpenIndiana Hipster's supported python3 is 3.9. Preserve postponed
          # annotation evaluation in the RUN77 host model; this is test-only.
          PY39_PATCH="$GITHUB_WORKSPACE/r5-integration-transfer/ci-overlays/0003-run77-model-python39-annotations.patch"
          RUN77_MODEL="$INPUTS/wifi-ax101/tests/run77-contract-model.py"
          EXPECTED_PY39_PATCH_SHA="f2146e7f09d4e40232593fef827c7baad4057e1f550bd028f10036b00940e6e6"
          EXPECTED_RUN77_BEFORE="1bc1ea95393f6969c2f03a7dd8b0be69fa235e9173970506aacec5dc76d95791"
          EXPECTED_RUN77_AFTER="c7d68a2bbf612b84b4f16cfaa4f45d05d9faf894e28f12ee495a0b71efe7a94b"
          test -s "$PY39_PATCH"
          printf '%s  %s\n' "$EXPECTED_PY39_PATCH_SHA" "$PY39_PATCH" | sha256sum -c -
          test "$(sha256sum "$RUN77_MODEL" | awk '{print $1}')" = "$EXPECTED_RUN77_BEFORE"
          patch --batch --dry-run --fuzz=0 -d "$INPUTS" -p1 < "$PY39_PATCH"
          patch --batch --forward --fuzz=0 -d "$INPUTS" -p1 < "$PY39_PATCH"
          test "$(sha256sum "$RUN77_MODEL" | awk '{print $1}')" = "$EXPECTED_RUN77_AFTER"
          python3 - "$RUN77_MODEL" <<'PY'
          import ast, sys
          from pathlib import Path
          model = Path(sys.argv[1])
          source = model.read_text()
          tree = ast.parse(source, filename=str(model))
          has_future = any(
              isinstance(node, ast.ImportFrom)
              and node.module == "__future__"
              and any(alias.name == "annotations" for alias in node.names)
              for node in tree.body
          )
          has_union_annotation = any(
              isinstance(node, ast.BinOp) and isinstance(node.op, ast.BitOr)
              for node in ast.walk(tree)
          )
          if not has_future or not has_union_annotation:
              raise SystemExit("RUN77 Python 3.9 annotation compatibility gate failed")
          print("RUN77_MODEL_FUTURE_ANNOTATIONS=PASS")
          print("RUN77_MODEL_PEP604_ANNOTATION_PRESENT=PASS")
          if sys.version_info < (3, 10):
              mutant = source.replace("from __future__ import annotations" + chr(10), "", 1)
              try:
                  exec(compile(mutant, str(model) + ".mutant", "exec"),
                       {"__name__": "__run77_python39_mutant__"})
              except TypeError:
                  print("RUN77_PY39_NEGATIVE_CONTROL=CAUGHT")
              else:
                  raise SystemExit("RUN77 Python 3.9 negative control was not caught")
          PY
          {
            echo "CI_ONLY_PYTHON39_OVERLAY=0003-run77-model-python39-annotations.patch"
            echo "CI_PYTHON39_PATCH_SHA256=$EXPECTED_PY39_PATCH_SHA"
            echo "RUN77_MODEL_SHA256=$EXPECTED_RUN77_AFTER"
            echo "CI_RUN77_PYTHON39_COMPAT=PASS"
          } | tee "$ART/ci-python39-compatibility.txt"

          # The pinned source snapshot is checked out through Git. Git trees do
          # not store directory mode bits, and the checkout has root .git admin
          # metadata; restore candidate directory modes and exclude only root .git.
          TREE_PATCH="$GITHUB_WORKSPACE/r5-integration-transfer/ci-overlays/0004-exact-tree-ignore-git-and-restore-dir-modes.patch"
          TREE_CHECKER="$INPUTS/wifi-ax101/tests/verify-integration-tree.py"
          EXPECTED_TREE_PATCH_BLOB="bcd42907ef0d67b9440b2b8b4be6cf0c7b683d6c"
          if [ ! -s "$TREE_PATCH" ]; then
            echo "ERROR: exact-tree overlay missing: $TREE_PATCH"
            find "$GITHUB_WORKSPACE/r5-integration-transfer/ci-overlays" -maxdepth 1 -type f -print
            exit 1
          fi
          ACTUAL_TREE_PATCH_BLOB=$(git -C "$GITHUB_WORKSPACE" ls-tree "$GITHUB_SHA" -- r5-integration-transfer/ci-overlays/0004-exact-tree-ignore-git-and-restore-dir-modes.patch | awk '{print $3}')
          echo "TREE_PATCH_PATH=$TREE_PATCH"
          echo "TREE_PATCH_EXPECTED_GIT_BLOB=$EXPECTED_TREE_PATCH_BLOB"
          echo "TREE_PATCH_ACTUAL_GIT_BLOB=$ACTUAL_TREE_PATCH_BLOB"
          ls -l "$TREE_PATCH"
          sha256sum "$TREE_PATCH" | tee "$ART/exact-tree-overlay.sha256"
          test "$ACTUAL_TREE_PATCH_BLOB" = "$EXPECTED_TREE_PATCH_BLOB"
          patch --batch --dry-run --fuzz=0 -d "$INPUTS" -p1 < "$TREE_PATCH"
          patch --batch --forward --fuzz=0 -d "$INPUTS" -p1 < "$TREE_PATCH"
          sha256sum "$TREE_PATCH" "$TREE_CHECKER" > "$ART/exact-tree-overlay-files.sha256"
          python3 "$GITHUB_WORKSPACE/wifi-ax101/ci/test_verify_integration_tree.py" "$TREE_CHECKER" | tee "$ART/exact-tree-checker-tests-runner.log"
          {
            echo "CI_ONLY_EXACT_TREE_OVERLAY=0004-exact-tree-ignore-git-and-restore-dir-modes.patch"
            echo "CI_EXACT_TREE_PATCH_GIT_BLOB=$EXPECTED_TREE_PATCH_BLOB"
            cat "$ART/exact-tree-overlay-files.sha256"
            echo "CI_EXACT_TREE_CHECKER=PASS"
          } | tee "$ART/ci-exact-tree-checker.txt"

          # The runner bundle preserves CRLF for these vendored illumos headers.
          # Validate their canonical LF-normalized Git blobs against the pinned illumos-gate tree.
          python3 - "$INPUTS" <<'PY'
          import hashlib, sys
          from pathlib import Path
          root = Path(sys.argv[1]) / "wifi-ax101/compat"
          expected = {
              "sys/net80211_proto.h": "4fe7d40604615e3ffd1adb80d6e061fd4859c546",
              "sys/net80211.h": "be6b65fe905fabd6ebfd31cf74d7048357510e12",
              "sys/net80211_crypto.h": "72ef3ebec3c9ccc599ba29823d3561198d953252",
              "sys/net80211_ht.h": "449726aa0feae79d6bcea0f73e0625a7078a150e",
              "sys/net80211_amrr.h": "36bd2fcd0eacd88c7b2c307c32a4db32bff5ffa0",
              "net/wpa.h": "82c4fd468a5f623411a98a814c40ba3d9ac4c87b",
          }
          for rel, want in expected.items():
              data = (root / rel).read_bytes().replace(bytes([13, 10]), bytes([10]))
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\\0" + data).hexdigest()
              if blob != want:
                  raise SystemExit(f"pinned illumos header mismatch: {rel}: {blob} != {want}")
              print(f"PINNED_HEADER_LF_BLOB=PASS {rel} {blob}")
          print("PINNED_ILLUMOS_HEADER_NORMALIZATION=PASS 6/6")
          PY

          CANDIDATE_MANIFEST="$INPUTS/INTEGRATION-CANDIDATE-MANIFEST.tsv"
          test -s "$CANDIDATE_MANIFEST"
          test "$(wc -l < "$CANDIDATE_MANIFEST" | tr -d ' ')" = "4503"
          awk -F '\t' '$1 == "file" && $5 == "wifi-ax101/patches/0027-run80-r5-active-iwx-integration.patch" && $3 == 520715 { found=1 } END { exit !found }' "$CANDIDATE_MANIFEST"
          test -s "$INPUTS/wifi-ax101/patches/0027-run80-r5-active-iwx-integration.patch"
          test -s "$INPUTS/wifi-ax101/patches/0027-FILE-MODES.tsv"
          test -s "$INPUTS/wifi-ax101/apply-run80-r5-integration-stack.sh"
          test -s "$INPUTS/wifi-ax101/INTEGRATION-EXPECTED-TREE.tsv"
          test -s "$INPUTS/solnix-$PIN/src/ports/wifi/iwx/tests/verify-active-iwx-integration.py"
          test -s "$INPUTS/solnix-$PIN/src/ports/wifi/iwx/tests/test-iwx-gldv3-backpressure.py"
          test -s "$INPUTS/solnix-$PIN/src/ports/wifi/iwx/iwx_glue.c"
          grep -Fq 'mac_tx_update' "$INPUTS/wifi-ax101/patches/0027-run80-r5-active-iwx-integration.patch"
          grep -Fq 'BUS_DMASYNC_POSTREAD' "$INPUTS/wifi-ax101/patches/0024-run80-r5-ownership-closure.patch"
          grep -Fq 'BUS_DMASYNC_PREREAD' "$INPUTS/wifi-ax101/patches/0024-run80-r5-ownership-closure.patch"

          # The one reused pinned source archive is checked byte-for-byte against
          # the archive embedded in the local candidate (same Git blob + SHA-256).
          PIN_ARCHIVE="$GITHUB_WORKSPACE/wifi-ax101/solnix-$PIN.zip"
          test -s "$PIN_ARCHIVE"
          printf '%s  %s\n' "$EXPECTED_SOLNIX_SHA" "$PIN_ARCHIVE" | sha256sum -c -
          test "$(git -C "$GITHUB_WORKSPACE" hash-object "$PIN_ARCHIVE")" = "$EXPECTED_SOLNIX_BLOB"
          {
            echo "local_candidate_archive_sha256=$EXPECTED_CANDIDATE_SHA"
            echo "runner_transfer_bundle_sha256=$EXPECTED_BUNDLE_SHA"
            echo "candidate_manifest_entries=4502"
            echo "transfer_manifest_entries=540"
            echo "solnix_commit=$PIN"
            echo "solnix_archive_sha256=$EXPECTED_SOLNIX_SHA"
            echo "solnix_archive_git_blob=$EXPECTED_SOLNIX_BLOB"
            echo "illumos_gate_commit=$ILLUMOS_PIN"
            echo "patch=0027-run80-r5-active-iwx-integration.patch"
            echo "PREBUILD_TRANSFER_VALIDATION=PASS"
          } | tee "$ART/source-transfer-validation.txt"
          echo "candidate_inputs=$INPUTS" | tee -a "$ART/source-transfer-validation.txt"

      - name: Test CI diagnostics and exact replay checker harness
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n wifi-ax101/ci/native-diagnostics.sh
          python3 wifi-ax101/ci/test_native_diagnostics.py
          python3 wifi-ax101/ci/test_verify_integration_tree.py "$GITHUB_WORKSPACE/r5-runner-inputs/wifi-ax101/tests/verify-integration-tree.py"

      - name: Build exact R5 Integration tree in OpenIndiana Hipster 2026.10
        id: native-build
        uses: vmactions/openindiana-vm@v1
        with:
          release: "202610-build"
          arch: x86_64
          mem: 8192
          cpu: 4
          sync: nfs
          run: |
            /usr/bin/bash -s <<'AX101_BUILD'
            set -Eeuo pipefail
            ART="$GITHUB_WORKSPACE/wifi-ax101-artifacts"
            INPUTS="$GITHUB_WORKSPACE/r5-runner-inputs"
            SRC=/tmp/solnix-wifi
            PIN=1cee7021091f3df92b7816ece2902ff59b37f1be
            ILLUMOS_PIN=098e95820891f8a83fae679daece7fcf58b7b3a4
            mkdir -p "$ART"
            . "$GITHUB_WORKSPACE/wifi-ax101/ci/native-diagnostics.sh"
            ax101_diag_init "$ART"
            finish() {
              local finish_rc=$?
              trap - EXIT ERR
              set +e
              if [ -s "$ART/iwx" ]; then
                digest -a sha256 "$ART/iwx" > "$ART/iwx.sha256"
                file "$ART/iwx" > "$ART/iwx.file.txt"
                elfdump -e "$ART/iwx" > "$ART/iwx.elf-header.txt" 2>&1 || true
                elfdump -d "$ART/iwx" > "$ART/iwx.dynamic.txt" 2>&1 || true
                elfdump -r "$ART/iwx" > "$ART/iwx.relocations.txt" 2>&1 || true
                nm -p "$ART/iwx" > "$ART/iwx.symbols.txt" 2>&1 || true
              fi
              ax101_diag_finish "$finish_rc"
              exit "$finish_rc"
            }
            trap finish EXIT
            ax101_diag_stage VM_ENVIRONMENT_INITIALIZATION

            echo "GITHUB_REF=$GITHUB_REF"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "RUNNER_INPUT_ROOT=$INPUTS"
            test -s "$INPUTS/R5-TRANSFER-MANIFEST.tsv"
            test -s "$INPUTS/wifi-ax101/patches/0027-run80-r5-active-iwx-integration.patch"
            test -s "$INPUTS/wifi-ax101/INTEGRATION-EXPECTED-TREE.tsv"
            uname -a
            cat /etc/release
            test "$(uname -s)" = SunOS
            grep -q OpenIndiana /etc/release

            pkg refresh
            for fmri in developer/gcc-14 developer/build/gnu-make developer/versioning/git; do
              if ! pkg list -H "$fmri" >/dev/null 2>&1; then pkg install --accept "$fmri"; fi
              pkg list -H "$fmri"
            done
            export PATH="/usr/gcc/14/bin:/usr/bin:/usr/sbin"
            export CC=/usr/gcc/14/bin/gcc
            export LD=/usr/bin/ld
            "$CC" --version | head -1
            gmake --version | head -1
            test -d /usr/include/sys
            {
              echo "uname=$(uname -a)"
              echo "release=$(head -1 /etc/release)"
              echo "pwd=$PWD"
              echo "umask=$(umask)"
              echo "PATH=$PATH"
              echo "CC=$CC"
              echo "LD=$LD"
              echo "MAKE=$(gmake --version | head -1)"
              echo "GCC=$("$CC" --version | head -1)"
            } > "$ART/runner-environment.txt"
            ax101_diag_pass VM_ENVIRONMENT_INITIALIZATION
            ax101_diag_stage PINNED_UPSTREAM_CHECKOUT

            # Never consume a Solnix checkout or generated tree from the repository branch.
            # Recreate the exact pinned upstream in a fresh directory, then apply R5+0027.
            rm -rf "$SRC"
            git clone --no-checkout https://github.com/atiq-cs/solnix.git "$SRC"
            git -C "$SRC" checkout --detach "$PIN"
            test "$(git -C "$SRC" rev-parse HEAD)" = "$PIN"
            test "$(git -C "$SRC" status --porcelain | wc -l | tr -d ' ')" = "0"
            ax101_diag_pass PINNED_UPSTREAM_CHECKOUT
            ax101_diag_stage PATCH_STACK_APPLICATION
            ln -sfn "$GITHUB_WORKSPACE/wifi-ax101/solnix-$PIN.zip" "$INPUTS/wifi-ax101/solnix-$PIN.zip"
            test -s "$INPUTS/wifi-ax101/solnix-$PIN.zip"
            printf 'solnix_revision=%s\nillumos_gate_revision=%s\n' "$PIN" "$ILLUMOS_PIN" > "$ART/source-revision.txt"
            echo "local_candidate_archive_sha256=f251541a7c60cc46cdaecc0719e42c576f6f5bd4699dea712a7db5ab9f54a1d0" >> "$ART/source-revision.txt"
            echo "runner_transfer_bundle_sha256=a716503cc1a4fcf42004f459584492144739ea7aa12563e6fa1af5d2bc4dab0a" >> "$ART/source-revision.txt"
            echo "checked_out_solnix_head=$(git -C "$SRC" rev-parse HEAD)" >> "$ART/source-revision.txt"

            set +e
            ax101_diag_command integration-replay bash "$INPUTS/wifi-ax101/apply-run80-r5-integration-stack.sh" "$SRC" "$ART/r5-integration-replay" 2>&1 | tee "$ART/r5-integration-replay.log"
            replay_rc=${PIPESTATUS[0]}
            set -e
            echo "integration_replay_exit=$replay_rc" > "$ART/integration-replay-status.txt"
            test "$replay_rc" -eq 0
            test -s "$ART/r5-integration-replay/final-result.txt"
            grep -Fq 'RUN80_R5_INTEGRATION_REPLAY=PASS' "$ART/r5-integration-replay/final-result.txt"
            echo "CI_SOURCE_IDENTITY_VERIFIED=PASS"
            echo "PRODUCTION_SOURCE_ROOT=$SRC/src/ports/wifi/iwx"
            echo "PRODUCTION_SOURCE_ROOT=$SRC/src/ports/wifi/iwx" > "$ART/production-source-root.txt"
            ax101_diag_pass PATCH_STACK_APPLICATION
            ax101_diag_pass INTEGRATION_REPLAY_VALIDATION
            ax101_diag_pass SOURCE_STATIC_TESTS
            ax101_diag_pass HOST_MODEL_TESTS
            ax101_diag_stage NATIVE_BUILD_PREPARATION

            # Exact pinned illumos-gate compatibility headers; use native OI headers first.
            : > "$ART/net80211-header-closure.txt"
            for rel in sys/net80211_proto.h sys/net80211.h sys/net80211_crypto.h sys/net80211_ht.h sys/net80211_amrr.h net/wpa.h; do
              case "$rel" in
                sys/net80211_proto.h) expected_blob=4fe7d40604615e3ffd1adb80d6e061fd4859c546 ;;
                sys/net80211.h) expected_blob=be6b65fe905fabd6ebfd31cf74d7048357510e12 ;;
                sys/net80211_crypto.h) expected_blob=72ef3ebec3c9ccc599ba29823d3561198d953252 ;;
                sys/net80211_ht.h) expected_blob=449726aa0feae79d6bcea0f73e0625a7078a150e ;;
                sys/net80211_amrr.h) expected_blob=36bd2fcd0eacd88c7b2c307c32a4db32bff5ffa0 ;;
                net/wpa.h) expected_blob=82c4fd468a5f623411a98a814c40ba3d9ac4c87b ;;
                *) echo "ERROR: unlisted header $rel" >&2; exit 1 ;;
              esac
              src="$INPUTS/wifi-ax101/compat/$rel"
              test -s "$src"
              raw_blob=$(git -C "$GITHUB_WORKSPACE" hash-object "$src")
              actual_blob=$(tr -d '\\r' < "$src" | git -C "$GITHUB_WORKSPACE" hash-object --stdin)
              printf '%s\\t%s\\t%s\\n' "$rel" "$raw_blob" "$actual_blob" >> "$ART/compat-header-blob-normalization.txt"
              test "$actual_blob" = "$expected_blob"
              native="/usr/include/$rel"
              dst="$SRC/src/ports/wifi/iwm/compat-illumos/$rel"
              safe=$(printf '%s' "$rel" | tr '/' '-')
              if [ -s "$native" ]; then
                echo "NATIVE_HEADER_USED=$rel"
                digest -a sha256 "$native" > "$ART/native-header-$safe.sha256"
                printf '%s\t%s\tnative\n' "$rel" "$actual_blob" >> "$ART/net80211-header-closure.txt"
              else
                mkdir -p "$(dirname "$dst")"
                tr -d '\\r' < "$src" > "$dst"
                chmod 0644 "$dst"
                tr -d '\\r' < "$src" | cmp -s - "$dst"
                digest -a sha256 "$dst" > "$ART/header-$safe.sha256"
                printf '%s\t%s\tstaged-pinned-illumos-gate\n' "$rel" "$actual_blob" >> "$ART/net80211-header-closure.txt"
              fi
            done
            for rel in sys/mac.h sys/mac_provider.h sys/ethernet.h sys/atomic.h inet/wifi_ioctl.h; do
              test -s "/usr/include/$rel" || { echo "ERROR: missing native OpenIndiana header /usr/include/$rel" >&2; exit 1; }
              printf '%s\tnative-dependency\n' "$rel" >> "$ART/net80211-header-closure.txt"
            done
            DLS_SRC="$INPUTS/wifi-ax101/compat/sys/dls.h"
            DLS_DST="$SRC/src/ports/wifi/iwm/compat-illumos/sys/dls.h"
            test -s "$DLS_SRC"
            mkdir -p "$(dirname "$DLS_DST")"
            cp "$DLS_SRC" "$DLS_DST"
            chmod 0644 "$DLS_DST"
            cmp -s "$DLS_SRC" "$DLS_DST"
            digest -a sha256 "$DLS_DST" > "$ART/dls-shim.sha256"

            python3 "$INPUTS/wifi-ax101/tests/test-connect-wifi.py" 2>&1 | tee "$ART/connect-wifi-tests.txt"
            python3 --version | tee "$ART/target-python-version.txt"
            echo "RUN77_MODEL_PYTHON39_COMPAT=PRECHECKED_BY_TRANSFER_STEP"
            echo "NATIVE_SOURCE_ROOT_CONFIRMED=$SRC/src/ports/wifi/iwx"
            cd "$SRC/src/ports/wifi/iwx"
            ax101_diag_command gmake-clean gmake -f Makefile.illumos clean
            ax101_diag_pass NATIVE_BUILD_PREPARATION
            ax101_diag_stage EXACT_NATIVE_GMAKE
            ax101_diag_stage NATIVE_COMPILATION
            set +e
            ax101_diag_command native-gmake gmake -k -f Makefile.illumos -j4 UTSINC=/usr/include LD=/usr/bin/ld 2>&1 | tee "$ART/compiler-output.log"
            compile_rc=${PIPESTATUS[0]}
            set -e
            echo "gmake_exit=$compile_rc" | tee "$ART/native-compile-exit.txt"
            if [ "$compile_rc" -ne 0 ]; then
              grep -E '(^|: )(fatal error:|error:)|undefined reference|multiple definition' "$ART/compiler-output.log" > "$ART/compiler-errors.txt" || true
              grep -E 'warning:' "$ART/compiler-output.log" > "$ART/compiler-warnings.txt" || true
              exit "$compile_rc"
            fi
            ax101_diag_pass EXACT_NATIVE_GMAKE
            ax101_diag_pass NATIVE_COMPILATION
            ax101_diag_stage NATIVE_LINKING
            grep -Fq 'warning: taking address of packed member' "$ART/compiler-output.log" && { echo "ERROR: packed member warning" >&2; exit 1; } || true
            grep -Fq 'warning: "m_free" redefined' "$ART/compiler-output.log" && { echo "ERROR: m_free macro warning" >&2; exit 1; } || true
            grep -Eq 'warning: "SIOC[GS]80211[^"]*" redefined' "$ART/compiler-output.log" && { echo "ERROR: ioctl macro warning" >&2; exit 1; } || true
            grep -Eq 'warning: "(ETHERMTU|ETHERTYPE_IP|ETHERTYPE_ARP|ETHERTYPE_IPV6|roundup)" redefined' "$ART/compiler-output.log" && { echo "ERROR: native Ethernet/roundup macro warning" >&2; exit 1; } || true
            test -s iwx
            cp iwx "$ART/iwx"
            ax101_diag_pass NATIVE_LINKING
            ax101_diag_stage ELF_MODULE_INSPECTION

            python3 "$INPUTS/wifi-ax101/tests/test-check-elf-exports.py"
            nm -u "$ART/iwx" > "$ART/iwx.undefined.txt"
            KERNEL_IMAGE=
            for candidate in /platform/i86pc/kernel/amd64/unix /kernel/amd64/unix /kernel/unix; do
              if [ -s "$candidate" ]; then KERNEL_IMAGE="$candidate"; break; fi
            done
            test -n "$KERNEL_IMAGE"
            echo "TARGET_KERNEL_IMAGE=$KERNEL_IMAGE" > "$ART/target-kernel-image.txt"
            nm -g -p "$KERNEL_IMAGE" > "$ART/kernel-unix-symbols.txt"
            MAC_MODULE=
            for candidate in /kernel/misc/mac /kernel/misc/amd64/mac /usr/kernel/misc/mac /usr/kernel/misc/amd64/mac /platform/i86pc/kernel/misc/amd64/mac; do
              if [ -s "$candidate" ]; then MAC_MODULE="$candidate"; break; fi
            done
            test -n "$MAC_MODULE"
            echo "TARGET_MAC_MODULE=$MAC_MODULE" > "$ART/target-mac-module.txt"
            nm -g -p "$MAC_MODULE" > "$ART/mac-module-symbols.txt"
            python3 "$INPUTS/wifi-ax101/tests/check-elf-exports.py" "$ART/iwx.undefined.txt" "$ART/kernel-unix-symbols.txt" "$ART/mac-module-symbols.txt" | tee "$ART/elf-symbol-reconciliation.txt"
            elfdump -d "$ART/iwx" > "$ART/iwx.dynamic-acceptance.txt"
            elfdump -r "$ART/iwx" > "$ART/iwx.relocations.txt"
            grep -Eq 'NEEDED.*misc/mac' "$ART/iwx.dynamic-acceptance.txt"
            echo "ELF_NEEDED_MISC_MAC=PASS"
            if grep -q 'TEXTREL' "$ART/iwx.dynamic-acceptance.txt"; then echo "ELF_TEXTREL_PRESENT=YES" | tee "$ART/elf-relocation-policy.txt"; else echo "ELF_TEXTREL_PRESENT=NO" | tee "$ART/elf-relocation-policy.txt"; fi

            if command -v modinfo >/dev/null 2>&1; then modinfo -c > "$ART/modinfo-before-modload.txt" 2>&1 || true; fi
            if command -v dmesg >/dev/null 2>&1; then dmesg > "$ART/dmesg-before-modload.txt" 2>&1 || true; fi
            mkdir -p /kernel/drv/amd64
            cp "$ART/iwx" /kernel/drv/amd64/iwx
            chmod 0644 /kernel/drv/amd64/iwx
            if grep -Eq '^iwx[[:space:]]' /etc/name_to_major; then echo "ERROR: unexpected pre-existing iwx major" >&2; exit 1; fi
            add_drv -v -i '\"pci8086,54f0\"' iwx > "$ART/add-drv.txt" 2>&1
            cat "$ART/add-drv.txt"
            grep -Eq '^iwx[[:space:]]+[0-9]+' /etc/name_to_major
            grep -E '^iwx[[:space:]]' /etc/name_to_major > "$ART/iwx-name-to-major.txt"
            grep -E '^iwx[[:space:]]' /etc/driver_aliases > "$ART/iwx-driver-aliases.txt" || true
            echo "IWX_DRIVER_REGISTRATION=PASS"
            set +e
            modload /kernel/drv/amd64/iwx > "$ART/iwx-krtld-modload.txt" 2>&1
            modload_rc=$?
            set -e
            echo "modload_exit=$modload_rc" > "$ART/iwx-krtld-modload-status.txt"
            if [ "$modload_rc" -ne 0 ]; then cat "$ART/iwx-krtld-modload.txt"; dmesg > "$ART/dmesg-after-modload.txt" 2>&1 || true; tail -n 250 "$ART/dmesg-after-modload.txt" | grep -Ei 'iwx|krtld|modload|module|symbol|reloc|error|warn|pci' > "$ART/iwx-krtld-dmesg.txt" || true; exit "$modload_rc"; fi
            echo "KRTLD_NATIVE_MODLOAD=PASS"
            modinfo -c > "$ART/modinfo-after-modload.txt"
            iwx_modid=$(awk '$3 == "iwx" && $2 ~ /^[0-9]+$/ && $2 > 0 && $4 == "LOADED/INSTALLED" { print $1; exit }' "$ART/modinfo-after-modload.txt")
            case "$iwx_modid" in ''|*[!0-9]*) cat "$ART/modinfo-after-modload.txt"; exit 1;; esac
            echo "$iwx_modid" > "$ART/iwx-module-id.txt"
            dmesg > "$ART/dmesg-before-modunload.txt"
            set +e
            modunload -i "$iwx_modid" > "$ART/iwx-modunload.txt" 2>&1
            modunload_rc=$?
            set -e
            echo "modunload_exit=$modunload_rc" > "$ART/iwx-modunload-status.txt"
            if [ "$modunload_rc" -ne 0 ]; then cat "$ART/iwx-modunload.txt"; exit "$modunload_rc"; fi
            dmesg > "$ART/dmesg-after-modunload.txt"
            diff -u "$ART/dmesg-before-modunload.txt" "$ART/dmesg-after-modunload.txt" > "$ART/iwx-modunload-dmesg-delta.txt" || true
            if grep -Eiq '(iwx.*(error|fail|warn|unable|cannot)|(error|fail|warn|unable|cannot).*iwx)' "$ART/iwx-modunload-dmesg-delta.txt"; then cat "$ART/iwx-modunload-dmesg-delta.txt"; exit 1; fi
            modinfo -c > "$ART/modinfo-after-modunload.txt"
            awk '$3 == "iwx" && $4 == "UNLOADED/UNINSTALLED" { unloaded=1 } END { exit !unloaded }' "$ART/modinfo-after-modunload.txt"
            rem_drv iwx > "$ART/rem-drv.txt" 2>&1
            rm -f /kernel/drv/amd64/iwx
            echo "KRTLD_CONTROLLED_UNLOAD=PASS"
            ax101_diag_pass ELF_MODULE_INSPECTION
            ax101_diag_stage ARTIFACT_PACKAGING

            FWBASE="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain"
            curl -fL "$FWBASE/iwlwifi-so-a0-hr-b0-77.ucode?id=20241017" -o "$ART/iwx-so-a0-hr-b0-77"
            curl -fL "$FWBASE/LICENCE.iwlwifi_firmware?id=20241017" -o "$ART/iwx-license"
            test -s "$ART/iwx-so-a0-hr-b0-77"
            grep -qi redistribution "$ART/iwx-license"
            digest -a sha256 "$ART/iwx-so-a0-hr-b0-77" > "$ART/ax101-firmware.sha256"
            echo "NATIVE_OPENINDIANA_BUILD=PASS" > "$ART/STATUS.txt"
            echo "BUILD_OK: exact R5 integration source replayed; native module built, ELF checked, registered, loaded and unloaded; firmware API-77 image staged" >> "$ART/STATUS.txt"
            ax101_diag_pass ARTIFACT_PACKAGING
            AX101_BUILD

      - name: Capture remote VM and SSH outcome
        if: always()
        shell: bash
        env:
          VM_STEP_OUTCOME: ${{ steps.native-build.outcome }}
        run: |
          set +e
          ART="$GITHUB_WORKSPACE/wifi-ax101-artifacts"
          mkdir -p "$ART"
          {
            echo "vm_action_outcome=$VM_STEP_OUTCOME"
            if [ -s "$ART/native-build-status.txt" ]; then
              echo "remote_status_file=PRESENT"
              cat "$ART/native-build-status.txt"
            else
              echo "remote_status_file=MISSING"
              echo "remote_process_status=UNAVAILABLE (VM shell/SSH ended before EXIT trap persisted status)"
            fi
            if [ -s "$ART/native-openindiana-build.log" ]; then
              echo "remote_native_log=PRESENT"
              wc -c "$ART/native-openindiana-build.log"
              tail -n 120 "$ART/native-openindiana-build.log"
            else
              echo "remote_native_log=MISSING"
            fi
          } > "$ART/runner-ssh-status.txt"
          cat "$ART/runner-ssh-status.txt"

      - name: Upload exact-source build and identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax101-r5-integration-${{ github.run_id }}-${{ github.sha }}
          path: wifi-ax101-artifacts/
          if-no-files-found: warn
          retention-days: 30
