name: Build GopRotationHook

on:
  push:
    branches: [gop-rotation-hook]
    paths:
      - 'GopRotationHook/**'
      - '.github/workflows/build-gop-rotation-hook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gop-rotation-hook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout driver repository
        uses: actions/checkout@v4
        with:
          path: driver-repo
          persist-credentials: false

      - name: Checkout EDK2
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: edk2-stable202405
          submodules: false
          path: edk2
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm python3 python3-venv gcc g++ make

      - name: Prepare EDK2
        working-directory: edk2
        run: |
          python3 -m pip install --user -r pip-requirements.txt --break-system-packages
          git submodule update --init BaseTools/Source/C/BrotliCompress/brotli CryptoPkg/Library/OpensslLib/openssl
          make -C BaseTools
          . ./edksetup.sh

      - name: Build x64 UEFI driver
        shell: bash
        run: |
          set -euxo pipefail
          source edk2/edksetup.sh
          cp -R driver-repo/GopRotationHook edk2/GopRotationHook
          build -a X64 -t GCC5 -p OvmfPkg/OvmfPkgX64.dsc -m GopRotationHook/GopRotationHook.inf -b DEBUG

      - name: Verify EFI output
        run: |
          test -s edk2/Build/OvmfX64/DEBUG_GCC5/X64/GopRotationHook.efi
          file edk2/Build/OvmfX64/DEBUG_GCC5/X64/GopRotationHook.efi
          sha256sum edk2/Build/OvmfX64/DEBUG_GCC5/X64/GopRotationHook.efi

      - name: Upload GopRotationHook.efi
        uses: actions/upload-artifact@v4
        with:
          name: GopRotationHook-efi
          path: edk2/Build/OvmfX64/DEBUG_GCC5/X64/GopRotationHook.efi
          if-no-files-found: error
          retention-days: 30
