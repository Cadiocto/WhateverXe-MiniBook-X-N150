name: ROTFB read-only OpenIndiana VM device preflight

on:
  push:
    branches:
      - gop-rotation-hook
    paths:
      - ".github/workflows/rotfb-vm-device-preflight.yml"

permissions:
  contents: read
  actions: read

jobs:
  vm-device-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact preflight revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve immutable Run 8 production DDX artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rotfb-preflight-artifacts
          printf 'artifact_download=NOT_STARTED\n' > rotfb-preflight-artifacts/early-failure.txt
          test "$(git rev-parse HEAD^)" = "86223a0a37b0904c2007eb18301d35cdf9fce0cd"
          rm -f rotfb-preflight-artifacts/early-failure.txt
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14727900251/zip" \
            -o rotfb-preflight-artifacts/run8-artifact.zip
          echo "145ef2bfae75e67058503f7aab233fe962bd0d7858cf63a3ed33e876801b402f  rotfb-preflight-artifacts/run8-artifact.zip" \
            | sha256sum --check -
          unzip -Z1 rotfb-preflight-artifacts/run8-artifact.zip \
            > rotfb-preflight-artifacts/run8-artifact-members.txt
          entry="$(grep -E '(^|/)illumosfb_drv\.so$' rotfb-preflight-artifacts/run8-artifact-members.txt | head -n 1)"
          test -n "$entry"
          unzip -p rotfb-preflight-artifacts/run8-artifact.zip "$entry" \
            > rotfb-preflight-artifacts/illumosfb_drv.so
          echo "5fd87d2e2a0a75df464f7ebe65fb324474e07fe3ff49a75c63c9049be6b74fd4  rotfb-preflight-artifacts/illumosfb_drv.so" \
            | sha256sum --check -
          printf 'artifact_id=14727900251\n' > rotfb-preflight-artifacts/run8-binary-provenance.txt
          printf 'binary_sha256=5fd87d2e2a0a75df464f7ebe65fb324474e07fe3ff49a75c63c9049be6b74fd4\n' \
            >> rotfb-preflight-artifacts/run8-binary-provenance.txt

      - name: Execute read-only framebuffer and DTrace preflight in OpenIndiana 2026.10
        uses: vmactions/openindiana-vm@v1
        with:
          release: "202610-build"
          arch: x86_64
          mem: 8192
          cpu: 4
          sync: nfs
          run: |
            /usr/bin/bash -s <<'ROTFB_PREFLIGHT'
            set -u
            ART="$GITHUB_WORKSPACE/rotfb-preflight-artifacts"
            mkdir -p "$ART"
            exec > "$ART/vm-preflight.log" 2>&1
            printf 'started_utc=%s\n' "$(date -u +%FT%TZ)"
            uname -a
            cat /etc/release
            id -a
            isainfo -kv 2>&1 || true

            {
              echo "### /dev/fb0 link and resolved device"
              ls -ld /dev/fb0 2>&1 || true
              ls -lL /dev/fb0 2>&1 || true
              file /dev/fb0 2>&1 || true
              echo "### framebuffer-related device nodes"
              ls -l /dev/fb* 2>&1 || true
              echo "### device tree and bound drivers"
              prtconf -D 2>&1 || true
            } > "$ART/framebuffer-device-inventory.txt"

            DEVICE_KIND=UNKNOWN
            if [ -e /dev/fb0 ]; then
              if [ -c /dev/fb0 ]; then DEVICE_KIND=CHARACTER; else DEVICE_KIND=NOT_CHARACTER; fi
            else
              DEVICE_KIND=ABSENT
            fi
            echo "device_kind=$DEVICE_KIND" > "$ART/device-preflight-status.txt"

            # O_RDWR is tested by opening and immediately closing the descriptor.
            # No ioctl, mmap, write, KDSETMODE, or VT operation is performed on it.
            if [ -c /dev/fb0 ]; then
              ( exec 9<>/dev/fb0 ) > "$ART/open-rw.stdout" 2> "$ART/open-rw.stderr"
              rw_rc=$?
              echo "open_rw_exit_code=$rw_rc" >> "$ART/device-preflight-status.txt"
              echo "command=(exec 9<>/dev/fb0); no data written" >> "$ART/device-preflight-status.txt"
            else
              echo "open_rw_exit_code=NOT_RUN" >> "$ART/device-preflight-status.txt"
            fi

            CC=
            for candidate in /usr/gcc/14/bin/gcc /usr/bin/gcc /usr/bin/cc; do
              if [ -x "$candidate" ]; then CC="$candidate"; break; fi
            done
            echo "compiler=${CC:-UNAVAILABLE}" >> "$ART/device-preflight-status.txt"

            if [ -n "$CC" ]; then
              cat > "$ART/framebuffer_ioctl_preflight.c" <<'EOF'
            #include <sys/types.h>
            #include <sys/stat.h>
            #include <sys/mkdev.h>
            #include <sys/fbio.h>
            #include <sys/visual_io.h>
            #include <sys/ioctl.h>
            #include <fcntl.h>
            #include <stdint.h>
            #include <stdio.h>
            #include <string.h>
            #include <errno.h>
            #include <unistd.h>

            int
            main(void)
            {
                struct stat st;
                struct vis_identifier ident;
                struct fbgattr attr;
                struct gfxfb_info gfx;
                int fd, rc, saved_errno, contract = 1;
                uint64_t required = 0;

                if (stat("/dev/fb0", &st) != 0) {
                    printf("stat_rc=-1 errno=%d (%s)\n", errno, strerror(errno));
                    return (2);
                }
                printf("mode=%#o is_character=%d major=%u minor=%u\n",
                    (unsigned)st.st_mode, S_ISCHR(st.st_mode),
                    (unsigned)major(st.st_rdev), (unsigned)minor(st.st_rdev));
                if (!S_ISCHR(st.st_mode))
                    return (3);

                fd = open("/dev/fb0", O_RDONLY);
                if (fd < 0) {
                    printf("open_ro_rc=-1 errno=%d (%s)\n", errno, strerror(errno));
                    return (4);
                }
                printf("open_ro_rc=0\n");

                memset(&ident, 0, sizeof (ident));
                rc = ioctl(fd, VIS_GETIDENTIFIER, &ident);
                saved_errno = errno;
                printf("VIS_GETIDENTIFIER rc=%d errno=%d (%s) name=%s\n",
                    rc, rc == 0 ? 0 : saved_errno,
                    rc == 0 ? "none" : strerror(saved_errno),
                    rc == 0 ? ident.name : "<unavailable>");
                if (rc != 0 || strcmp(ident.name, "illumos_fb") != 0)
                    contract = 0;

                memset(&attr, 0, sizeof (attr));
                rc = ioctl(fd, FBIOGATTR, &attr);
                saved_errno = errno;
                printf("FBIOGATTR rc=%d errno=%d (%s)\n",
                    rc, rc == 0 ? 0 : saved_errno,
                    rc == 0 ? "none" : strerror(saved_errno));
                if (rc == 0) {
                    printf("fb_width=%d fb_height=%d fb_depth=%d fb_size=%d sattr_flags=%#x\n",
                        attr.fbtype.fb_width, attr.fbtype.fb_height,
                        attr.fbtype.fb_depth, attr.fbtype.fb_size,
                        (unsigned)attr.sattr.flags);
                    printf("dev_specific_bytes=%lu gfxfb_info_bytes=%lu\n",
                        (unsigned long)sizeof (attr.sattr.dev_specific),
                        (unsigned long)sizeof (gfx));
                    if ((attr.sattr.flags & FB_ATTR_DEVSPECIFIC) == 0 ||
                        sizeof (attr.sattr.dev_specific) < sizeof (gfx)) {
                        printf("gfxfb_info=UNAVAILABLE\n");
                        contract = 0;
                    } else {
                        memset(&gfx, 0, sizeof (gfx));
                        memcpy(&gfx, &attr.sattr.dev_specific[0], sizeof (gfx));
                        required = (uint64_t)gfx.pitch *
                            (uint64_t)attr.fbtype.fb_height;
                        printf("gfxfb_pitch=%u terminal_origin=%u,%u font=%u,%u\n",
                            gfx.pitch, gfx.terminal_origin_x,
                            gfx.terminal_origin_y, gfx.font_width,
                            gfx.font_height);
                        printf("required_bytes=%llu\n",
                            (unsigned long long)required);
                        if (attr.fbtype.fb_width != 1200 ||
                            attr.fbtype.fb_height != 1920 ||
                            attr.fbtype.fb_depth != 32 ||
                            gfx.pitch != 4800 ||
                            attr.fbtype.fb_size < 9216000 ||
                            required != 9216000)
                            contract = 0;
                    }
                } else {
                    contract = 0;
                }
                (void)close(fd);

                fd = open("/dev/fb0", O_RDWR);
                if (fd < 0) {
                    printf("open_rw_rc=-1 errno=%d (%s)\n", errno, strerror(errno));
                    contract = 0;
                } else {
                    printf("open_rw_rc=0 (descriptor closed without ioctl or write)\n");
                    (void)close(fd);
                }

                printf("ROTFB_DEVICE_CONTRACT=%s\n", contract ? "PASS" : "FAIL");
                return (contract ? 0 : 10);
            }
            EOF
              "$CC" -g -O0 -o "$ART/framebuffer_ioctl_preflight" \
                "$ART/framebuffer_ioctl_preflight.c" \
                > "$ART/ioctl-probe-build.log" 2>&1
              cc_rc=$?
              echo "ioctl_probe_compile_exit_code=$cc_rc" >> "$ART/device-preflight-status.txt"
              if [ "$cc_rc" -eq 0 ]; then
                "$ART/framebuffer_ioctl_preflight" \
                  > "$ART/framebuffer-ioctl-report.txt" 2>&1
                ioctl_rc=$?
                echo "ioctl_probe_exit_code=$ioctl_rc" >> "$ART/device-preflight-status.txt"
              else
                echo "ioctl_probe_exit_code=NOT_RUN" >> "$ART/device-preflight-status.txt"
              fi
            else
              echo "ioctl_probe_compile_exit_code=NOT_RUN" >> "$ART/device-preflight-status.txt"
              echo "ioctl_probe_exit_code=NOT_RUN" >> "$ART/device-preflight-status.txt"
              echo "No preinstalled C compiler; no ioctl was attempted." > "$ART/framebuffer-ioctl-report.txt"
            fi

            # Harmless pid-provider test against /usr/bin/sleep; no ROTFB code runs.
            if command -v dtrace >/dev/null 2>&1; then
              dtrace -V > "$ART/dtrace-version.txt" 2>&1
              /usr/bin/sleep 3 &
              harmless_pid=$!
              dtrace -l -p "$harmless_pid" > "$ART/dtrace-harmless-probes.txt" 2>&1
              list_rc=$?
              echo "dtrace_list_exit_code=$list_rc" > "$ART/dtrace-preflight-status.txt"
              wait "$harmless_pid"
              dtrace -q -c "/usr/bin/sleep 2" \
                -n 'pid$target:::entry /probemod == "libc.so.1"/ { printf("PID_PROVIDER_HIT %s", probefunc); }' \
                > "$ART/dtrace-harmless-trace.txt" 2>&1
              trace_rc=$?
              echo "dtrace_harmless_trace_exit_code=$trace_rc" >> "$ART/dtrace-preflight-status.txt"
              if [ "$trace_rc" -eq 0 ] && grep -q 'PID_PROVIDER_HIT' "$ART/dtrace-harmless-trace.txt"; then
                echo "harmless_pid_trace=PASS" >> "$ART/dtrace-preflight-status.txt"
              else
                echo "harmless_pid_trace=FAIL" >> "$ART/dtrace-preflight-status.txt"
              fi

              # dlopen only maps the exact Run 8 production ELF into a disposable
              # helper process. No Xorg entrypoint, DriverRec callback or DDX function
              # is called. This tests actual pid-probe discovery for its local symbols.
              if [ -n "$CC" ] && [ -s "$ART/illumosfb_drv.so" ]; then
                cat > "$ART/dtrace_ddx_symbol_host.c" <<'EOF'
            #include <dlfcn.h>
            #include <stdio.h>
            #include <unistd.h>
            int main(int argc, char **argv) {
                void *h;
                if (argc != 2) return (2);
                h = dlopen(argv[1], RTLD_LAZY | RTLD_LOCAL);
                if (h == NULL) {
                    fprintf(stderr, "dlopen failed: %s\n", dlerror());
                    return (3);
                }
                puts("DDX_DLOPEN_OK");
                fflush(stdout);
                sleep(20);
                dlclose(h);
                return (0);
            }
            EOF
                "$CC" -g -O0 -o "$ART/dtrace-ddx-symbol-host" \
                  "$ART/dtrace_ddx_symbol_host.c" -ldl \
                  > "$ART/dtrace-ddx-host-build.log" 2>&1
                host_build_rc=$?
                echo "ddx_host_compile_exit_code=$host_build_rc" >> "$ART/dtrace-preflight-status.txt"
                if [ "$host_build_rc" -eq 0 ]; then
                  "$ART/dtrace-ddx-symbol-host" "$ART/illumosfb_drv.so" \
                    > "$ART/dtrace-ddx-host.log" 2>&1 &
                  host_pid=$!
                  sleep 1
                  if kill -0 "$host_pid" 2>/dev/null && grep -q DDX_DLOPEN_OK "$ART/dtrace-ddx-host.log"; then
                    dtrace -l -p "$host_pid" > "$ART/dtrace-production-ddx-probes.txt" 2>&1
                    probe_rc=$?
                    echo "ddx_probe_discovery_exit_code=$probe_rc" >> "$ART/dtrace-preflight-status.txt"
                    for symbol in IlFbProbe IlFbPreInit IlFbScreenInit IlFbCreateScreenResources IlFbShadowInit IlFbRotateUpdate IlFbCloseScreen; do
                      if grep -q "$symbol" "$ART/dtrace-production-ddx-probes.txt"; then
                        echo "production_probe_$symbol=DISCOVERED" >> "$ART/dtrace-preflight-status.txt"
                      else
                        echo "production_probe_$symbol=NOT_DISCOVERED" >> "$ART/dtrace-preflight-status.txt"
                      fi
                    done
                    kill "$host_pid" 2>/dev/null || true
                    wait "$host_pid" 2>/dev/null || true
                  else
                    echo "production_ddx_dlopen=FAIL_OR_EXITED" >> "$ART/dtrace-preflight-status.txt"
                    wait "$host_pid" 2>/dev/null || true
                  fi
                fi
              else
                echo "production_ddx_probe_discovery=NOT_RUN_NO_COMPILER_OR_BINARY" >> "$ART/dtrace-preflight-status.txt"
              fi
            else
              echo "dtrace=UNAVAILABLE" > "$ART/dtrace-preflight-status.txt"
            fi

            # Never start Xorg or execute ScreenInit in this preflight workflow.
            # A separate production runtime run is permitted only after the exact
            # device contract and O_RDWR open both pass.
            {
              echo "production_xorg_screeninit=NOT_RUN_BY_DESIGN"
              echo "KDSETMODE=NOT_CALLED"
              echo "mmap=NOT_CALLED"
              echo "framebuffer_write=NOT_PERFORMED"
              echo "VT_SWITCH=NOT_PERFORMED"
              echo "IPS_MUTATION=NOT_PERFORMED"
              echo "completed_utc=$(date -u +%FT%TZ)"
            } > "$ART/safety-boundary.txt"

            find "$ART" -type f ! -name SHA256SUMS -print | sort | while IFS= read -r f; do
              digest -a sha256 "$f" | awk -v n="$(basename "$f")" '{print $1 "  " n}'
            done > "$ART/SHA256SUMS"
            echo "preflight_vm_exit=0"
            ROTFB_PREFLIGHT

      - name: Upload read-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotfb-vm-device-preflight-${{ github.run_id }}-${{ github.sha }}
          path: rotfb-preflight-artifacts/
          if-no-files-found: error
          retention-days: 30
