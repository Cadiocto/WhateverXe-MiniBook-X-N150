name: illumos framebuffer rotation build

on:
  push:
    branches: [gop-rotation-hook]
    paths:
      - "illumo_rotfb/**"
      - ".github/workflows/build-illumos.yml"
  workflow_dispatch:

concurrency:
  group: rotfb-single-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-illumos:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: ROTFB geometry and clipping model tests
        run: python3 illumo_rotfb/tests/rotfb_model_test.py

      - name: Initialize diagnostic artifact staging
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rotfb-build-logs"
          printf 'Artifact staging initialized on runner at %s\n' "$(date -u +%FT%TZ)" \
            > "$GITHUB_WORKSPACE/rotfb-build-logs/collector-started.txt"

      - name: Build in OpenIndiana VM
        uses: vmactions/openindiana-vm@v1
        with:
          release: "202610-build"
          arch: x86_64
          mem: 8192
          cpu: 4
          sync: nfs
          prepare: |
            set -eux
            pkg refresh
            pkg install --accept developer/build/gnu-make developer/build/onbld developer/versioning/git shell/ksh93 runtime/perl-542 runtime/perl-542/module/sun-solaris

            # Audit IPS packages and actual Perl paths before configuring illumos.
            # OpenIndiana 202610 marks Perl 5.10 obsolete and ships Perl 5.42 as 64-bit.
            PERL_AUDIT="$GITHUB_WORKSPACE/rotfb-build-logs/perl-package-audit.txt"
            mkdir -p "$(dirname "$PERL_AUDIT")"
            {
              audit_cmd() {
                label="$1"
                shift
                echo "===== $label ====="
                if "$@"; then
                  echo "command_exit_status=0"
                else
                  rc=$?
                  echo "command_exit_status=$rc"
                fi
              }

              audit_perl_pkg_list() {
                label="$1"
                shift
                tmp="/tmp/rotfb-perl-pkg-list.$$"
                echo "===== $label ====="
                if pkg list "$@" > "$tmp" 2>&1; then
                  pkg_rc=0
                else
                  pkg_rc=$?
                fi
                if grep -i perl "$tmp"; then
                  grep_rc=0
                else
                  grep_rc=$?
                fi
                echo "pkg_list_exit_status=$pkg_rc"
                echo "grep_exit_status=$grep_rc"
                rm -f "$tmp"
              }

              audit_perl_pkg_list "installed Perl packages" -Hv
              audit_cmd "requested Perl 5.42 package status" pkg list -Hv runtime/perl-542 runtime/perl-542/module/sun-solaris
              audit_perl_pkg_list "available Perl packages" -a
              audit_cmd "remote Perl 5.10 package info" pkg info -r runtime/perl-510
              audit_cmd "remote Perl 5.10 payload" pkg contents -r runtime/perl-510
              audit_cmd "remote Perl 5.10 manifest" pkg contents -m -r runtime/perl-510
              audit_cmd "installed Perl 5.38 payload" pkg contents runtime/perl-538
              audit_cmd "installed Perl 5.42 payload" pkg contents runtime/perl-542
              audit_cmd "installed Perl 5.42 manifest" pkg contents -m runtime/perl-542
              audit_cmd "installed Perl 5.42 Solaris module payload" pkg contents runtime/perl-542/module/sun-solaris
              audit_cmd "installed Perl 5.42 Solaris module manifest" pkg contents -m runtime/perl-542/module/sun-solaris
              audit_cmd "nightly Perl entry point metadata" ls -li /usr/bin/perl /usr/bin/perl5.42.3 /usr/bin/xsubpp /usr/perl5/5.42/bin/perl /usr/perl5/5.42/bin/xsubpp
              audit_cmd "nightly Perl entry point file types" file /usr/bin/perl /usr/perl5/5.42/bin/perl
              audit_cmd "nightly Perl entry point architecture" /usr/bin/perl -V:version -V:archname
              audit_cmd "Perl path entries and symlinks" find /usr/perl5 -name perl -exec ls -ld {} +
              audit_cmd "Perl binary file types" find /usr/perl5 -name perl -exec file {} +
              audit_cmd "Perl executable architecture probes" find /usr/perl5 -name perl -exec sh -c '
                for p do
                  echo "PERL_PATH=$p"
                  ls -ld "$p"
                  if [ -x "$p" ]; then
                    echo "EXECUTABLE=yes"
                    if "$p" -V:version -V:archname; then
                      echo "perl_probe_exit_status=0"
                    else
                      rc=$?
                      echo "perl_probe_exit_status=$rc"
                    fi
                  else
                    echo "EXECUTABLE=no"
                  fi
                done
              ' sh {} +
              audit_cmd "xsubpp path entries" find /usr/perl5 -name xsubpp -exec ls -ld {} +
              audit_cmd "64-bit Perl headers" ls -l /usr/perl5/5.42/lib/i86pc-solaris-thread-multi-64/CORE/perl.h /usr/perl5/5.42/lib/i86pc-solaris-thread-multi-64/CORE/libperl.so
              audit_cmd "legacy Perl 5.10 paths" ls -ld /usr/perl5/5.10.0 /usr/perl5/5.10.0/lib/ExtUtils/xsubpp /usr/perl5/5.10.0/bin/i386/perl /usr/perl5/5.10.0/bin/amd64/perl
              audit_cmd "5.42 architecture-specific Perl paths" ls -ld /usr/perl5/5.42/bin/i386/perl /usr/perl5/5.42/bin/amd64/perl
            } > "$PERL_AUDIT" 2>&1
            cat "$PERL_AUDIT"
            echo "CHECK: /usr/perl5/5.42/lib/ExtUtils/xsubpp"
            test -f /usr/perl5/5.42/lib/ExtUtils/xsubpp
            echo "PASS: Perl 5.42 xsubpp exists"
            echo "CHECK: /usr/perl5/5.42/lib/ExtUtils/typemap"
            test -f /usr/perl5/5.42/lib/ExtUtils/typemap
            echo "PASS: Perl 5.42 typemap exists"
            echo "CHECK: 64-bit Perl CORE headers"
            test -f /usr/perl5/5.42/lib/i86pc-solaris-thread-multi-64/CORE/perl.h
            test -f /usr/perl5/5.42/lib/i86pc-solaris-thread-multi-64/CORE/libperl.so
            echo "PASS: Perl 5.42 64-bit CORE files exist"
            echo "CHECK: /usr/perl5/5.42/bin/perl"
            test -x /usr/perl5/5.42/bin/perl
            echo "CHECK: /usr/bin/perl used by illumos Makefile.master"
            test -x /usr/bin/perl
            PERL_VERSION_OUTPUT=$(/usr/bin/perl -V:version)
            PERL_ARCH_OUTPUT=$(/usr/bin/perl -V:archname)
            test "$PERL_VERSION_OUTPUT" = "version='5.42.3';"
            test "$PERL_ARCH_OUTPUT" = "archname='i86pc-solaris-thread-multi-64';"
            echo "$PERL_VERSION_OUTPUT"
            echo "$PERL_ARCH_OUTPUT"
            /usr/bin/perl -v
          run: |
            set -eu
            LOGDIR="$GITHUB_WORKSPACE/rotfb-build-logs"
            mkdir -p "$LOGDIR"
            printf 'VM diagnostic collector started at %s\n' "$(date -u +%FT%TZ)" > "$LOGDIR/vm-started.txt"

            WORKSPACE="$HOME/illumos-rotfb-work"
            mkdir -p "$WORKSPACE"
            cd "$WORKSPACE"
            git clone https://github.com/illumos/illumos-gate.git
            cd illumos-gate
            git checkout 098e95820891f8a83fae679daece7fcf58b7b3a4
            # illumos.sh uses git describe --all; anchor this pinned detached commit.
            git branch -f rotfb-build HEAD

            ROTFB="$GITHUB_WORKSPACE/illumo_rotfb"
            PATCH_APPLY_LOG="$LOGDIR/patch-apply.log"
            : > "$PATCH_APPLY_LOG"
            for p in "$ROTFB"/patches/*.patch; do
              [ -f "$p" ] || continue
              echo "CHECK $(basename "$p")" | tee -a "$PATCH_APPLY_LOG"
              if [ "$(basename "$p")" = "0007-gfxp-bitmap-bounds-hardening.patch" ]; then
                TARGET_BITMAP=usr/src/uts/i86pc/io/gfx_private/gfxp_bitmap.c
                git --version > "$LOGDIR/openindiana-git-version.txt"
                cksum "$TARGET_BITMAP" > "$LOGDIR/gfxp_bitmap-pre-0007.cksum"
                cp "$TARGET_BITMAP" "$LOGDIR/gfxp_bitmap-pre-0007.c"
                sed -n '430,475p' "$TARGET_BITMAP" > "$LOGDIR/gfxp_bitmap-pre-0007-context.txt"
                cp "$p" "$LOGDIR/0007-gfxp-bitmap-bounds-hardening.patch"
              fi
              git apply --check "$p"
              git apply "$p"
              echo "APPLIED $(basename "$p")" | tee -a "$PATCH_APPLY_LOG"
            done
            git diff --check
            git status --short > "$LOGDIR/upstream-patched-status.txt"
            git diff --stat > "$LOGDIR/upstream-patched-diffstat.txt"
            mkdir -p usr/src/uts/i86pc/sys usr/src/uts/i86pc/boot usr/src/uts/i86pc/io/gfx_private
            cp "$ROTFB/rotfb.h" usr/src/uts/i86pc/sys/rotfb.h
            cp "$ROTFB/rotfb_boot.c" usr/src/uts/i86pc/boot/rotfb_boot.c
            cp "$ROTFB/rotfb_runtime.c" usr/src/uts/i86pc/io/gfx_private/rotfb_runtime.c
            chmod 0644 usr/src/uts/i86pc/sys/rotfb.h usr/src/uts/i86pc/boot/rotfb_boot.c usr/src/uts/i86pc/io/gfx_private/rotfb_runtime.c

            cd usr/src
            export CODEMGR_WS="$WORKSPACE/illumos-gate"
            export GATE="$CODEMGR_WS"
            export PATH="/opt/onbld/bin:/usr/bin:/usr/sbin:/usr/gnu/bin"
            sed -e "s/^export NIGHTLY_OPTIONS=.*/export NIGHTLY_OPTIONS='-n'/" \
              -e "s/^export SHADOW_CCS=.*/export SHADOW_CCS=/" \
              -e "s/^export SHADOW_CCCS=.*/export SHADOW_CCCS=/" \
              -e "s/^export ENABLE_SMATCH=.*/export ENABLE_SMATCH=/" \
              tools/env/illumos.sh > /tmp/rotfb-nightly.env
            echo "export PERL_VERSION=5.42" >> /tmp/rotfb-nightly.env
            echo "export PERL_VARIANT=-thread-multi" >> /tmp/rotfb-nightly.env
            echo "export PERL_PKGVERS=-542" >> /tmp/rotfb-nightly.env
            echo "export BUILDPERL32='#'" >> /tmp/rotfb-nightly.env
            echo "export VERSION=illumos-098e958-rotfb" >> /tmp/rotfb-nightly.env
            echo "===== effective Perl build configuration ====="
            if ! grep -F "export PERL_VERSION=5.42" /tmp/rotfb-nightly.env >/dev/null; then
              echo "PERL_VERSION override missing"
              exit 1
            fi
            if ! grep -F "export PERL_VARIANT=-thread-multi" /tmp/rotfb-nightly.env >/dev/null; then
              echo "PERL_VARIANT override missing"
              exit 1
            fi
            if ! grep -F "export PERL_PKGVERS=-542" /tmp/rotfb-nightly.env >/dev/null; then
              echo "PERL_PKGVERS override missing"
              exit 1
            fi
            if ! grep -F "export BUILDPERL32='#'" /tmp/rotfb-nightly.env >/dev/null; then
              echo "Upstream-supported 32-bit Perl module configuration missing"
              exit 1
            fi
            if grep -E '^[[:space:]]*export BUILDPERL64=' /tmp/rotfb-nightly.env >/dev/null; then
              echo "Unexpected: 64-bit Perl modules were disabled"
              exit 1
            fi
            cat /tmp/rotfb-nightly.env
            echo "OpenIndiana has no 32-bit Perl executable; upstream-supported BUILDPERL32='#' skips only 32-bit Perl module targets. No amd64-to-i386 alias is created."

            NIGHTLY_LOG="$LOGDIR/nightly.log"
            BUILD_NOISE_DIR="$LOGDIR/build-noise"
            GATE_LOG_DIR="$LOGDIR/gate-logs"
            mkdir -p "$BUILD_NOISE_DIR" "$GATE_LOG_DIR"
            printf 'nightly invocation: %s\n' "$(date -u +%FT%TZ)" > "$LOGDIR/build-metadata.txt"
            printf 'workspace=%s\nupstream_commit=098e95820891f8a83fae679daece7fcf58b7b3a4\n' "$CODEMGR_WS" >> "$LOGDIR/build-metadata.txt"

            # Preserve transient compiler diagnostics while nightly is running.
            (
              while :; do
                find /tmp -maxdepth 3 -type f -path '/tmp/nightly.tmpdir.*/build_noise' -print 2>/dev/null |
                while IFS= read -r f; do
                  d=$(basename "$(dirname "$f")")
                  tmp="$BUILD_NOISE_DIR/$d.txt.partial"
                  cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$BUILD_NOISE_DIR/$d.txt" 2>/dev/null || true
                done
                if [ -d "$CODEMGR_WS/log" ]; then
                  find "$CODEMGR_WS/log" -type f -print 2>/dev/null |
                  while IFS= read -r f; do
                    rel=${f#"$CODEMGR_WS/log"/}
                    rel=$(printf '%s' "$rel" | sed 's/[^A-Za-z0-9._/-]/_/g')
                    mkdir -p "$GATE_LOG_DIR/$(dirname "$rel")"
                    tmp="$GATE_LOG_DIR/$rel.partial"
                    cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$GATE_LOG_DIR/$rel" 2>/dev/null || true
                  done
                fi
                sleep 3
              done
            ) &
            LOG_MONITOR_PID=$!

            # Run nightly asynchronously so the SSH session emits a heartbeat.
            # The NFS-backed workspace makes each diagnostic snapshot visible on the runner immediately.
            ksh93 -x tools/scripts/nightly -n /tmp/rotfb-nightly.env > "$NIGHTLY_LOG" 2>&1 &
            BUILD_PID=$!
            BUILD_RC=0
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              find /tmp -maxdepth 3 -type f -path '/tmp/nightly.tmpdir.*/build_noise' -print 2>/dev/null |
              while IFS= read -r f; do
                d=$(basename "$(dirname "$f")")
                tmp="$BUILD_NOISE_DIR/$d.txt.partial"
                cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$BUILD_NOISE_DIR/$d.txt" 2>/dev/null || true
              done
              if [ -d "$CODEMGR_WS/log" ]; then
                find "$CODEMGR_WS/log" -type f -print 2>/dev/null |
                while IFS= read -r f; do
                  rel=${f#"$CODEMGR_WS/log"/}
                  rel=$(printf '%s' "$rel" | sed 's/[^A-Za-z0-9._/-]/_/g')
                  mkdir -p "$GATE_LOG_DIR/$(dirname "$rel")"
                  tmp="$GATE_LOG_DIR/$rel.partial"
                  cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$GATE_LOG_DIR/$rel" 2>/dev/null || true
                done
              fi
              printf 'OpenIndiana build heartbeat: %s\n' "$(date -u +%FT%TZ)" | tee -a "$LOGDIR/runner-heartbeat.log"
              printf '%s nightly_pid=%s\n' "$(date -u +%FT%TZ)" "$BUILD_PID" > "$LOGDIR/build-state.txt"
              sleep 10
            done
            wait "$BUILD_PID" || BUILD_RC=$?

            printf '%s\n' "$BUILD_RC" > "$LOGDIR/nightly-exit-code.txt"
            # NIGHTLY_LOG is already on the NFS-shared workspace; it is persisted during the build.
            cp -f "$NIGHTLY_LOG" "$LOGDIR/nightly.log.final" 2>/dev/null || true
            cp -f /tmp/rotfb-nightly.env "$LOGDIR/rotfb-nightly.env" 2>/dev/null || true

            # Take a final snapshot after nightly exits, then stop the monitor.
            find /tmp -maxdepth 3 -type f -path '/tmp/nightly.tmpdir.*/build_noise' -print 2>/dev/null |
            while IFS= read -r f; do
              d=$(basename "$(dirname "$f")")
              tmp="$BUILD_NOISE_DIR/$d.txt.partial"
              cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$BUILD_NOISE_DIR/$d.txt" 2>/dev/null || true
            done
            if [ -d "$CODEMGR_WS/log" ]; then
              find "$CODEMGR_WS/log" -type f -print 2>/dev/null |
              while IFS= read -r f; do
                rel=${f#"$CODEMGR_WS/log"/}
                rel=$(printf '%s' "$rel" | sed 's/[^A-Za-z0-9._/-]/_/g')
                mkdir -p "$GATE_LOG_DIR/$(dirname "$rel")"
                tmp="$GATE_LOG_DIR/$rel.partial"
                cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$GATE_LOG_DIR/$rel" 2>/dev/null || true
              done
            fi
            kill "$LOG_MONITOR_PID" 2>/dev/null || true
            wait "$LOG_MONITOR_PID" 2>/dev/null || true

            # Require compile and link evidence for both kernel architectures.
            EVIDENCE_RC=0
            BOOT_PC_COMPILE_COUNT=$(grep -E -c ' -Di86pc .* -c -o obj64/rotfb_boot\.o .*rotfb_boot\.c' "$GATE_LOG_DIR/nightly.log" || true)
            BOOT_XPV_COMPILE_COUNT=$(grep -E -c ' -D__i86xpv .* -c -o obj64/rotfb_boot\.o .*rotfb_boot\.c' "$GATE_LOG_DIR/nightly.log" || true)
            RUNTIME_PC_COMPILE_COUNT=$(grep -E -c ' -Di86pc .* -c -o obj64/rotfb_runtime\.o .*rotfb_runtime\.c' "$GATE_LOG_DIR/nightly.log" || true)
            RUNTIME_XPV_COMPILE_COUNT=$(grep -E -c ' -D__i86xpv .* -c -o obj64/rotfb_runtime\.o .*rotfb_runtime\.c' "$GATE_LOG_DIR/nightly.log" || true)
            BITMAP_PC_COMPILE_COUNT=$(grep -E -c ' -Di86pc .* -c -o obj64/gfxp_bitmap\.o .*gfxp_bitmap\.c' "$GATE_LOG_DIR/nightly.log" || true)
            BITMAP_XPV_COMPILE_COUNT=$(grep -E -c ' -D__i86xpv .* -c -o obj64/gfxp_bitmap\.o .*gfxp_bitmap\.c' "$GATE_LOG_DIR/nightly.log" || true)
            GFXP_FB_PC_COMPILE_COUNT=$(grep -E -c ' -Di86pc .* -c -o obj64/gfxp_fb\.o .*gfxp_fb\.c' "$GATE_LOG_DIR/nightly.log" || true)
            GFXP_FB_XPV_COMPILE_COUNT=$(grep -E -c ' -D__i86xpv .* -c -o obj64/gfxp_fb\.o .*gfxp_fb\.c' "$GATE_LOG_DIR/nightly.log" || true)
            BOOT_LINK_COUNT=$(grep -E -c '/ld -r -o obj64/unix\.o .*obj64/rotfb_boot\.o' "$GATE_LOG_DIR/nightly.log" || true)
            RUNTIME_LINK_COUNT=$(grep -E -c '/ld -ztype=kmod .* -o obj64/gfx_private .*obj64/rotfb_runtime\.o' "$GATE_LOG_DIR/nightly.log" || true)
            BITMAP_LINK_COUNT=$(grep -E -c '/ld -ztype=kmod .* -o obj64/gfx_private .*obj64/gfxp_bitmap\.o' "$GATE_LOG_DIR/nightly.log" || true)
            GFXP_FB_LINK_COUNT=$(grep -E -c '/ld -ztype=kmod .* -o obj64/gfx_private .*obj64/gfxp_fb\.o' "$GATE_LOG_DIR/nightly.log" || true)

            grep -E ' -c -o obj64/rotfb_boot\.o .*rotfb_boot\.c' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/rotfb-boot-compile-commands.txt" || true
            grep -E '/ld -r -o obj64/unix\.o .*obj64/rotfb_boot\.o' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/rotfb-boot-link-commands.txt" || true
            grep -E ' -c -o obj64/rotfb_runtime\.o .*rotfb_runtime\.c' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/rotfb-runtime-compile-commands.txt" || true
            grep -E '/ld -ztype=kmod .* -o obj64/gfx_private .*obj64/rotfb_runtime\.o' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/rotfb-runtime-link-commands.txt" || true
            grep -E ' -c -o obj64/gfxp_bitmap\.o .*gfxp_bitmap\.c' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/gfxp-bitmap-compile-commands.txt" || true
            grep -E ' -c -o obj64/gfxp_fb\.o .*gfxp_fb\.c' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/gfxp-fb-compile-commands.txt" || true

            {
              echo "rotfb_boot_i86pc_compile_commands=$BOOT_PC_COMPILE_COUNT"
              echo "rotfb_boot_i86xpv_compile_commands=$BOOT_XPV_COMPILE_COUNT"
              echo "rotfb_runtime_i86pc_compile_commands=$RUNTIME_PC_COMPILE_COUNT"
              echo "rotfb_runtime_i86xpv_compile_commands=$RUNTIME_XPV_COMPILE_COUNT"
              echo "gfxp_bitmap_i86pc_compile_commands=$BITMAP_PC_COMPILE_COUNT"
              echo "gfxp_bitmap_i86xpv_compile_commands=$BITMAP_XPV_COMPILE_COUNT"
              echo "gfxp_fb_i86pc_compile_commands=$GFXP_FB_PC_COMPILE_COUNT"
              echo "gfxp_fb_i86xpv_compile_commands=$GFXP_FB_XPV_COMPILE_COUNT"
              echo "unix_boot_object_link_commands=$BOOT_LINK_COUNT"
              echo "gfx_private_runtime_link_commands=$RUNTIME_LINK_COUNT"
              echo "gfx_private_bitmap_link_commands=$BITMAP_LINK_COUNT"
              echo "gfx_private_fb_link_commands=$GFXP_FB_LINK_COUNT"
            } > "$LOGDIR/rotfb-build-evidence.txt"

            if [ "$BOOT_PC_COMPILE_COUNT" -lt 1 ] ||
                [ "$BOOT_XPV_COMPILE_COUNT" -lt 1 ] ||
                [ "$RUNTIME_PC_COMPILE_COUNT" -lt 1 ] ||
                [ "$RUNTIME_XPV_COMPILE_COUNT" -lt 1 ] ||
                [ "$BITMAP_PC_COMPILE_COUNT" -lt 1 ] ||
                [ "$BITMAP_XPV_COMPILE_COUNT" -lt 1 ] ||
                [ "$GFXP_FB_PC_COMPILE_COUNT" -lt 1 ] ||
                [ "$GFXP_FB_XPV_COMPILE_COUNT" -lt 1 ] ||
                [ "$BOOT_LINK_COUNT" -lt 2 ] ||
                [ "$RUNTIME_LINK_COUNT" -lt 2 ] ||
                [ "$BITMAP_LINK_COUNT" -lt 2 ] ||
                [ "$GFXP_FB_LINK_COUNT" -lt 2 ]; then
              echo "ROTFB/framebuffer compile-link evidence incomplete" | tee -a "$LOGDIR/rotfb-build-evidence.txt"
              EVIDENCE_RC=1
            else
              echo "ROTFB/framebuffer compile-link evidence: PASS" | tee -a "$LOGDIR/rotfb-build-evidence.txt"
            fi
            if [ "$EVIDENCE_RC" -ne 0 ]; then
              BUILD_RC=1
            fi
            printf '%s\n' "$BUILD_RC" > "$LOGDIR/final-build-exit-code.txt"

            # Flatten compiler errors from every captured log into one index.
            {
              echo "===== nightly.log compiler/error context ====="
              grep -n -i -B 4 -A 8 -E '(^|[[:space:]])(fatal[[:space:]]+)?error:|ld:[[:space:]]+fatal:|undefined symbol|syntax error|dmake:.*failed|Don.t know how to make' "$NIGHTLY_LOG" || true
              for f in "$BUILD_NOISE_DIR"/*.txt "$GATE_LOG_DIR"/*; do
                [ -f "$f" ] || continue
                echo "===== $f ====="
                grep -n -i -B 4 -A 8 -E '(^|[[:space:]])(fatal[[:space:]]+)?error:|ld:[[:space:]]+fatal:|undefined symbol|syntax error|dmake:.*failed|Don.t know how to make' "$f" || true
              done
            } > "$LOGDIR/compiler-error-index.txt"

            {
              echo "Collected at $(date -u +%FT%TZ)"
              find "$LOGDIR" -type f -exec ls -ln {} \; 2>&1 || true
            } > "$LOGDIR/collected-files.txt"
            echo "===== nightly tail ====="
            tail -n 300 "$NIGHTLY_LOG" || true
            exit "$BUILD_RC"

      - name: Finalize diagnostic index on runner
        if: always()
        shell: bash
        run: |
          set +e
          LOGDIR="$GITHUB_WORKSPACE/rotfb-build-logs"
          mkdir -p "$LOGDIR"
          {
            echo "Runner-side diagnostic index generated at $(date -u +%FT%TZ)"
            echo "This step runs even when the OpenIndiana VM/SSH step fails."
            echo
            find "$LOGDIR" -type f -printf '%p %s bytes %TY-%Tm-%TdT%TH:%TM:%TS\n' | sort
          } > "$LOGDIR/runner-file-index.txt"
          {
            echo "===== compiler/build error scan ====="
            find "$LOGDIR" -type f ! -name 'runner-error-index.txt' -print0 |
            while IFS= read -r -d '' f; do
              if grep -Iq . "$f"; then
                matches=$(grep -n -i -B 5 -A 10 -E '(^|[[:space:]])(fatal[[:space:]]+)?error:|ld:[[:space:]]+fatal:|undefined symbol|syntax error|dmake:.*failed|don.t know how to make|(^|[^[:alnum:]_])(failed|killed)([^[:alnum:]_]|$)|(^|[^[:alnum:]_])cannot[[:space:]]+(open|find|read|write|create|remove|unlink|rename|access|load|resolve|locate|allocate|map|execute|compile|link|install|build|stat|mount|connect|bind|start|stop|be[[:space:]]+(opened|found|read|written|created|removed|loaded|resolved|located|allocated|mapped|executed|compiled|linked|installed|built|mounted|connected|bound|started|stopped))([^[:alnum:]_]|$)|out of memory|panic(:|\[)|segmentation fault|ssh exited' "$f" 2>/dev/null)
                if [ -n "$matches" ]; then
                  printf '\n===== %s =====\n%s\n' "$f" "$matches"
                fi
              fi
            done
          } > "$LOGDIR/runner-error-index.txt"
          echo "===== diagnostic files ====="
          cat "$LOGDIR/runner-file-index.txt"
          echo "===== error scan ====="
          cat "$LOGDIR/runner-error-index.txt"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illumos-framebuffer-build-logs-${{ github.run_id }}
          path: rotfb-build-logs/
          if-no-files-found: warn
          retention-days: 14
