name: illumos framebuffer rotation build

on:
  workflow_dispatch:
  push:
    branches:
      - gop-rotation-hook
    paths:
      - "illumo_rotfb/patches/**"
      - "illumo_rotfb/rotfb.h"
      - "illumo_rotfb/rotfb_boot.c"
      - "illumo_rotfb/rotfb_copy.h"
      - "illumo_rotfb/rotfb_runtime.c"
      - "illumo_rotfb/rotfb_vis_cursor.h"
      - "illumo_rotfb/rotfb_link_evidence.sh"
      - "illumo_rotfb/tests/rotfb_patch_series_test.sh"
      - "illumo_rotfb/tests/fixtures/**"
      - ".github/workflows/build-illumos.yml"

concurrency:
  group: rotfb-single-build
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-illumos:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout ROTFB source
        id: checkout
        uses: actions/checkout@v4

      - name: ROTFB geometry and clipping model tests
        id: host_model
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p rotfb-test-results
          log=rotfb-test-results/geometry-model.log
          set +e
          python3 illumo_rotfb/tests/rotfb_model_test.py > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          printf '%s\n' "$rc" > rotfb-test-results/geometry-model.exit-code
          exit "$rc"

      - name: ROTFB linker evidence regression tests
        id: host_link_evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p rotfb-test-results
          log=rotfb-test-results/linker-evidence-regression.log
          set +e
          sh -x illumo_rotfb/tests/rotfb_link_evidence_test.sh > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          printf '%s\n' "$rc" > rotfb-test-results/linker-evidence-regression.exit-code
          exit "$rc"

      - name: ROTFB VIS cursor C regression tests
        id: host_vis_cursor
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p rotfb-test-results
          log=rotfb-test-results/vis-cursor-c.log
          set +e
          cc -std=c99 -Wall -Wextra -Werror -o "$RUNNER_TEMP/rotfb-vis-cursor-test" illumo_rotfb/tests/rotfb_vis_cursor_test.c > "$log" 2>&1
          compile_rc=$?
          test_rc=SKIPPED
          if [ "$compile_rc" -eq 0 ]; then
            "$RUNNER_TEMP/rotfb-vis-cursor-test" >> "$log" 2>&1
            test_rc=$?
          fi
          set -e
          cat "$log"
          printf 'compile_exit_code=%s\ntest_exit_code=%s\n' "$compile_rc" "$test_rc" > rotfb-test-results/vis-cursor-c.exit-code
          [ "$compile_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]

      - name: ROTFB bitmap copy C regression tests
        id: host_bitmap_copy
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p rotfb-test-results
          log=rotfb-test-results/bitmap-copy-c.log
          set +e
          cc -std=c99 -Wall -Wextra -Werror -o "$RUNNER_TEMP/rotfb-bitmap-copy-test" illumo_rotfb/tests/rotfb_bitmap_copy_test.c > "$log" 2>&1
          compile_rc=$?
          test_rc=SKIPPED
          if [ "$compile_rc" -eq 0 ]; then
            "$RUNNER_TEMP/rotfb-bitmap-copy-test" >> "$log" 2>&1
            test_rc=$?
          fi
          set -e
          cat "$log"
          printf 'compile_exit_code=%s\ntest_exit_code=%s\n' "$compile_rc" "$test_rc" > rotfb-test-results/bitmap-copy-c.exit-code
          [ "$compile_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]

      - name: ROTFB runtime lifecycle production C regression tests
        id: host_runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p rotfb-test-results
          log=rotfb-test-results/runtime-lifecycle.log
          set +e
          sh -x illumo_rotfb/tests/rotfb_runtime_test.sh > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          printf '%s\n' "$rc" > rotfb-test-results/runtime-lifecycle.exit-code
          exit "$rc"

      - name: Initialize diagnostic artifact staging
        id: init_diagnostics
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rotfb-build-logs" "$GITHUB_WORKSPACE/rotfb-build-diagnostics" "$GITHUB_WORKSPACE/rotfb-test-results"
          : > "$GITHUB_WORKSPACE/rotfb-build-logs/.keep"
          : > "$GITHUB_WORKSPACE/rotfb-build-diagnostics/.keep"
          : > "$GITHUB_WORKSPACE/rotfb-test-results/.keep"
          printf 'Artifact staging initialized at %s\n' "$(date -u +%FT%TZ)" > "$GITHUB_WORKSPACE/rotfb-build-diagnostics/collector-started.txt"

      - name: ROTFB patched production bitmap callback integration tests
        id: callback_harness
        shell: bash
        run: |
          set -Eeuo pipefail
          UPSTREAM="$RUNNER_TEMP/illumos-gate-callback"
          PIN=098e95820891f8a83fae679daece7fcf58b7b3a4
          ROTFB="$GITHUB_WORKSPACE/illumo_rotfb"
          TEST_DIR="$GITHUB_WORKSPACE/.github/rotfb-callback-tests"
          ROTFB_TEST_LOG_DIR="$GITHUB_WORKSPACE/rotfb-test-results/callback-harness"
          LOG="$GITHUB_WORKSPACE/rotfb-test-results/callback-level-tests.log"
          export ROTFB_TEST_LOG_DIR
          mkdir -p "$ROTFB_TEST_LOG_DIR"
          set +e
          {
            git init "$UPSTREAM"
            git -C "$UPSTREAM" remote add origin https://github.com/illumos/illumos-gate.git
            git -C "$UPSTREAM" fetch --depth 1 origin "$PIN"
            git -C "$UPSTREAM" checkout --detach FETCH_HEAD
            test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$PIN"
            test -f "$TEST_DIR/rotfb_bitmap_callback_test.sh"
            sh -n "$TEST_DIR/rotfb_bitmap_callback_test.sh"
            sh "$TEST_DIR/rotfb_bitmap_callback_test.sh" "$UPSTREAM" "$ROTFB/patches"
          } > "$LOG" 2>&1
          rc=$?
          set -e
          cat "$LOG"
          printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/rotfb-test-results/callback-level-tests.exit-code"
          exit "$rc"

      - name: Build in OpenIndiana VM
        id: openindiana_vm
        uses: vmactions/openindiana-vm@v1
        with:
          release: "202610-build"
          arch: x86_64
          mem: 8192
          cpu: 4
          sync: nfs
          prepare: |
            set -eux
            mkdir -p "$GITHUB_WORKSPACE/rotfb-build-logs"
            if pkg refresh > "$GITHUB_WORKSPACE/rotfb-build-logs/ips-refresh.log" 2>&1; then
              :
            else
              rc=$?
              cat "$GITHUB_WORKSPACE/rotfb-build-logs/ips-refresh.log"
              exit "$rc"
            fi
            if pkg install --accept developer/build/gnu-make developer/build/onbld developer/versioning/git shell/ksh93 runtime/perl-542 runtime/perl-542/module/sun-solaris > "$GITHUB_WORKSPACE/rotfb-build-logs/ips-install.log" 2>&1; then
              :
            else
              rc=$?
              cat "$GITHUB_WORKSPACE/rotfb-build-logs/ips-install.log"
              exit "$rc"
            fi
            cat "$GITHUB_WORKSPACE/rotfb-build-logs/ips-refresh.log"
            cat "$GITHUB_WORKSPACE/rotfb-build-logs/ips-install.log"

            # Audit IPS packages and actual Perl paths before configuring illumos.
            # OpenIndiana 202610 marks Perl 5.10 obsolete and ships Perl 5.42 as 64-bit.
            PERL_AUDIT="$GITHUB_WORKSPACE/rotfb-build-logs/perl-package-audit.txt"
            mkdir -p "$(dirname "$PERL_AUDIT")"
            {
              audit_cmd() {
                label="$1"
                shift
                echo "===== $label ====="
                if "$@"; then
                  echo "command_exit_status=0"
                else
                  rc=$?
                  echo "command_exit_status=$rc"
                fi
              }

              audit_perl_pkg_list() {
                label="$1"
                shift
                tmp="/tmp/rotfb-perl-pkg-list.$$"
                echo "===== $label ====="
                if pkg list "$@" > "$tmp" 2>&1; then
                  pkg_rc=0
                else
                  pkg_rc=$?
                fi
                if grep -i perl "$tmp"; then
                  grep_rc=0
                else
                  grep_rc=$?
                fi
                echo "pkg_list_exit_status=$pkg_rc"
                echo "grep_exit_status=$grep_rc"
                rm -f "$tmp"
              }

              audit_perl_pkg_list "installed Perl packages" -Hv
              audit_cmd "requested Perl 5.42 package status" pkg list -Hv runtime/perl-542 runtime/perl-542/module/sun-solaris
              audit_perl_pkg_list "available Perl packages" -a
              audit_cmd "remote Perl 5.10 package info" pkg info -r runtime/perl-510
              audit_cmd "remote Perl 5.10 payload" pkg contents -r runtime/perl-510
              audit_cmd "remote Perl 5.10 manifest" pkg contents -m -r runtime/perl-510
              audit_cmd "installed Perl 5.38 payload" pkg contents runtime/perl-538
              audit_cmd "installed Perl 5.42 payload" pkg contents runtime/perl-542
              audit_cmd "installed Perl 5.42 manifest" pkg contents -m runtime/perl-542
              audit_cmd "installed Perl 5.42 Solaris module payload" pkg contents runtime/perl-542/module/sun-solaris
              audit_cmd "installed Perl 5.42 Solaris module manifest" pkg contents -m runtime/perl-542/module/sun-solaris
              audit_cmd "nightly Perl entry point metadata" ls -li /usr/bin/perl /usr/bin/perl5.42.3 /usr/bin/xsubpp /usr/perl5/5.42/bin/perl /usr/perl5/5.42/bin/xsubpp
              audit_cmd "nightly Perl entry point file types" file /usr/bin/perl /usr/perl5/5.42/bin/perl
              audit_cmd "nightly Perl entry point architecture" /usr/bin/perl -V:version -V:archname
              audit_cmd "Perl path entries and symlinks" find /usr/perl5 -name perl -exec ls -ld {} +
              audit_cmd "Perl binary file types" find /usr/perl5 -name perl -exec file {} +
              audit_cmd "Perl executable architecture probes" find /usr/perl5 -name perl -exec sh -c '
                for p do
                  echo "PERL_PATH=$p"
                  ls -ld "$p"
                  if [ -x "$p" ]; then
                    echo "EXECUTABLE=yes"
                    if "$p" -V:version -V:archname; then
                      echo "perl_probe_exit_status=0"
                    else
                      rc=$?
                      echo "perl_probe_exit_status=$rc"
                    fi
                  else
                    echo "EXECUTABLE=no"
                  fi
                done
              ' sh {} +
              audit_cmd "xsubpp path entries" find /usr/perl5 -name xsubpp -exec ls -ld {} +
              audit_cmd "64-bit Perl headers" ls -l /usr/perl5/5.42/lib/i86pc-solaris-thread-multi-64/CORE/perl.h /usr/perl5/5.42/lib/i86pc-solaris-thread-multi-64/CORE/libperl.so
              audit_cmd "legacy Perl 5.10 paths" ls -ld /usr/perl5/5.10.0 /usr/perl5/5.10.0/lib/ExtUtils/xsubpp /usr/perl5/5.10.0/bin/i386/perl /usr/perl5/5.10.0/bin/amd64/perl
              audit_cmd "5.42 architecture-specific Perl paths" ls -ld /usr/perl5/5.42/bin/i386/perl /usr/perl5/5.42/bin/amd64/perl
            } > "$PERL_AUDIT" 2>&1
            cat "$PERL_AUDIT"
            echo "CHECK: /usr/perl5/5.42/lib/ExtUtils/xsubpp"
            test -f /usr/perl5/5.42/lib/ExtUtils/xsubpp
            echo "PASS: Perl 5.42 xsubpp exists"
            echo "CHECK: /usr/perl5/5.42/lib/ExtUtils/typemap"
            test -f /usr/perl5/5.42/lib/ExtUtils/typemap
            echo "PASS: Perl 5.42 typemap exists"
            echo "CHECK: 64-bit Perl CORE headers"
            test -f /usr/perl5/5.42/lib/i86pc-solaris-thread-multi-64/CORE/perl.h
            test -f /usr/perl5/5.42/lib/i86pc-solaris-thread-multi-64/CORE/libperl.so
            echo "PASS: Perl 5.42 64-bit CORE files exist"
            echo "CHECK: /usr/perl5/5.42/bin/perl"
            test -x /usr/perl5/5.42/bin/perl
            echo "CHECK: /usr/bin/perl used by illumos Makefile.master"
            test -x /usr/bin/perl
            PERL_VERSION_OUTPUT=$(/usr/bin/perl -V:version)
            PERL_ARCH_OUTPUT=$(/usr/bin/perl -V:archname)
            test "$PERL_VERSION_OUTPUT" = "version='5.42.3';"
            test "$PERL_ARCH_OUTPUT" = "archname='i86pc-solaris-thread-multi-64';"
            echo "$PERL_VERSION_OUTPUT"
            echo "$PERL_ARCH_OUTPUT"
            /usr/bin/perl -v
          run: |
            set -eu
            LOGDIR="$GITHUB_WORKSPACE/rotfb-build-logs"
            mkdir -p "$LOGDIR"
            printf 'VM diagnostic collector started at %s\n' "$(date -u +%FT%TZ)" > "$LOGDIR/vm-started.txt"

            WORKSPACE="$HOME/illumos-rotfb-work"
            mkdir -p "$WORKSPACE"
            cd "$WORKSPACE"
            git clone https://github.com/illumos/illumos-gate.git
            cd illumos-gate
            git checkout 098e95820891f8a83fae679daece7fcf58b7b3a4
            # illumos.sh uses git describe --all; anchor this pinned detached commit.
            git branch -f rotfb-build HEAD

            ROTFB="$GITHUB_WORKSPACE/illumo_rotfb"
            PATCH_REGRESSION_LOG="$LOGDIR/patch-series-regression.log"
            if ! sh "$ROTFB/tests/rotfb_patch_series_test.sh" \
              "$WORKSPACE/illumos-gate" "$ROTFB/patches" "$WORKSPACE" \
              > "$PATCH_REGRESSION_LOG" 2>&1; then
              cat "$PATCH_REGRESSION_LOG"
              exit 1
            fi
            cat "$PATCH_REGRESSION_LOG"

            PATCH_APPLY_LOG="$LOGDIR/patch-apply.log"
            : > "$PATCH_APPLY_LOG"
            for p in "$ROTFB"/patches/*.patch; do
              [ -f "$p" ] || continue
              echo "CHECK $(basename "$p")" >> "$PATCH_APPLY_LOG"
              if [ "$(basename "$p")" = "0007-gfxp-bitmap-bounds-hardening.patch" ]; then
                TARGET_BITMAP=usr/src/uts/i86pc/io/gfx_private/gfxp_bitmap.c
                git --version > "$LOGDIR/openindiana-git-version.txt"
                cksum "$TARGET_BITMAP" > "$LOGDIR/gfxp_bitmap-pre-0007.cksum"
                cp "$TARGET_BITMAP" "$LOGDIR/gfxp_bitmap-pre-0007.c"
                sed -n '430,475p' "$TARGET_BITMAP" > "$LOGDIR/gfxp_bitmap-pre-0007-context.txt"
                cp "$p" "$LOGDIR/0007-gfxp-bitmap-bounds-hardening.patch"
              fi
              if git apply --check "$p" >> "$PATCH_APPLY_LOG" 2>&1; then
                :
              else
                rc=$?
                printf 'APPLY_CHECK_FAILED %s exit_code=%s\n' "$(basename "$p")" "$rc" >> "$PATCH_APPLY_LOG"
                cat "$PATCH_APPLY_LOG"
                exit "$rc"
              fi
              if git apply "$p" >> "$PATCH_APPLY_LOG" 2>&1; then
                :
              else
                rc=$?
                printf 'APPLY_FAILED %s exit_code=%s\n' "$(basename "$p")" "$rc" >> "$PATCH_APPLY_LOG"
                cat "$PATCH_APPLY_LOG"
                exit "$rc"
              fi
              echo "APPLIED $(basename "$p")" >> "$PATCH_APPLY_LOG"
            done
            if git diff --check > "$LOGDIR/git-diff-check.log" 2>&1; then
              :
            else
              rc=$?
              cat "$LOGDIR/git-diff-check.log"
              exit "$rc"
            fi
            cat "$PATCH_APPLY_LOG"
            git status --short > "$LOGDIR/upstream-patched-status.txt"
            git diff --stat > "$LOGDIR/upstream-patched-diffstat.txt"
            mkdir -p usr/src/uts/i86pc/sys usr/src/uts/i86pc/boot usr/src/uts/i86pc/io/gfx_private
            cp "$ROTFB/rotfb.h" usr/src/uts/i86pc/sys/rotfb.h
            cp "$ROTFB/rotfb_vis_cursor.h" usr/src/uts/i86pc/sys/rotfb_vis_cursor.h
            cp "$ROTFB/rotfb_copy.h" usr/src/uts/i86pc/sys/rotfb_copy.h
            cp "$ROTFB/rotfb_boot.c" usr/src/uts/i86pc/boot/rotfb_boot.c
            cp "$ROTFB/rotfb_runtime.c" usr/src/uts/i86pc/io/gfx_private/rotfb_runtime.c
            chmod 0644 usr/src/uts/i86pc/sys/rotfb.h usr/src/uts/i86pc/sys/rotfb_vis_cursor.h usr/src/uts/i86pc/sys/rotfb_copy.h usr/src/uts/i86pc/boot/rotfb_boot.c usr/src/uts/i86pc/io/gfx_private/rotfb_runtime.c

            cd usr/src
            export CODEMGR_WS="$WORKSPACE/illumos-gate"
            export GATE="$CODEMGR_WS"
            export PATH="/opt/onbld/bin:/usr/bin:/usr/sbin:/usr/gnu/bin"
            sed -e "s/^export NIGHTLY_OPTIONS=.*/export NIGHTLY_OPTIONS='-n'/" \
              -e "s/^export SHADOW_CCS=.*/export SHADOW_CCS=/" \
              -e "s/^export SHADOW_CCCS=.*/export SHADOW_CCCS=/" \
              -e "s/^export ENABLE_SMATCH=.*/export ENABLE_SMATCH=/" \
              tools/env/illumos.sh > /tmp/rotfb-nightly.env
            echo "export PERL_VERSION=5.42" >> /tmp/rotfb-nightly.env
            echo "export PERL_VARIANT=-thread-multi" >> /tmp/rotfb-nightly.env
            echo "export PERL_PKGVERS=-542" >> /tmp/rotfb-nightly.env
            echo "export BUILDPERL32='#'" >> /tmp/rotfb-nightly.env
            echo "export VERSION=illumos-098e958-rotfb" >> /tmp/rotfb-nightly.env
            echo "===== effective Perl build configuration ====="
            if ! grep -F "export PERL_VERSION=5.42" /tmp/rotfb-nightly.env >/dev/null; then
              echo "PERL_VERSION override missing"
              exit 1
            fi
            if ! grep -F "export PERL_VARIANT=-thread-multi" /tmp/rotfb-nightly.env >/dev/null; then
              echo "PERL_VARIANT override missing"
              exit 1
            fi
            if ! grep -F "export PERL_PKGVERS=-542" /tmp/rotfb-nightly.env >/dev/null; then
              echo "PERL_PKGVERS override missing"
              exit 1
            fi
            if ! grep -F "export BUILDPERL32='#'" /tmp/rotfb-nightly.env >/dev/null; then
              echo "Upstream-supported 32-bit Perl module configuration missing"
              exit 1
            fi
            if grep -E '^[[:space:]]*export BUILDPERL64=' /tmp/rotfb-nightly.env >/dev/null; then
              echo "Unexpected: 64-bit Perl modules were disabled"
              exit 1
            fi
            cat /tmp/rotfb-nightly.env
            echo "OpenIndiana has no 32-bit Perl executable; upstream-supported BUILDPERL32='#' skips only 32-bit Perl module targets. No amd64-to-i386 alias is created."

            NIGHTLY_LOG="$LOGDIR/nightly.log"
            BUILD_NOISE_DIR="$LOGDIR/build-noise"
            GATE_LOG_DIR="$LOGDIR/gate-logs"
            mkdir -p "$BUILD_NOISE_DIR" "$GATE_LOG_DIR"
            {
              printf 'nightly_invocation_utc=%s\n' "$(date -u +%FT%TZ)"
              printf 'workflow_run_id=%s\ncommit_sha=%s\nbranch=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF_NAME"
              printf 'workspace=%s\nupstream_commit=098e95820891f8a83fae679daece7fcf58b7b3a4\n' "$CODEMGR_WS"
              echo "===== OpenIndiana environment ====="
              uname -a
              git --version
              ksh93 --version 2>&1 | head -n 2 || true
              pkg info entire 2>&1 || true
            } > "$LOGDIR/build-metadata.txt"

            # Remove only ROTFB final link products and install a real ld-status recorder.
            sh "$ROTFB/rotfb_link_evidence.sh" prepare "$CODEMGR_WS" "$LOGDIR"
            sh "$ROTFB/rotfb_link_evidence.sh" watch "$CODEMGR_WS" "$LOGDIR" > "$LOGDIR/ld-wrapper-watch.log" 2>&1 &
            LD_WATCHER_PID=$!

            # Preserve transient compiler diagnostics while nightly is running.
            (
              while :; do
                find /tmp -maxdepth 3 -type f -path '/tmp/nightly.tmpdir.*/build_noise' -print 2>/dev/null |
                while IFS= read -r f; do
                  d=$(basename "$(dirname "$f")")
                  tmp="$BUILD_NOISE_DIR/$d.txt.partial"
                  cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$BUILD_NOISE_DIR/$d.txt" 2>/dev/null || true
                done
                if [ -d "$CODEMGR_WS/log" ]; then
                  find "$CODEMGR_WS/log" -type f -print 2>/dev/null |
                  while IFS= read -r f; do
                    rel=${f#"$CODEMGR_WS/log"/}
                    rel=$(printf '%s' "$rel" | sed 's/[^A-Za-z0-9._/-]/_/g')
                    mkdir -p "$GATE_LOG_DIR/$(dirname "$rel")"
                    tmp="$GATE_LOG_DIR/$rel.partial"
                    cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$GATE_LOG_DIR/$rel" 2>/dev/null || true
                  done
                fi
                sleep 3
              done
            ) &
            LOG_MONITOR_PID=$!

            # Run nightly asynchronously so the SSH session emits a heartbeat.
            # The NFS-backed workspace makes each diagnostic snapshot visible on the runner immediately.
            ksh93 -x tools/scripts/nightly -n /tmp/rotfb-nightly.env > "$NIGHTLY_LOG" 2>&1 &
            BUILD_PID=$!
            BUILD_RC=0
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              find /tmp -maxdepth 3 -type f -path '/tmp/nightly.tmpdir.*/build_noise' -print 2>/dev/null |
              while IFS= read -r f; do
                d=$(basename "$(dirname "$f")")
                tmp="$BUILD_NOISE_DIR/$d.txt.partial"
                cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$BUILD_NOISE_DIR/$d.txt" 2>/dev/null || true
              done
              if [ -d "$CODEMGR_WS/log" ]; then
                find "$CODEMGR_WS/log" -type f -print 2>/dev/null |
                while IFS= read -r f; do
                  rel=${f#"$CODEMGR_WS/log"/}
                  rel=$(printf '%s' "$rel" | sed 's/[^A-Za-z0-9._/-]/_/g')
                  mkdir -p "$GATE_LOG_DIR/$(dirname "$rel")"
                  tmp="$GATE_LOG_DIR/$rel.partial"
                  cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$GATE_LOG_DIR/$rel" 2>/dev/null || true
                done
              fi
              printf 'OpenIndiana build heartbeat: %s\n' "$(date -u +%FT%TZ)" | tee -a "$LOGDIR/runner-heartbeat.log"
              printf '%s nightly_pid=%s\n' "$(date -u +%FT%TZ)" "$BUILD_PID" > "$LOGDIR/build-state.txt"
              sleep 10
            done
            wait "$BUILD_PID" || BUILD_RC=$?

            # Keep the watcher alive through nightly; tools bootstrap may replace ld.
            : > "$LOGDIR/ld-wrapper-stop"
            LD_WATCHER_RC=0
            wait "$LD_WATCHER_PID" || LD_WATCHER_RC=$?
            if [ ! -f "$LOGDIR/ld-wrapper-ready.txt" ]; then
              LD_WATCHER_RC=1
              echo "linker wrapper did not install before nightly completed" > "$LOGDIR/ld-wrapper-install-failure.txt"
            fi
            printf '%s\n' "$LD_WATCHER_RC" > "$LOGDIR/ld-wrapper-watch-exit-code.txt"

            printf '%s\n' "$BUILD_RC" > "$LOGDIR/nightly-exit-code.txt"
            # NIGHTLY_LOG is already on the NFS-shared workspace; it is persisted during the build.
            cp -f "$NIGHTLY_LOG" "$LOGDIR/nightly.log.final" 2>/dev/null || true
            cp -f /tmp/rotfb-nightly.env "$LOGDIR/rotfb-nightly.env" 2>/dev/null || true

            # Take a final snapshot after nightly exits, then stop the monitor.
            find /tmp -maxdepth 3 -type f -path '/tmp/nightly.tmpdir.*/build_noise' -print 2>/dev/null |
            while IFS= read -r f; do
              d=$(basename "$(dirname "$f")")
              tmp="$BUILD_NOISE_DIR/$d.txt.partial"
              cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$BUILD_NOISE_DIR/$d.txt" 2>/dev/null || true
            done
            if [ -d "$CODEMGR_WS/log" ]; then
              find "$CODEMGR_WS/log" -type f -print 2>/dev/null |
              while IFS= read -r f; do
                rel=${f#"$CODEMGR_WS/log"/}
                rel=$(printf '%s' "$rel" | sed 's/[^A-Za-z0-9._/-]/_/g')
                mkdir -p "$GATE_LOG_DIR/$(dirname "$rel")"
                tmp="$GATE_LOG_DIR/$rel.partial"
                cp -f "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$GATE_LOG_DIR/$rel" 2>/dev/null || true
              done
            fi
            kill "$LOG_MONITOR_PID" 2>/dev/null || true
            wait "$LOG_MONITOR_PID" 2>/dev/null || true

            # Preserve compile command lines as supplementary evidence only.
            grep -E ' -c -o obj64/rotfb_boot\.o .*rotfb_boot\.c' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/rotfb-boot-compile-commands.txt" || true
            grep -E ' -c -o obj64/rotfb_runtime\.o .*rotfb_runtime\.c' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/rotfb-runtime-compile-commands.txt" || true
            grep -E ' -c -o obj64/gfxp_bitmap\.o .*gfxp_bitmap\.c' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/gfxp-bitmap-compile-commands.txt" || true
            grep -E ' -c -o obj64/gfxp_fb\.o .*gfxp_fb\.c' "$GATE_LOG_DIR/nightly.log" > "$LOGDIR/gfxp-fb-compile-commands.txt" || true

            # The evidence helper verifies fresh target files, exact ROTFB link inputs,
            # and the exit status returned by the actual linker process.
            EVIDENCE_RC=0
            if sh "$ROTFB/rotfb_link_evidence.sh" finalize "$CODEMGR_WS" "$LOGDIR" > "$LOGDIR/linker-finalize.log" 2>&1; then
              :
            else
              EVIDENCE_RC=1
            fi
            cat "$LOGDIR/linker-finalize.log"
            if [ "$LD_WATCHER_RC" -ne 0 ]; then
              EVIDENCE_RC=1
            fi
            if [ "$EVIDENCE_RC" -ne 0 ]; then
              BUILD_RC=1
            fi
            printf '%s\n' "$BUILD_RC" > "$LOGDIR/final-build-exit-code.txt"
            printf 'final_build_exit_code=%s\n' "$BUILD_RC" >> "$LOGDIR/rotfb-build-evidence.txt"
            if [ "$BUILD_RC" -ne 0 ]; then
              sed 's/^overall_status=PASS$/overall_status=INCOMPLETE/' "$LOGDIR/rotfb-build-evidence.txt" > "$LOGDIR/rotfb-build-evidence.txt.tmp"
              mv "$LOGDIR/rotfb-build-evidence.txt.tmp" "$LOGDIR/rotfb-build-evidence.txt"
            fi

            # Flatten compiler errors from every captured log into one index.
            {
              echo "===== nightly.log compiler/error context ====="
              grep -n -i -B 4 -A 8 -E '(^|[[:space:]])(fatal[[:space:]]+)?error:|ld:[[:space:]]+fatal:|undefined symbol|syntax error|dmake:.*failed|Don.t know how to make' "$NIGHTLY_LOG" || true
              for f in "$BUILD_NOISE_DIR"/*.txt "$GATE_LOG_DIR"/*; do
                [ -f "$f" ] || continue
                echo "===== $f ====="
                grep -n -i -B 4 -A 8 -E '(^|[[:space:]])(fatal[[:space:]]+)?error:|ld:[[:space:]]+fatal:|undefined symbol|syntax error|dmake:.*failed|Don.t know how to make' "$f" || true
              done
            } > "$LOGDIR/compiler-error-index.txt"

            {
              echo "Collected at $(date -u +%FT%TZ)"
              find "$LOGDIR" -type f -exec ls -ln {} \; 2>&1 || true
            } > "$LOGDIR/collected-files.txt"
            echo "===== nightly tail ====="
            tail -n 300 "$NIGHTLY_LOG" || true
            exit "$BUILD_RC"

      - name: Finalize diagnostic index on runner
        if: always()
        shell: bash
        run: |
          set +e
          LOGDIR="$GITHUB_WORKSPACE/rotfb-build-logs"
          mkdir -p "$LOGDIR"
          {
            echo "Runner-side diagnostic index generated at $(date -u +%FT%TZ)"
            echo "This step runs even when the OpenIndiana VM/SSH step fails."
            echo
            find "$LOGDIR" -type f -printf '%p %s bytes %TY-%Tm-%TdT%TH:%TM:%TS\n' | sort
          } > "$LOGDIR/runner-file-index.txt"
          {
            echo "===== compiler/build error scan ====="
            find "$LOGDIR" -type f ! -name 'runner-error-index.txt' -print0 |
            while IFS= read -r -d '' f; do
              if grep -Iq . "$f"; then
                matches=$(grep -n -i -B 5 -A 10 -E '(^|[[:space:]])(fatal[[:space:]]+)?error:|ld:[[:space:]]+fatal:|undefined symbol|syntax error|dmake:.*failed|don.t know how to make|(^|[^[:alnum:]_])(failed|killed)([^[:alnum:]_]|$)|(^|[^[:alnum:]_])cannot[[:space:]]+(open|find|read|write|create|remove|unlink|rename|access|load|resolve|locate|allocate|map|execute|compile|link|install|build|stat|mount|connect|bind|start|stop|be[[:space:]]+(opened|found|read|written|created|removed|loaded|resolved|located|allocated|mapped|executed|compiled|linked|installed|built|mounted|connected|bound|started|stopped))([^[:alnum:]_]|$)|out of memory|panic(:|\[)|segmentation fault|ssh exited' "$f" 2>/dev/null)
                if [ -n "$matches" ]; then
                  printf '\n===== %s =====\n%s\n' "$f" "$matches"
                fi
              fi
            done
          } > "$LOGDIR/runner-error-index.txt"
          echo "===== diagnostic files ====="
          cat "$LOGDIR/runner-file-index.txt"
          echo "===== error scan ====="
          cat "$LOGDIR/runner-error-index.txt"

      - name: Capture workflow outcomes and prepare diagnostic artifacts
        id: prepare_artifacts
        if: always()
        shell: bash
        env:
          MODEL_OUTCOME: ${{ steps.host_model.outcome }}
          LINK_TEST_OUTCOME: ${{ steps.host_link_evidence.outcome }}
          VIS_CURSOR_OUTCOME: ${{ steps.host_vis_cursor.outcome }}
          BITMAP_COPY_OUTCOME: ${{ steps.host_bitmap_copy.outcome }}
          RUNTIME_OUTCOME: ${{ steps.host_runtime.outcome }}
          CALLBACK_OUTCOME: ${{ steps.callback_harness.outcome }}
          OPENINDIANA_OUTCOME: ${{ steps.openindiana_vm.outcome }}
        run: |
          set +e
          mkdir -p rotfb-build-logs rotfb-build-diagnostics rotfb-test-results
          {
            echo "workflow=build-illumos"
            echo "run_id=$GITHUB_RUN_ID"
            echo "event=$GITHUB_EVENT_NAME"
            echo "branch=$GITHUB_REF_NAME"
            echo "commit_sha=$GITHUB_SHA"
            echo "upstream_sha=098e95820891f8a83fae679daece7fcf58b7b3a4"
            echo "completed_utc=$(date -u +%FT%TZ)"
          } > rotfb-build-diagnostics/run-metadata.txt
          {
            printf 'host_model\t%s\n' "$MODEL_OUTCOME"
            printf 'host_link_evidence\t%s\n' "$LINK_TEST_OUTCOME"
            printf 'host_vis_cursor\t%s\n' "$VIS_CURSOR_OUTCOME"
            printf 'host_bitmap_copy\t%s\n' "$BITMAP_COPY_OUTCOME"
            printf 'host_runtime\t%s\n' "$RUNTIME_OUTCOME"
            printf 'callback_harness\t%s\n' "$CALLBACK_OUTCOME"
            printf 'openindiana_vm\t%s\n' "$OPENINDIANA_OUTCOME"
          } > rotfb-build-diagnostics/step-outcomes.tsv
          : > rotfb-build-diagnostics/failure-context.txt
          while IFS="$(printf '\t')" read -r step outcome; do
            [ "$outcome" = success ] || printf 'step=%s outcome=%s\n' "$step" "$outcome" >> rotfb-build-diagnostics/failure-context.txt
          done < rotfb-build-diagnostics/step-outcomes.tsv
          [ -s rotfb-build-diagnostics/failure-context.txt ] || echo "no failed or skipped runner steps recorded" > rotfb-build-diagnostics/failure-context.txt
          for f in rotfb-build-logs/runner-error-index.txt rotfb-build-logs/runner-file-index.txt rotfb-build-logs/rotfb-build-evidence.txt rotfb-build-logs/patch-apply.log rotfb-build-logs/nightly-exit-code.txt rotfb-build-logs/final-build-exit-code.txt; do [ ! -f "$f" ] || cp "$f" rotfb-build-diagnostics/; done
          {
            echo "===== diagnostic file index ====="
            find rotfb-build-logs rotfb-test-results rotfb-build-diagnostics -type f -printf '%p %s bytes\n' 2>/dev/null | sort
          } > rotfb-build-diagnostics/file-index.txt

      - name: Resolve same-commit callback and DDI workflow results
        id: independent_workflows
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p rotfb-build-diagnostics
          API_LOG=rotfb-build-diagnostics/independent-workflow-query.log
          RESULT=rotfb-build-diagnostics/independent-workflows.tsv
          : > "$API_LOG"
          callback_line=""
          ddi_line=""
          for attempt in $(seq 1 60); do
            response=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" 2>>"$API_LOG")
            if [ "$?" -eq 0 ]; then
              callback_line=$(printf '%s' "$response" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/rotfb-callback-tests.yml" and .event == "push")] | sort_by(.created_at) | last // empty | [.id,.status,.conclusion] | @tsv')
              ddi_line=$(printf '%s' "$response" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/rotfb-ddi-integration.yml" and .event == "push")] | sort_by(.created_at) | last // empty | [.id,.status,.conclusion] | @tsv')
              cbstate=$(printf '%s' "$callback_line" | awk -F '\t' '{print $2}')
              ddistate=$(printf '%s' "$ddi_line" | awk -F '\t' '{print $2}')
              [ "$cbstate" = completed ] && [ "$ddistate" = completed ] && break
            fi
            sleep 10
          done
          printf 'callback_only\t%s\nddi_integration\t%s\n' "${callback_line:-NOT_FOUND}" "${ddi_line:-NOT_FOUND}" > "$RESULT"

      - name: Upload build logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotfb-build-logs-${{ github.run_id }}-${{ github.sha }}
          path: rotfb-build-logs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        id: upload_diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotfb-build-diagnostics-${{ github.run_id }}-${{ github.sha }}
          path: rotfb-build-diagnostics/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotfb-test-results-${{ github.run_id }}-${{ github.sha }}
          path: rotfb-test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Publish full-build acceptance summary
        id: job_summary
        if: always()
        shell: bash
        env:
          MODEL_OUTCOME: ${{ steps.host_model.outcome }}
          LINK_TEST_OUTCOME: ${{ steps.host_link_evidence.outcome }}
          VIS_CURSOR_OUTCOME: ${{ steps.host_vis_cursor.outcome }}
          BITMAP_COPY_OUTCOME: ${{ steps.host_bitmap_copy.outcome }}
          RUNTIME_OUTCOME: ${{ steps.host_runtime.outcome }}
          CALLBACK_OUTCOME: ${{ steps.callback_harness.outcome }}
          OPENINDIANA_OUTCOME: ${{ steps.openindiana_vm.outcome }}
          LOGS_UPLOAD_OUTCOME: ${{ steps.upload_logs.outcome }}
          DIAGNOSTICS_UPLOAD_OUTCOME: ${{ steps.upload_diagnostics.outcome }}
          TESTS_UPLOAD_OUTCOME: ${{ steps.upload_test_results.outcome }}
        run: |
          set +e
          status_from_outcome() { [ "$1" = success ] && echo PASS || { [ "$1" = skipped ] && echo SKIPPED || echo FAIL; }; }
          host_status=PASS
          for outcome in "$MODEL_OUTCOME" "$LINK_TEST_OUTCOME" "$VIS_CURSOR_OUTCOME" "$BITMAP_COPY_OUTCOME" "$RUNTIME_OUTCOME"; do [ "$outcome" = success ] || host_status=FAIL; done
          patch_status=SKIPPED; patch_detail="OpenIndiana patch-apply stage did not run"
          if [ -f rotfb-build-logs/patch-apply.log ]; then
            applied=$(grep -c '^APPLIED ' rotfb-build-logs/patch-apply.log 2>/dev/null); applied=${applied:-0}
            series=$(grep -c '^PATCH_SERIES_STATUS=PASS$' rotfb-build-logs/patch-series-regression.log 2>/dev/null); series=${series:-0}
            if [ "$applied" -eq 13 ] && [ "$series" -eq 1 ]; then patch_status=PASS; patch_detail="13/13 patches applied; ordered series regression PASS"; else patch_status=FAIL; patch_detail="$applied/13 applied; series PASS count=$series"; fi
          fi
          cbrow=$(awk -F '\t' '$1=="callback_only"{print $2}' rotfb-build-diagnostics/independent-workflows.tsv 2>/dev/null)
          ddirow=$(awk -F '\t' '$1=="ddi_integration"{print $2}' rotfb-build-diagnostics/independent-workflows.tsv 2>/dev/null)
          IFS="$(printf '\t')" read -r cbid cbstate cbresult <<< "$cbrow"
          IFS="$(printf '\t')" read -r ddiid ddistate ddiresult <<< "$ddirow"
          callback_status=SKIPPED
          if [ "$CALLBACK_OUTCOME" != success ]; then callback_status=FAIL; elif [ "$cbstate" = completed ]; then [ "$cbresult" = success ] && callback_status=PASS || callback_status=FAIL; fi
          ddi_status=SKIPPED
          if [ "$ddistate" = completed ]; then [ "$ddiresult" = success ] && ddi_status=PASS || ddi_status=FAIL; fi
          vm_status=$(status_from_outcome "$OPENINDIANA_OUTCOME")
          nightly_status=SKIPPED
          if [ -f rotfb-build-logs/nightly-exit-code.txt ]; then
            nrc=$(cat rotfb-build-logs/nightly-exit-code.txt); frc=$(cat rotfb-build-logs/final-build-exit-code.txt 2>/dev/null)
            [ "$nrc" = 0 ] && [ "$frc" = 0 ] && nightly_status=PASS || nightly_status=FAIL
          fi
          linker_status=SKIPPED
          if [ -f rotfb-build-logs/rotfb-build-evidence.txt ]; then
            n=$(grep -c '^status=PASS$' rotfb-build-logs/rotfb-build-evidence.txt 2>/dev/null); n=${n:-0}
            [ "$n" -eq 6 ] && grep -q '^overall_status=PASS$' rotfb-build-logs/rotfb-build-evidence.txt && linker_status=PASS || linker_status=FAIL
          fi
          artifact_status=PASS
          [ "$LOGS_UPLOAD_OUTCOME" = success ] && [ "$DIAGNOSTICS_UPLOAD_OUTCOME" = success ] && [ "$TESTS_UPLOAD_OUTCOME" = success ] || artifact_status=FAIL
          {
            echo "# ROTFB full OpenIndiana build"
            echo "- Run: [#$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Upstream: \`098e95820891f8a83fae679daece7fcf58b7b3a4\`"
            echo
            echo "| Stage | Status | Result |"
            echo "|---|---|---|"
            echo "| Patch application | $patch_status | $patch_detail |"
            echo "| Host regression | $host_status | model=$MODEL_OUTCOME; linker=$LINK_TEST_OUTCOME; cursor=$VIS_CURSOR_OUTCOME; copy=$BITMAP_COPY_OUTCOME; runtime=$RUNTIME_OUTCOME |"
            echo "| Callback harness | $callback_status | in-build=$CALLBACK_OUTCOME; callback-only=$cbid/$cbresult |"
            echo "| DDI integration | $ddi_status | run_id=$ddiid result=$ddiresult |"
            echo "| OpenIndiana VM | $vm_status | outcome=$OPENINDIANA_OUTCOME |"
            echo "| Nightly build | $nightly_status | exit=$nrc final=$frc |"
            echo "| Linker verification | $linker_status | 6 target records required |"
            echo "| Artifact upload | $artifact_status | logs=$LOGS_UPLOAD_OUTCOME; diagnostics=$DIAGNOSTICS_UPLOAD_OUTCOME; tests=$TESTS_UPLOAD_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$patch_status" != PASS ] || [ "$host_status" != PASS ] || [ "$callback_status" != PASS ] || [ "$ddi_status" != PASS ] || [ "$vm_status" != PASS ] || [ "$nightly_status" != PASS ] || [ "$linker_status" != PASS ] || [ "$artifact_status" != PASS ]; then echo "FULL_BUILD_ACCEPTANCE=FAIL" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "FULL_BUILD_ACCEPTANCE=PASS" >> "$GITHUB_STEP_SUMMARY"
