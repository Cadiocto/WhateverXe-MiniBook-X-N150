# ROTFB: use the custom illumos framebuffer DDX for the entire Xorg server.
# Install as /etc/X11/xorg.conf for the isolated ROTFB test Boot Environment.
# Do not combine with the legacy kernel ROTFB patches.

Section "ServerLayout"
    Identifier  "ROTFB Layout"
    Screen      0 "ROTFB Screen"
EndSection

Section "Device"
    Identifier  "ROTFB Device"
    Driver      "illumosfb"
    Option      "Device"   "/dev/fb0"
    Option      "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier  "ROTFB Screen"
    Device      "ROTFB Device"
    DefaultDepth 24
EndSection
